name: Documentation

on:
  push:
    branches: [main]
    paths: ['docs/**', 'scripts/*docs*.py', 'justfile', '.github/workflows/docs.yml']
  pull_request:
    branches: [main]
    paths: ['docs/**', 'scripts/*docs*.py', 'justfile', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build Zensical site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build documentation
        working-directory: docs
        run: uv run --no-project --with zensical==0.0.61 python ../scripts/build-docs.py
      - name: Check generated pages
        run: python scripts/check-docs.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site

  deploy:
    if: github.repository == 'DeepLink-org/Persisting' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
