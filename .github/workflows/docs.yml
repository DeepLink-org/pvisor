name: Documentation

on:
  push:
    branches: [main, develop, next]
    paths:
      - 'docs/**'
      - 'benchmark/**'
      - 'tools/semspec/**'
      - 'scripts/*docs*.py'
      - 'scripts/check-reference.py'
      - 'tests/test_docs.py'
      - 'mise.toml'
      - 'mise.lock'
      - 'tests/tasks.toml'
      - 'scripts/tasks/**'
      - 'tests/tasks/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/actions/setup-build-env/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main, develop, next]
    paths:
      - 'docs/**'
      - 'benchmark/**'
      - 'tools/semspec/**'
      - 'scripts/*docs*.py'
      - 'scripts/check-reference.py'
      - 'tests/test_docs.py'
      - 'mise.toml'
      - 'mise.lock'
      - 'tests/tasks.toml'
      - 'scripts/tasks/**'
      - 'tests/tasks/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/actions/setup-build-env/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build Zensical site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build-env
        with:
          tools: python uv rust
          setup: python
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: docs-semspec
          workspaces: tools/semspec -> ../../target/semspec
      - name: Test documentation checks
        run: mise run test-py -- tests/test_docs.py
      - name: Build and check documentation
        run: mise run docs-build -- --require-recorded
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site

  deploy:
    if: github.repository == 'DeepLink-org/pvisor' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
