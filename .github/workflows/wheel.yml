name: Build Wheels

on:
  workflow_call:
    inputs:
      artifact_prefix:
        required: true
        type: string
      local_version:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Wheel / ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
          - platform: macos-arm64
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build-env
        with:
          rust: "true"
          install-zig: "true"
      - uses: Swatinem/rust-cache@v2

      - name: Apply nightly local version (PEP 440)
        if: inputs.local_version != ''
        env:
          LOCAL_VERSION: ${{ inputs.local_version }}
        run: |
          python scripts/ci/set_nightly_local_version.py "$LOCAL_VERSION"
          cargo metadata --format-version 1 >/dev/null

      - name: Build wheel
        uses: pypa/cibuildwheel@v4.1.0
        with:
          output-dir: dist

      - name: Verify wheel and installation
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          python scripts/packaging/verify_wheel.py "${wheels[0]}" --install-smoke

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_prefix }}-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14
