name: Build Wheels

on:
  workflow_call:
    inputs:
      artifact_prefix:
        required: true
        type: string
      local_version:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Wheel / ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
          - platform: macos-arm64
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build-env
        with:
          rust: "true"
      - uses: Swatinem/rust-cache@v2

      - name: Apply nightly local version (PEP 440)
        if: inputs.local_version != ''
        env:
          LOCAL_VERSION: ${{ inputs.local_version }}
        run: |
          python scripts/ci/set_nightly_local_version.py "$LOCAL_VERSION"
          cargo metadata --format-version 1 >/dev/null

      - name: Build wheel
        uses: pypa/cibuildwheel@v4.1.0
        env:
          # Run inside the build environment to reuse its immutable firmware cache.
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >-
            auditwheel repair -w {dest_dir} {wheel} &&
            python -m pip install pyelftools==0.33 &&
            mkdir -p /output &&
            python {project}/scripts/build-firmware.py
            --source-output {project}/target/libkrunfw.SOURCE
            --source-archive /output/pvisor-firmware-source-linux-x86_64.tar.gz
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: >-
            cp {wheel} {dest_dir} &&
            python -m pip install pyelftools==0.33 &&
            python {project}/scripts/build-firmware.py
            --source-output {project}/target/libkrunfw.SOURCE
            --source-archive {project}/dist/pvisor-firmware-source-macos-arm64.tar.gz
        with:
          output-dir: dist

      - name: Verify wheel and installation
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          python scripts/packaging/verify_wheel.py "${wheels[0]}" --install-smoke

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_prefix }}-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14

      # Deliberately outside the wheel artifact pattern: never send source tarballs to PyPI.
      - name: Upload corresponding firmware source
        uses: actions/upload-artifact@v4
        with:
          name: firmware-source-${{ inputs.artifact_prefix }}-${{ matrix.platform }}
          path: dist/pvisor-firmware-source-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
          retention-days: 14
