name: Build Wheels

on:
  workflow_call:
    inputs:
      artifact_prefix:
        required: true
        type: string
      local_version:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Wheel / ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
          - platform: macos-arm64
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build-env
        with:
          native-firmware: "true"
      - uses: Swatinem/rust-cache@v2

      - name: Apply nightly local version (PEP 440)
        if: inputs.local_version != ''
        env:
          LOCAL_VERSION: ${{ inputs.local_version }}
        run: |
          mise run set-nightly-version -- "$LOCAL_VERSION"

      - name: Build wheel
        run: mise run wheel
        env:
          PVISOR_WHEEL_PORTABLE: "1"
          # Run inside the build environment to reuse its immutable firmware cache.
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >-
            PVISOR_FW_SOURCE_ARCHIVE=/output/pvisor-firmware-source-linux-x86_64.tar.gz
            mise -C {project} run repair-wheel -- {wheel} {dest_dir}
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: >-
            PVISOR_FW_SOURCE_ARCHIVE={project}/dist/pvisor-firmware-source-macos-arm64.tar.gz
            mise -C {project} run repair-wheel -- {wheel} {dest_dir}

      - name: Verify native archive installation and companion symlinks
        shell: bash
        run: |
          for wheel in dist/pvisor_sandbox-*.whl; do
            version="$(python3 -c 'from pvisor import __version__; print(__version__)')"
            python3 scripts/ci/build_release_assets.py "$wheel" --version "$version" --smoke-wheel
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_prefix }}-${{ matrix.platform }}
          path: dist/pvisor_sandbox-*.whl
          if-no-files-found: error
          retention-days: 14

      # Deliberately outside the wheel artifact pattern: never send source tarballs to PyPI.
      - name: Upload corresponding firmware source
        uses: actions/upload-artifact@v4
        with:
          name: firmware-source-${{ inputs.artifact_prefix }}-${{ matrix.platform }}
          path: dist/pvisor-firmware-source-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
          retention-days: 14
