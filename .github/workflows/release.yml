name: Publish PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    if: github.repository == 'DeepLink-org/pvisor'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-build-env
        with:
          tools: python rust
          setup: none

      - name: Fetch main release boundary
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Validate tag, versions, and lockfile
        id: version
        shell: bash
        run: |
          args=(--main-ref origin/main)
          if [[ "${{ github.event_name }}" == "push" ]]; then
            args+=(--tag "${GITHUB_REF_NAME}")
          fi
          version="$(mise run check-release-version -- "${args[@]}")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  quality:
    name: Required CI at release SHA
    needs: validate
    uses: ./.github/workflows/ci.yml

  wheels:
    needs: [validate, quality]
    uses: ./.github/workflows/wheel.yml
    with:
      artifact_prefix: release-wheel

  acceptance:
    name: Installed wheel acceptance / ${{ matrix.platform }}
    needs: wheels
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: [self-hosted, linux, x64, pvisor-release]
          - platform: macos-arm64
            runner: [self-hosted, macOS, ARM64, pvisor-release]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build-env
        with:
          tools: python rust
          setup: none
      - uses: actions/download-artifact@v4
        with:
          name: release-wheel-${{ matrix.platform }}
          path: dist
      - name: Exercise installed product and native VM recovery
        shell: bash
        run: |
          set -euo pipefail
          for wheel in dist/*.whl; do
            mise run accept-wheel -- "$wheel" "$RUNNER_TEMP/pvisor-release-acceptance/result.json"
          done
      - name: Retain acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-acceptance-${{ matrix.platform }}
          path: ${{ runner.temp }}/pvisor-release-acceptance/
          if-no-files-found: warn
          retention-days: 30

  verify:
    name: Verify release artifact set
    needs: [validate, wheels, acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-build-env
        with:
          tools: python
          setup: none

      - name: Download platform wheels
        uses: actions/download-artifact@v4
        with:
          pattern: release-wheel-*
          merge-multiple: true
          path: dist

      - name: Check completeness and package metadata
        run: |
          mise run check-release-artifacts -- \
            dist --version "${{ needs.validate.outputs.version }}"

      - name: Upload verified release set
        uses: actions/upload-artifact@v4
        with:
          name: release-wheels
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 30

  pypi-publish:
    name: Publish to PyPI
    if: github.event_name == 'push'
    # Publish binaries to PyPI only after their corresponding sources are public.
    needs: [validate, verify, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/pvisor
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build-env
        with:
          tools: python
          setup: none
      - name: Download verified release set
        uses: actions/download-artifact@v4
        with:
          name: release-wheels
          path: dist

      - name: Verify immutable PyPI retries
        id: pending
        run: mise run publish-release -- pypi dist --version "${{ needs.validate.outputs.version }}"

      - name: Publish package distributions
        if: steps.pending.outputs.pending == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: false

  github-release:
    name: Publish GitHub Release
    if: github.event_name == 'push'
    needs: [validate, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build-env
        with:
          tools: python
          setup: none
      - name: Download verified release set
        uses: actions/download-artifact@v4
        with:
          name: release-wheels
          path: dist

      - name: Download corresponding firmware sources
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-source-release-wheel-*
          merge-multiple: true
          path: dist

      - name: Require complete corresponding firmware source set
        run: |
          test -s dist/pvisor-firmware-source-linux-x86_64.tar.gz
          test -s dist/pvisor-firmware-source-macos-arm64.tar.gz

      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          mise run publish-release -- github dist --version "$RELEASE_VERSION" \
            --repository "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME"
