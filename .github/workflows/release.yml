name: Publish PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    if: github.repository == 'DeepLink-org/pvisor'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-build-env

      - uses: dtolnay/rust-toolchain@stable

      - name: Fetch main release boundary
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Validate tag, versions, and lockfile
        id: version
        shell: bash
        run: |
          args=(--main-ref origin/main)
          if [[ "${{ github.event_name }}" == "push" ]]; then
            args+=(--tag "${GITHUB_REF_NAME}")
          fi
          version="$(just check-release-version "${args[@]}")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  wheels:
    needs: validate
    uses: ./.github/workflows/wheel.yml
    with:
      artifact_prefix: release-wheel

  verify:
    name: Verify release artifact set
    needs: [validate, wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-build-env

      - name: Download platform wheels
        uses: actions/download-artifact@v4
        with:
          pattern: release-wheel-*
          merge-multiple: true
          path: dist

      - name: Check completeness and package metadata
        run: |
          just check-release-artifacts \
            dist --version "${{ needs.validate.outputs.version }}"

      - name: Upload verified release set
        uses: actions/upload-artifact@v4
        with:
          name: release-wheels
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 30

  pypi-publish:
    name: Publish to PyPI
    if: github.event_name == 'push'
    # Publish binaries to PyPI only after their corresponding sources are public.
    needs: [validate, verify, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/pvisor
    permissions:
      id-token: write
    steps:
      - name: Download verified release set
        uses: actions/download-artifact@v4
        with:
          name: release-wheels
          path: dist

      - name: Publish package distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  github-release:
    name: Publish GitHub Release
    if: github.event_name == 'push'
    needs: [validate, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download verified release set
        uses: actions/download-artifact@v4
        with:
          name: release-wheels
          path: dist

      - name: Download corresponding firmware sources
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-source-release-wheel-*
          merge-multiple: true
          path: dist

      - name: Require complete corresponding firmware source set
        run: |
          test -s dist/pvisor-firmware-source-linux-x86_64.tar.gz
          test -s dist/pvisor-firmware-source-macos-arm64.tar.gz

      - name: Create or repair GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.whl dist/pvisor-firmware-source-*.tar.gz \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.whl dist/pvisor-firmware-source-*.tar.gz \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --latest \
              --title "pVisor ${RELEASE_VERSION}"
          fi
