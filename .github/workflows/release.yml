name: Publish Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    if: github.repository == 'DeepLink-org/pvisor'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-build-env
        with:
          tools: python rust
          setup: none

      - name: Fetch main release boundary
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Validate tag, versions, and lockfile
        id: version
        shell: bash
        run: |
          args=(--main-ref origin/main)
          if [[ "${{ github.event_name }}" == "push" ]]; then
            args+=(--tag "${GITHUB_REF_NAME}")
          fi
          version="$(mise run check-release-version -- "${args[@]}")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  quality:
    name: Required CI at release SHA
    needs: validate
    uses: ./.github/workflows/ci.yml

  wheels:
    needs: [validate, quality]
    uses: ./.github/workflows/wheel.yml
    with:
      artifact_prefix: release-wheel

  acceptance:
    name: Installed wheel acceptance / ${{ matrix.platform }}
    needs: wheels
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: [self-hosted, linux, x64, pvisor-release]
          - platform: macos-arm64
            runner: [self-hosted, macOS, ARM64, pvisor-release]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build-env
        with:
          tools: python rust
          setup: none
      - uses: actions/download-artifact@v4
        with:
          name: release-wheel-${{ matrix.platform }}
          path: dist
      - name: Exercise installed product and native VM recovery
        shell: bash
        run: |
          set -euo pipefail
          for wheel in dist/*.whl; do
            mise run accept-wheel -- "$wheel" "$RUNNER_TEMP/pvisor-release-acceptance/result.json"
          done
      - name: Retain acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-acceptance-${{ matrix.platform }}
          path: ${{ runner.temp }}/pvisor-release-acceptance/
          if-no-files-found: warn
          retention-days: 30

  verify:
    name: Verify release artifact set
    needs: [validate, wheels, acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-build-env
        with:
          tools: python
          setup: none

      - name: Download platform wheels
        uses: actions/download-artifact@v4
        with:
          pattern: release-wheel-*
          merge-multiple: true
          path: dist

      - name: Check completeness and package metadata
        run: |
          mise run check-release-artifacts -- \
            dist --version "${{ needs.validate.outputs.version }}"

      - name: Download corresponding firmware sources
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-source-release-wheel-*
          merge-multiple: true
          path: dist

      - name: Prepare all distribution channels (dry run included)
        run: |
          python3 scripts/ci/build_release_assets.py dist --stable \
            --version "${{ needs.validate.outputs.version }}" --repository "$GITHUB_REPOSITORY"

      - name: Retain native downloads and Homebrew formula
        uses: actions/upload-artifact@v4
        with:
          name: release-native
          path: |
            dist/pvisor-*.tar.gz
            dist/pvisor.rb
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Upload verified release set
        uses: actions/upload-artifact@v4
        with:
          name: release-wheels
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 30

  pypi-publish:
    name: Publish to PyPI
    if: github.event_name == 'push'
    # Publish binaries to PyPI only after their corresponding sources are public.
    needs: [validate, verify, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/pvisor
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build-env
        with:
          tools: python
          setup: none
      - name: Download verified release set
        uses: actions/download-artifact@v4
        with:
          name: release-wheels
          path: dist

      - name: Verify immutable PyPI retries
        id: pending
        run: mise run publish-release -- pypi dist --version "${{ needs.validate.outputs.version }}"

      - name: Publish package distributions
        if: steps.pending.outputs.pending == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: false

  github-release:
    name: Publish GitHub Release
    if: github.event_name == 'push'
    needs: [validate, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build-env
        with:
          tools: python
          setup: none
      - name: Download verified release set
        uses: actions/download-artifact@v4
        with:
          name: release-wheels
          path: dist

      - name: Download verified native release set
        uses: actions/download-artifact@v4
        with:
          name: release-native
          path: dist

      - name: Require complete corresponding firmware sources
        run: |
          test -s dist/pvisor-firmware-source-linux-x86_64.tar.gz
          test -s dist/pvisor-firmware-source-macos-arm64.tar.gz

      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          mise run publish-release -- github dist --version "$RELEASE_VERSION" \
            --repository "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME"

  homebrew-test:
    name: Test Homebrew installation
    if: github.event_name == 'push'
    needs: [validate, github-release]
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-native
          path: dist
      - name: Install and test the published archive through Homebrew
        shell: bash
        run: |
          set -euo pipefail
          brew tap-new pvisor/release-test
          cp dist/pvisor.rb "$(brew --repository pvisor/release-test)/Formula/pvisor.rb"
          brew install pvisor/release-test/pvisor
          brew test pvisor/release-test/pvisor
          brew uninstall pvisor/release-test/pvisor

  homebrew-publish:
    name: Update project Homebrew tap
    if: github.event_name == 'push' && vars.HOMEBREW_TAP_REPOSITORY != ''
    needs: [github-release, homebrew-test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: homebrew-tap
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - uses: actions/download-artifact@v4
        with:
          name: release-native
          path: dist
      - name: Commit the tested formula
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tap/Formula
          # A delayed older release must never downgrade the current tap.
          python3 - <<'PYTHON'
          import re
          from pathlib import Path
          def version(path):
              match = re.search(r'^  version "([0-9]+)\.([0-9]+)\.([0-9]+)"$', path.read_text(), re.M)
              if not match:
                  raise SystemExit(f"Cannot read stable formula version: {path}")
              return tuple(map(int, match.groups()))
          current = Path("tap/Formula/pvisor.rb")
          if current.exists() and version(current) > version(Path("dist/pvisor.rb")):
              raise SystemExit("Refusing to downgrade the Homebrew tap")
          PYTHON
          cp dist/pvisor.rb tap/Formula/pvisor.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/pvisor.rb
          if ! git diff --cached --quiet; then
            git commit -m "pvisor $RELEASE_TAG"
            git push
          fi
