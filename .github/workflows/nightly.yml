# Nightly wheels from main — rolling GitHub Release tag `nightly`.
#
# Install (after a successful run):
#   curl -fsSL https://raw.githubusercontent.com/DeepLink-org/Persisting/main/scripts/install-nightly.sh | bash
# Or browse assets: https://github.com/DeepLink-org/Persisting/releases/tag/nightly

name: Nightly Build

on:
  schedule:
    # 03:00 UTC daily
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    if: github.repository == 'DeepLink-org/Persisting'
    runs-on: ubuntu-latest
    outputs:
      local_version: ${{ steps.ver.outputs.local_version }}
    steps:
      - id: ver
        shell: bash
        run: |
          short_sha="${GITHUB_SHA:0:7}"
          echo "local_version=g${GITHUB_RUN_NUMBER}.${short_sha}" >> "$GITHUB_OUTPUT"

  linux:
    if: github.repository == 'DeepLink-org/Persisting'
    needs: meta
    uses: ./.github/workflows/wheel.yml
    with:
      runner: ubuntu-latest
      artifact_name: nightly-wheels-linux-x86_64
      retention_days: 14
      local_version: ${{ needs.meta.outputs.local_version }}

  macos:
    if: github.repository == 'DeepLink-org/Persisting'
    needs: meta
    uses: ./.github/workflows/wheel.yml
    with:
      runner: macos-latest
      artifact_name: nightly-wheels-macos-aarch64
      retention_days: 14
      local_version: ${{ needs.meta.outputs.local_version }}

  publish:
    name: Publish nightly release
    if: github.repository == 'DeepLink-org/Persisting'
    needs: [meta, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: nightly-wheels-*
          merge-multiple: true
          path: dist

      - name: Publish rolling nightly release
        uses: ncipollo/release-action@v1
        with:
          tag: nightly
          name: Nightly (main)
          commit: ${{ github.sha }}
          allowUpdates: true
          makeLatest: false
          prerelease: true
          removeArtifacts: true
          artifactErrorsFailBuild: true
          artifacts: dist/*.whl
          body: |
            Rolling nightly build from [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) on **${{ github.ref_name }}**.

            **Python wheel** (auto-detect platform / Python):

            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install-nightly.sh | bash
            ```

            The wheel includes the matched `pvisor` CLI. Built with local version `+${{ needs.meta.outputs.local_version }}` (base version from `pyproject.toml`).
