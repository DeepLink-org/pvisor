name: Nightly Build

on:
  schedule:
    # 03:00 UTC daily
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pvisor-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    if: github.repository == 'DeepLink-org/pvisor' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      local_version: ${{ steps.ver.outputs.local_version }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build-env
        with:
          tools: python
          setup: none
      - id: ver
        shell: bash
        run: |
          version="$(mise run check-release-version -- --skip-lockfile)"
          local_version="g${GITHUB_RUN_NUMBER}.${GITHUB_SHA:0:7}"
          echo "local_version=$local_version" >> "$GITHUB_OUTPUT"
          echo "version=$version+$local_version" >> "$GITHUB_OUTPUT"

  wheels:
    needs: meta
    uses: ./.github/workflows/wheel.yml
    with:
      artifact_prefix: nightly-wheel
      local_version: ${{ needs.meta.outputs.local_version }}

  publish:
    name: Publish nightly release
    needs: [meta, wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-build-env
        with:
          tools: python
          setup: none

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: nightly-wheel-*
          merge-multiple: true
          path: dist

      - name: Download corresponding firmware sources
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-source-nightly-wheel-*
          merge-multiple: true
          path: dist

      - name: Require complete corresponding firmware source set
        run: |
          test -s dist/pvisor-firmware-source-linux-x86_64.tar.gz
          test -s dist/pvisor-firmware-source-macos-arm64.tar.gz

      - name: Verify complete nightly artifact set
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: mise run check-release-artifacts -- dist --version "$VERSION"

      - name: Prepare native downloads and checksums
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          python3 scripts/ci/build_release_assets.py dist \
            --version "$VERSION" --repository "$GITHUB_REPOSITORY"

      - name: Publish rolling nightly release
        uses: ncipollo/release-action@v1
        with:
          tag: nightly
          name: pVisor Nightly (main)
          commit: ${{ github.sha }}
          allowUpdates: true
          makeLatest: false
          prerelease: true
          removeArtifacts: true
          artifactErrorsFailBuild: true
          artifacts: dist/pvisor_sandbox-*.whl,dist/pvisor-*.tar.gz,dist/SHA256SUMS
          body: |
            Rolling nightly build from [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) on **${{ github.ref_name }}**.

            **pVisor Python wheel** (auto-detect platform / Python):

            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install-nightly.sh | bash
            ```

            Native archives (`pvisor-*-linux-x86_64.tar.gz` and `pvisor-*-macos-arm64.tar.gz`) need neither Python nor Rust. Download the matching archive and `SHA256SUMS`, verify its SHA-256, then extract it and add its `bin` directory to PATH. Keep the component set together. Corresponding firmware sources are attached.

            The Linux sandbox daemon requires KVM access and delegated cgroup v2. See the installation guide for VM and daemon setup.

            Both wheels install native `pvisor` and local companion scripts directly; both platforms include the independently built `pvisor-daemon` executable. The Python package is a version marker, not a launcher. Built with local version `+${{ needs.meta.outputs.local_version }}` (base version from `pyproject.toml`).
