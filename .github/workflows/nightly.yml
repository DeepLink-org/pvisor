name: Nightly Build

on:
  schedule:
    # 03:00 UTC daily
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pvisor-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    if: github.repository == 'DeepLink-org/Persisting' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      local_version: ${{ steps.ver.outputs.local_version }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: ver
        shell: bash
        run: |
          version="$(python scripts/ci/check_release_version.py --skip-lockfile)"
          local_version="g${GITHUB_RUN_NUMBER}.${GITHUB_SHA:0:7}"
          echo "local_version=$local_version" >> "$GITHUB_OUTPUT"
          echo "version=$version+$local_version" >> "$GITHUB_OUTPUT"

  wheels:
    needs: meta
    uses: ./.github/workflows/wheel.yml
    with:
      artifact_prefix: nightly-wheel
      local_version: ${{ needs.meta.outputs.local_version }}

  publish:
    name: Publish nightly release
    needs: [meta, wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: nightly-wheel-*
          merge-multiple: true
          path: dist

      - name: Verify complete nightly artifact set
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: python scripts/ci/check_release_artifacts.py dist --version "$VERSION"

      - name: Publish rolling nightly release
        uses: ncipollo/release-action@v1
        with:
          tag: nightly
          name: pVisor Nightly (main)
          commit: ${{ github.sha }}
          allowUpdates: true
          makeLatest: false
          prerelease: true
          removeArtifacts: true
          artifactErrorsFailBuild: true
          artifacts: dist/*.whl
          body: |
            Rolling nightly build from [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) on **${{ github.ref_name }}**.

            **pVisor Python wheel** (auto-detect platform / Python):

            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install-nightly.sh | bash
            ```

            The wheel includes the matched `pvisor` CLI. Built with local version `+${{ needs.meta.outputs.local_version }}` (base version from `pyproject.toml`).
