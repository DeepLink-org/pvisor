name: Nightly Build

on:
  schedule:
    # 03:00 UTC daily
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pvisor-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    if: github.repository == 'DeepLink-org/pvisor' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      local_version: ${{ steps.ver.outputs.local_version }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build-env
        with:
          tools: python rust
          setup: none
      - id: ver
        shell: bash
        run: |
          version="$(mise run check-release-version)"
          local_version="g${GITHUB_RUN_NUMBER}.${GITHUB_SHA:0:7}"
          echo "local_version=$local_version" >> "$GITHUB_OUTPUT"
          echo "version=$version+$local_version" >> "$GITHUB_OUTPUT"

  verify:
    name: Build and verify nightly
    needs: meta
    uses: ./.github/workflows/distribution.yml
    with:
      version: ${{ needs.meta.outputs.version }}
      artifact_prefix: nightly
      local_version: ${{ needs.meta.outputs.local_version }}

  publish:
    name: Publish nightly release
    needs: [meta, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified wheels
        uses: actions/download-artifact@v4
        with:
          name: nightly-wheels
          path: dist

      - name: Download verified native distribution set
        uses: actions/download-artifact@v4
        with:
          name: nightly-native
          path: dist

      - name: Publish rolling nightly release
        uses: ncipollo/release-action@v1
        with:
          tag: nightly
          name: pVisor Nightly (main)
          commit: ${{ github.sha }}
          allowUpdates: true
          makeLatest: false
          prerelease: true
          removeArtifacts: true
          artifactErrorsFailBuild: true
          artifacts: dist/pvisor_sandbox-*.whl,dist/pvisor-*.tar.gz,dist/SHA256SUMS
          body: |
            Rolling nightly build from [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) on **${{ github.ref_name }}**.

            **Native CLI** (Linux x86_64 or Apple Silicon macOS, no Python or Rust):

            ```sh
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.sh | sh -s -- --nightly
            ```

            Verify with `"$HOME/.local/share/pvisor/cli-nightly/current/bin/pvisor" --version`. This installer keeps nightly separate from stable and prints the directory to add to `PATH`.

            **Python wheel** (run inside an activated Python environment):

            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install-nightly.sh | bash
            ```

            The installer checks `SHA256SUMS` before installing. For a manual install, download the matching native archive and verify its SHA-256 before extracting. Keep the component set together. Corresponding firmware sources are attached.

            The Linux sandbox daemon requires KVM access and delegated cgroup v2. See the installation guide for VM and daemon setup.

            Both wheels install native `pvisor` and local companion scripts directly; both platforms include the independently built `pvisor-daemon` executable. The Python package is a version marker, not a launcher. Built with local version `+${{ needs.meta.outputs.local_version }}` (base version from `pyproject.toml`).
