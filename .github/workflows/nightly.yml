name: Nightly Build

on:
  schedule:
    # 03:00 UTC daily
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pvisor-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    if: github.repository == 'DeepLink-org/pvisor' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      local_version: ${{ steps.ver.outputs.local_version }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: ver
        shell: bash
        run: |
          version="$(python scripts/ci/check_release_version.py --skip-lockfile)"
          local_version="g${GITHUB_RUN_NUMBER}.${GITHUB_SHA:0:7}"
          echo "local_version=$local_version" >> "$GITHUB_OUTPUT"
          echo "version=$version+$local_version" >> "$GITHUB_OUTPUT"

  wheels:
    needs: meta
    uses: ./.github/workflows/wheel.yml
    with:
      artifact_prefix: nightly-wheel
      local_version: ${{ needs.meta.outputs.local_version }}

  daemon:
    needs: meta
    uses: ./.github/workflows/daemon-dist.yml
    with:
      artifact_prefix: nightly-daemon
      local_version: ${{ needs.meta.outputs.local_version }}

  publish:
    name: Publish nightly release
    needs: [meta, wheels, daemon]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: nightly-wheel-*
          merge-multiple: true
          path: dist

      - name: Download standalone daemon
        uses: actions/download-artifact@v4
        with:
          pattern: nightly-daemon-*
          merge-multiple: true
          path: dist

      - name: Download corresponding firmware sources
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-source-nightly-wheel-*
          merge-multiple: true
          path: dist

      - name: Download daemon firmware sources
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-source-nightly-daemon-*
          merge-multiple: true
          path: daemon-sources

      - name: Preserve the daemon's exact build source receipt
        run: cp daemon-sources/pvisor-firmware-source-linux-x86_64.tar.gz dist/pvisor-firmware-source-daemon-linux-x86_64.tar.gz

      - name: Require complete corresponding firmware source set
        run: |
          test -s dist/pvisor-firmware-source-linux-x86_64.tar.gz
          test -s dist/pvisor-firmware-source-macos-arm64.tar.gz
          test -s dist/pvisor-firmware-source-daemon-linux-x86_64.tar.gz

      - name: Verify daemon archive checksum
        run: sha256sum -c dist/pvisor-daemon-linux-x86_64.tar.gz.sha256

      - name: Verify complete nightly artifact set
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: python scripts/ci/check_release_artifacts.py dist --version "$VERSION"

      - name: Publish rolling nightly release
        uses: ncipollo/release-action@v1
        with:
          tag: nightly
          name: pVisor Nightly (main)
          commit: ${{ github.sha }}
          allowUpdates: true
          makeLatest: false
          prerelease: true
          removeArtifacts: true
          artifactErrorsFailBuild: true
          artifacts: dist/*.whl,dist/pvisor-daemon-*.tar.gz,dist/pvisor-daemon-*.sha256,dist/pvisor-firmware-source-*.tar.gz
          body: |
            Rolling nightly build from [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) on **${{ github.ref_name }}**.

            **pVisor Python wheel** (auto-detect platform / Python):

            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install-nightly.sh | bash
            ```

            A standalone Linux x86_64 `pvisor-daemon-linux-x86_64.tar.gz` and SHA-256 checksum are also provided; no wheel or separate CLI is required. The daemon embeds native `pvisor-vm` execution and requires Linux x86_64, KVM access and delegated cgroup v2. Provision a trusted prepared-image manifest and Linux rootfs with a bootstrap supervising real execd/egress services and guest vsock bridges; the bootstrap is not supplied or end-to-end validated. Docker/Podman are not used.

            Both wheels install native `pvisor` and local companion scripts directly; only the Linux x86_64 wheel includes the independently built `pvisor-daemon` executable. The Python package is a version marker, not a launcher. Built with local version `+${{ needs.meta.outputs.local_version }}` (base version from `pyproject.toml`).
