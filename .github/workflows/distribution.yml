name: Build and verify distributions

on:
  workflow_call:
    inputs:
      version:
        description: Complete package version expected in every wheel
        required: true
        type: string
      artifact_prefix:
        description: Channel prefix for build, evidence and verified artifacts
        required: true
        type: string
      local_version:
        description: PEP 440 suffix applied only to nightly wheel builds
        type: string
        default: ""
      stable:
        description: Also generate the stable Homebrew formula
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quality:
    name: Required CI at release SHA
    uses: ./.github/workflows/ci.yml

  wheels:
    needs: quality
    uses: ./.github/workflows/wheel.yml
    with:
      artifact_prefix: ${{ inputs.artifact_prefix }}-wheel
      local_version: ${{ inputs.local_version }}

  acceptance:
    name: Installed wheel acceptance / ${{ matrix.platform }}
    needs: wheels
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
          - platform: macos-arm64
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build-env
        with:
          tools: python rust
          setup: none
      - name: Prepare Linux native VM acceptance
        if: runner.os == 'Linux'
        shell: bash
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_prefix }}-wheel-${{ matrix.platform }}
          path: dist
      - name: Exercise installed product and native VM recovery
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for wheel in dist/pvisor_sandbox-*.whl; do
            mise run accept-wheel -- "$wheel" "$RUNNER_TEMP/pvisor-release-acceptance/result.json"
          done
      # Hosted Apple Silicon runners cannot run nested Hypervisor VMs.
      - name: Verify installed macOS product
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/pvisor-release-acceptance"
          mkdir -p "$evidence"
          for wheel in dist/pvisor_sandbox-*.whl; do
            python3 scripts/packaging/verify_wheel.py "$wheel" --install-smoke | tee "$evidence/install-smoke.log"
          done
      - name: Retain acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_prefix }}-acceptance-${{ matrix.platform }}
          path: ${{ runner.temp }}/pvisor-release-acceptance/
          if-no-files-found: warn
          retention-days: 30

  verify:
    name: Verify release artifact set
    needs: [wheels, acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-build-env
        with:
          tools: python
          setup: none

      - name: Download platform wheels
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.artifact_prefix }}-wheel-*
          merge-multiple: true
          path: dist

      - name: Download corresponding firmware sources
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-source-${{ inputs.artifact_prefix }}-wheel-*
          merge-multiple: true
          path: dist

      - name: Verify and prepare distribution set
        env:
          VERSION: ${{ inputs.version }}
          STABLE: ${{ inputs.stable }}
        run: |
          args=()
          if [[ "$STABLE" == true ]]; then args+=(--stable); fi
          python3 scripts/ci/build_release_assets.py dist "${args[@]}" \
            --version "$VERSION" --repository "$GITHUB_REPOSITORY"

      - name: Retain native distribution set
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_prefix }}-native
          path: |
            dist/pvisor-*.tar.gz
            dist/pvisor.rb
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Upload verified wheel set
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_prefix }}-wheels
          path: dist/pvisor_sandbox-*.whl
          if-no-files-found: error
          retention-days: 30

