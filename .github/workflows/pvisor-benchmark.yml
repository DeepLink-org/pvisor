name: pVisor Benchmark

on:
  push:
    branches: [main, develop, next]
    paths:
      - 'Cargo.*'
      - '.cargo/**'
      - 'crates/**'
      - 'vendor/**'
      - 'benchmark/**'
      - 'tools/semspec/**'
      - 'mise.toml'
      - 'mise.lock'
      - 'tests/tasks.toml'
      - 'scripts/tasks/**'
      - 'tests/tasks/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/actions/setup-build-env/**'
      - '.github/workflows/pvisor-benchmark.yml'
  pull_request:
    branches: [main, develop, next]
    paths:
      - 'Cargo.*'
      - '.cargo/**'
      - 'crates/**'
      - 'vendor/**'
      - 'benchmark/**'
      - 'tools/semspec/**'
      - 'mise.toml'
      - 'mise.lock'
      - 'tests/tasks.toml'
      - 'scripts/tasks/**'
      - 'tests/tasks/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/actions/setup-build-env/**'
      - '.github/workflows/pvisor-benchmark.yml'
  workflow_dispatch:

concurrency:
  group: pvisor-benchmark-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build benchmark / ${{ matrix.cohort }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cohort: [main, candidate]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-build-env
        with:
          native-firmware: "true"
          static-musl: "true"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target/pvisor-benchmark-build
          shared-key: pvisor-benchmark-${{ matrix.cohort }}
      - name: Resolve and build the selected revision
        env:
          COHORT: ${{ matrix.cohort }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GNUMAKEFLAGS: --no-print-directory
        shell: bash
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/benchmark-build"
          mkdir -p "$artifact"
          repo="$GITHUB_WORKSPACE"
          if [[ "$COHORT" == main ]]; then
            if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
              baseline_sha="$BASE_SHA"
            elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              baseline_sha="$(git rev-parse HEAD^)"
            else
              baseline_sha="$(git rev-parse HEAD)"
            fi
            repo="$RUNNER_TEMP/pvisor-main"
            git worktree add --detach "$repo" "$baseline_sha"
          fi
          git -C "$repo" rev-parse HEAD > "$artifact/source.sha"
          if [[ ! -f "$repo/scripts/packaging/stage_wheel_binaries.py" ]]; then
            [[ "$COHORT" == main ]]
            echo false > "$artifact/supported"
            exit 0
          fi
          echo true > "$artifact/supported"
          build="$GITHUB_WORKSPACE/target/pvisor-benchmark-build"
          (
            cd "$repo"
            export CARGO_TARGET_DIR="$build"
            python3 scripts/packaging/stage_wheel_binaries.py --profile release --target-dir "$build" --all
          )
          # Preserve executable modes and any historical adjacent firmware.
          (
            cd "$build/release"
            shopt -s nullglob
            tar -chzf "$artifact/runtime.tgz" pvisor pvisor-tui pvisor-replay pvisor-daemon libkrunfw*
          )
          (cd "$artifact" && sha256sum runtime.tgz > runtime.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-build-${{ matrix.cohort }}
          path: ${{ runner.temp }}/benchmark-build/
          if-no-files-found: error
          retention-days: 7

  compare:
    name: Process and Run Bundle report
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build-env
        with:
          tools: python rust
          setup: none
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/semspec -> ../../target/semspec
          shared-key: pvisor-benchmark-harness
      - uses: actions/download-artifact@v4
        with:
          pattern: benchmark-build-*
          path: ${{ runner.temp }}/benchmark-builds
      - name: Verify and unpack the measured binaries
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          for cohort in main candidate; do
            artifact="$RUNNER_TEMP/benchmark-builds/benchmark-build-$cohort"
            supported="$(cat "$artifact/supported")"
            if [[ "$cohort" == main ]]; then echo "supported=$supported" >> "$GITHUB_OUTPUT"; fi
            if [[ "$supported" == false && "$cohort" == main ]]; then continue; fi
            [[ "$supported" == true ]]
            (cd "$artifact" && sha256sum -c runtime.sha256)
            mkdir -p "$RUNNER_TEMP/benchmark-runtimes/$cohort"
            tar -xzf "$artifact/runtime.tgz" -C "$RUNNER_TEMP/benchmark-runtimes/$cohort"
            test -x "$RUNNER_TEMP/benchmark-runtimes/$cohort/pvisor"
          done

      # Parallelize compilation, then measure both revisions sequentially on
      # this same host with the same harness, sampling and regression threshold.
      - name: Benchmark main
        if: steps.baseline.outputs.supported == 'true'
        env:
          PVISOR_BENCHMARK_OUTPUT: ${{ runner.temp }}/.data/pvisor-benchmark/main
        run: mise run benchmark -- smoke --binary "$RUNNER_TEMP/benchmark-runtimes/main/pvisor"
      - name: Stop baseline Host listener before switching binaries
        if: steps.baseline.outputs.supported == 'true'
        shell: bash
        run: |
          pkill -f "^${RUNNER_TEMP}/benchmark-runtimes/main/pvisor --pvisor-internal-host$" || [[ $? == 1 ]]
      - name: Benchmark candidate
        env:
          PVISOR_BENCHMARK_OUTPUT: ${{ runner.temp }}/.data/pvisor-benchmark/candidate
        run: mise run benchmark -- smoke --binary "$RUNNER_TEMP/benchmark-runtimes/candidate/pvisor"

      - name: Compare reports
        shell: bash
        run: |
          set -euo pipefail
          candidate="${RUNNER_TEMP}/.data/pvisor-benchmark/candidate/smoke/in.bench.json"
          baseline="${RUNNER_TEMP}/.data/pvisor-benchmark/main/smoke/in.bench.json"
          output="${RUNNER_TEMP}/.data/pvisor-benchmark/comparison"
          if [[ -f "$baseline" ]]; then
            mise run benchmark-compare -- "$candidate" "$baseline" "$output"
          else
            mise run benchmark-compare -- "$candidate" "" "$output"
          fi
          cat "$output/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnose failed benchmark outside measurement
        if: failure()
        timeout-minutes: 2
        env:
          BENCHMARK_DATA: ${{ runner.temp }}/.data/pvisor-benchmark
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v strace >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y strace
          fi
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          for cohort in ("main", "candidate"):
              batch = Path(os.environ["BENCHMARK_DATA"]) / cohort / "smoke"
              if not (batch / "commands.json").is_file():
                  print(f"No prepared {cohort} batch; no commands to diagnose")
                  continue
              commands = json.loads((batch / "commands.json").read_text())
              output = batch / "diagnostics"
              output.mkdir()
              for name in ("status", "review"):
                  spec = commands[name]
                  with (output / f"{name}.profile.stdout").open("wb") as stdout, (output / f"{name}.profile.stderr").open("wb") as stderr:
                      subprocess.run(
                          spec["argv"], cwd=spec["cwd"],
                          env={**os.environ, **spec["env"], "PVISOR_STARTUP_PROFILE": "1"},
                          stdout=stdout, stderr=stderr, timeout=15, check=True,
                      )
                  with (output / f"{name}.stdout").open("wb") as stdout, (output / f"{name}.stderr").open("wb") as stderr:
                      subprocess.run(
                          ["strace", "-f", "-ttt", "-T", "-yy", "-o", str(output / f"{name}.strace"), "--", *spec["argv"]],
                          cwd=spec["cwd"],
                          env={**os.environ, **spec["env"], "PVISOR_STARTUP_PROFILE": "1"},
                          stdout=stdout, stderr=stderr, timeout=30, check=True,
                      )
          PY

      - name: Retain build provenance
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/.data/pvisor-benchmark/builds"
          for cohort in main candidate; do
            source="$RUNNER_TEMP/benchmark-builds/benchmark-build-$cohort"
            destination="$RUNNER_TEMP/.data/pvisor-benchmark/builds/$cohort"
            mkdir -p "$destination"
            cp "$source/source.sha" "$source/supported" "$destination/"
            if [[ -f "$source/runtime.sha256" ]]; then cp "$source/runtime.sha256" "$destination/"; fi
          done

      - name: Upload benchmark data and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pvisor-benchmark-${{ github.run_id }}
          path: ${{ runner.temp }}/.data/pvisor-benchmark
          retention-days: 30
          if-no-files-found: error
