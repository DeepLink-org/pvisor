name: Publish Agent plugins

on:
  push:
    tags: ["plugins-v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified plugin package to npm
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: agent-plugins-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'DeepLink-org/pvisor'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check package identity and release tag
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const pkg = JSON.parse(await readFile('plugins/package.json', 'utf8'));
          const manifest = JSON.parse(await readFile('plugins/plugin.json', 'utf8'));
          assert.equal(pkg.version, manifest.version);
          assert.equal(pkg.private, undefined);
          assert.equal(pkg.optionalDependencies, undefined);
          assert.equal(pkg.bin.pvisor, undefined);
          if (process.env.RELEASE_REF.startsWith('refs/tags/')) {
            assert.equal(process.env.RELEASE_REF, `refs/tags/plugins-v${pkg.version}`);
          }
          JS
      - name: Test adapters and packed installation
        run: npm test --prefix plugins
      - name: Pack the plugin without a native runtime
        run: |
          mkdir -p plugins/dist/npm
          npm pack ./plugins --pack-destination plugins/dist/npm --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: pvisor-agent-plugin-release
          path: plugins/dist/npm/*.tgz
          if-no-files-found: error

  publish:
    needs: prepare
    if: github.repository == 'DeepLink-org/pvisor' && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: pvisor-agent-plugin-release
          path: packages
      - name: Publish the plugin
        run: npm publish packages/pvisor-agent-plugins-*.tgz --access public --provenance
