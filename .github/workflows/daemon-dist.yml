name: Build Standalone Daemon

on:
  workflow_call:
    inputs:
      artifact_prefix:
        required: true
        type: string
      local_version:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Daemon / Linux x86_64 (static musl)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build-env
        with:
          rust: "true"
          static-musl: "true"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: daemon-dist
      - name: Apply nightly local version
        if: inputs.local_version != ''
        env:
          LOCAL_VERSION: ${{ inputs.local_version }}
        run: |
          python scripts/ci/set_nightly_local_version.py "$LOCAL_VERSION"
          cargo metadata --format-version 1 >/dev/null
      # Embeds pvisor's VM, guest supervisor and libkrunfw kernel; no CLI back-link.
      - name: Build native daemon
        run: just daemon-build release
      - name: Verify static binary and CLI
        shell: bash
        run: |
          binary=target/x86_64-unknown-linux-musl/release/pvisor-daemon
          readelf -W -l "$binary" > target/daemon-program-headers.txt
          readelf -W -d "$binary" > target/daemon-dynamic.txt
          if grep -q INTERP target/daemon-program-headers.txt || grep -q '(NEEDED)' target/daemon-dynamic.txt; then
            echo 'Daemon must not require a dynamic loader or shared libraries' >&2
            exit 1
          fi
          "$binary" --version
          "$binary" serve --help
          "$binary" protocol
      - name: Package daemon and user-service examples
        run: |
          mkdir -p dist target/daemon-dist
          install -m 755 target/x86_64-unknown-linux-musl/release/pvisor-daemon target/daemon-dist/pvisor-daemon
          cp deploy/systemd/pvisor-daemon.service deploy/systemd/daemon.env.example deploy/systemd/INSTALL.md target/daemon-dist/
          uv run --no-project --with pyelftools==0.33 python scripts/build-firmware.py --source-output target/libkrunfw.SOURCE --source-archive dist/pvisor-firmware-source-linux-x86_64.tar.gz
          cp target/libkrunfw.SOURCE target/daemon-dist/libkrunfw.SOURCE
          cp LICENSE NOTICE target/daemon-dist/
          tar -C target/daemon-dist -czf dist/pvisor-daemon-linux-x86_64.tar.gz pvisor-daemon pvisor-daemon.service daemon.env.example INSTALL.md libkrunfw.SOURCE LICENSE NOTICE
          sha256sum dist/pvisor-daemon-linux-x86_64.tar.gz > dist/pvisor-daemon-linux-x86_64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_prefix }}-linux-x86_64
          path: dist/pvisor-daemon-*
          if-no-files-found: error
          retention-days: 14
      - name: Upload corresponding firmware source
        uses: actions/upload-artifact@v4
        with:
          name: firmware-source-${{ inputs.artifact_prefix }}-linux-x86_64
          path: dist/pvisor-firmware-source-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14
