name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          install-nextest: "false"
          install-zig: "false"
          components: "rustfmt"

      - name: Rust formatting
        run: just fmt-check-rust

  rust-clippy-workspace:
    name: Clippy / Workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          install-nextest: "false"
          install-zig: "false"
          components: "clippy"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-clippy-workspace

      - name: Workspace Clippy
        run: just clippy-deny

  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          install-nextest: "false"
          install-zig: "false"
          components: ""

      - name: Ruff
        run: just lint-py

  rust-test:
    name: Rust Test / ${{ matrix.platform }} / ${{ matrix.shard }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
            shard: core
            packages: >-
              persisting-agentctl
              persisting-events
              persisting-overlay-core
              persisting-overlayfs
              persisting-overlaynet
              persisting-replay
            prepare_pvisor: false
            smoke_pvisor: false
            install_zig: false
          - platform: Linux
            os: ubuntu-latest
            shard: gateway
            packages: persisting-gateway
            prepare_pvisor: false
            smoke_pvisor: false
            install_zig: false
          - platform: Linux
            os: ubuntu-latest
            shard: pvisor
            packages: persisting-pvisor
            prepare_pvisor: true
            smoke_pvisor: true
            install_zig: false
          - platform: macOS
            os: macos-latest
            shard: agent-runtime
            packages: >-
              persisting-agentctl
              persisting-events
              persisting-gateway
              persisting-overlay-core
              persisting-overlayfs
              persisting-overlaynet
              persisting-pvisor
              persisting-replay
            prepare_pvisor: true
            smoke_pvisor: true
            install_zig: true
          - platform: macOS
            os: macos-latest
            shard: pvisor
            packages: persisting-pvisor
            prepare_pvisor: true
            smoke_pvisor: true
            install_zig: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          install-zig: "${{ matrix.install_zig }}"
          components: ""

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-rust-${{ matrix.shard }}

      # macOS needs the Hypervisor entitlement on the product binary. Running
      # the same recipe on Linux also keeps the smoke-test setup identical.
      - name: Build pVisor product binary
        if: matrix.prepare_pvisor
        run: just pvisor debug

      - name: Run ${{ matrix.shard }} tests
        env:
          # GitHub-hosted Linux runners may disable unprivileged user
          # namespaces. The dedicated isolation job remains strict.
          PERSISTING_TEST_ALLOW_NO_USERNS: "1"
        run: just ci-nextest ${{ matrix.packages }}

      - name: Smoke pVisor CLI
        if: matrix.smoke_pvisor
        run: just smoke-pvisor-cli

  pvisor-isolation-regression:
    name: pVisor Isolation Regression / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          install-zig: "false"
          components: ""

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-pvisor-isolation

      - name: Enable rootless isolation primitives
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fuse3 jq util-linux
          if sysctl kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          test -c /dev/fuse
          unshare --user --map-root-user --mount --net /bin/true

      - name: Run strict pVisor isolation regressions
        env:
          PERSISTING_RUN_HOME: ${{ runner.temp }}/pvisor-isolation-runs
        run: just test-pvisor-isolation

      - name: Run pVisor filesystem examples
        env:
          WORK_ROOT: ${{ runner.temp }}/pvisor-filesystem-examples
        run: just examples-pvisor-filesystem

  python-test:
    name: Python Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          install-nextest: "false"
          install-zig: "false"
          components: ""

      - name: Sync Python deps
        run: just py-dev

      - name: Pytest
        run: just test-py

  pvisor-cases:
    name: pVisor case checklist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          install-nextest: "false"
          install-zig: "false"
          components: ""

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-pvisor-cases

      - name: Run documented cases
        run: |
          just cases pvisor \
            --case A01,A02,A03,A04,A05,A06 \
            --case B01,B02,B03,B04 \
            --case C02,C03,C04 \
            --case D01,D03 \
            --case F01,F02,F03 \
            --case G01,G02,G03,G06 \
            --case H01,H02 \
            --case I01,I02,I03 \
            --case J03

      - name: Upload case report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pvisor-case-report
          path: target/pvisor-case-report.md
          if-no-files-found: ignore

  examples:
    name: Examples / ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: pvisor
            command: |
              just test-pvisor-benchmark
              just examples-pvisor-portable
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python for examples
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          install-nextest: "false"
          install-zig: "false"
          components: ""

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-examples-${{ matrix.shard }}

      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      - name: Run ${{ matrix.shard }} examples
        env:
          WORK_ROOT: ${{ runner.temp }}/${{ matrix.shard }}-examples
          PYTHON_BIN: ${{ steps.setup-python.outputs.python-path }}
        run: ${{ matrix.command }}

  ci:
    name: CI
    if: always()
    needs:
      - format
      - rust-clippy-workspace
      - python-lint
      - rust-test
      - pvisor-isolation-regression
      - python-test
      - pvisor-cases
      - examples
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI shard to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in ${RESULTS}; do
            if [[ "${result}" != "success" ]]; then
              echo "A required CI job finished with: ${result}" >&2
              exit 1
            fi
          done
