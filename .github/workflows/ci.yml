name: CI

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      case_gate:
        description: "normal preserves declared XFAIL; strict requires every case to PASS"
        type: choice
        options: [normal, strict]
        default: normal
  push:
    branches: [main, develop, next]
  pull_request:
    branches: [main, develop, next]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  feature-inventory:
    name: Discover product features
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      features: ${{ steps.discover.outputs.features }}
    steps:
      - uses: actions/checkout@v4
      - id: discover
        name: Discover feature directories, not case ID allowlists
        run: |
          echo "features=$(python3 scripts/tasks/feature-matrix.py)" >> "$GITHUB_OUTPUT"

  feature-cases:
    name: Feature ${{ matrix.feature }} / Scrut / Linux / ${{ github.event.inputs.case_gate || 'normal' }}
    needs: [feature-inventory, linux-product]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.feature-inventory.outputs.features) }}
    env:
      FEATURE: ${{ matrix.feature }}
      CASE_GATE: ${{ github.event.inputs.case_gate || 'normal' }}
      PVISOR_CASE_KEEP: "1"
      # --safe gives host /tmp a private view. Keep scenario paths in that
      # namespace; RUNNER_TEMP lives under /home and has different semantics.
      PVISOR_CASE_ARTIFACTS: /tmp/pvisor-feature-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.feature }}
    steps:
      - uses: actions/checkout@v4
      - name: Initialize feature evidence before prerequisite setup
        run: |
          mkdir -p "$RUNNER_TEMP/feature-evidence"
          mkdir -m 700 "$PVISOR_CASE_ARTIFACTS"
          {
            uname -a
            printf 'feature=%s\ngate=%s\ncommit=%s\n' "$FEATURE" "$CASE_GATE" "$GITHUB_SHA"
          } > "$RUNNER_TEMP/feature-evidence/environment.txt"
      - uses: ./.github/actions/setup-build-env
        with:
          tools: python rust jq github:nextest-rs/nextest
          setup: none
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-feature-cases
      - uses: actions/download-artifact@v4
        with:
          name: podman-runtime
          path: ${{ runner.temp }}/feature-runtime
      - name: Extract frozen product (no hardware checks)
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf "$RUNNER_TEMP/feature-runtime/podman-runtime.tgz" -C "$RUNNER_TEMP/feature-runtime"
          test -x "$RUNNER_TEMP/feature-runtime/pvisor"
      - name: Require rootless namespaces for this feature (never skip)
        if: matrix.userns
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/feature-evidence/namespaces.log") 2>&1
          bash scripts/ci/ubuntu-apt-get.sh update -qq
          bash scripts/ci/ubuntu-apt-get.sh install -y -qq --no-install-recommends util-linux
          if sysctl kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-root-user --mount --net /bin/true
      - name: Require FUSE for this feature (never skip)
        if: matrix.fuse
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/feature-evidence/fuse.log") 2>&1
          bash scripts/ci/ubuntu-apt-get.sh install -y -qq --no-install-recommends fuse3
          test -c /dev/fuse
          [[ -r /dev/fuse && -w /dev/fuse ]]
          command -v fusermount3
      - name: Require KVM and rootfs for this feature (never skip)
        if: matrix.kvm
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/feature-evidence/kvm.log") 2>&1
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          [[ -r /dev/kvm && -w /dev/kvm ]]
          test -s "$RUNNER_TEMP/feature-runtime/libkrunfw.so.5"
          # These Linux contracts deliberately use host rootfs, not macOS.
          echo 'PVISOR_CASE_ROOTFS=/' >> "$GITHUB_ENV"
      - name: Install guest Rust target for SDK fixtures
        if: matrix.vm_sdk || matrix.feature == 'lazy-image'
        run: mise exec -- rustup target add x86_64-unknown-linux-musl
      - name: Prepare VM SDK inputs
        if: matrix.vm_sdk
        run: |
          # J02 uses a local agent to check launch metadata and trajectories.
          test -x /usr/bin/python3
          {
            echo 'PVISOR_CASE_VM_PYTHON=/usr/bin/python3'
            echo 'PVISOR_CASE_IMAGE=docker.io/library/ubuntu:24.04'
            echo 'PVISOR_CASE_AGENT=/usr/bin/true'
            echo "PVISOR_CASE_VM_LIBRARY_DIR=$RUNNER_TEMP/feature-runtime"
          } >> "$GITHUB_ENV"
      - name: Require replay companion
        if: matrix.feature == 'replay'
        run: test -x "$RUNNER_TEMP/feature-runtime/pvisor-replay"
      - name: Prepare OCI runtime prerequisites
        if: matrix.oci
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/feature-evidence/oci-prerequisites.log") 2>&1
          bash scripts/ci/ubuntu-apt-get.sh install -y -qq --no-install-recommends crun runc
          crun --version
          runc --version
          {
            echo 'PVISOR_CASE_CONTAINER_RUNTIME=crun'
            echo 'PVISOR_CASE_CONTAINER_IMAGE=mirror.gcr.io/library/ubuntu:24.04'
          } >> "$GITHUB_ENV"
      - name: Run every discovered case of this feature
        shell: bash
        env:
          PVISOR_RUN_HOME: ${{ runner.temp }}/feature-runs
        run: |
          set -euo pipefail
          mkdir -p "$PVISOR_CASE_ARTIFACTS"
          task=cases-feature
          if [[ "$CASE_GATE" == strict ]]; then task=cases-feature-strict; fi
          mise run "$task" -- "$FEATURE" \
            --subject-bin "$RUNNER_TEMP/feature-runtime/pvisor" \
            --output "$RUNNER_TEMP/feature-evidence/report.json" \
            2>&1 | tee "$RUNNER_TEMP/feature-evidence/task.log"
      - name: Archive feature evidence without changing OCI permissions
        if: always()
        run: mise run archive-feature-evidence
      - name: Upload feature report and preserved case resources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feature-${{ matrix.feature }}-linux-${{ github.event.inputs.case_gate || 'normal' }}
          path: ${{ runner.temp }}/feature-evidence.tar.gz
          if-no-files-found: error
          retention-days: 7

  feature-native:
    name: Feature ${{ matrix.feature }} / Cargo / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, macos-latest]
        feature: [docker-cli, docker-compose]
    env:
      FEATURE: ${{ matrix.feature }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build-env
        with:
          native-firmware: "true"
          static-musl: "true"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-feature-native
      - run: mise run smoke
      - name: Run only this feature's conventional Cargo regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/feature-native"
          mise run test-feature-native -- "$FEATURE" 2>&1 | tee "$RUNNER_TEMP/feature-native/task.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feature-${{ matrix.feature }}-cargo-${{ matrix.os }}
          path: ${{ runner.temp }}/feature-native
          if-no-files-found: error
          retention-days: 7

  agent-plugins:
    name: Agent plugin contracts / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["22.19.0", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: plugins/test/hosts/package-lock.json
      - name: Test documented adapter and package contracts
        run: npm test --prefix plugins
      - name: Install pinned host loader fixtures without lifecycle scripts
        run: npm ci --prefix plugins/test/hosts --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Test actual Pi and DSH loaders
        run: |
          npm run test:hosts --prefix plugins -- \
            "$PWD/plugins/test/hosts/node_modules/@earendil-works/pi-coding-agent" \
            "$PWD/plugins/test/hosts/node_modules/@deepseek-ai/dsh-tools"

  windows:
    name: Windows
    uses: ./.github/workflows/windows-vm.yml

  checks:
    name: Format, Clippy, and workflows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build-env
        with:
          native-firmware: "true"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-clippy
      - run: mise run lint-workflows
      - run: mise run fmt-rust -- --check
      - run: mise run lint-rust
      - run: mise run lint-api-docs

  spec-fixtures:
    name: Scrut fixtures / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build-env
        with:
          tools: python rust jq github:nextest-rs/nextest
          setup: none

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - run: mise run test-spec-fixtures
      # Human review must approve STAGE, its vocabulary and engine before enabling reviewed release gates.

  python:
    name: Python and benchmark checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build-env
        with:
          tools: python uv ruff jq rust github:nextest-rs/nextest
          setup: python
      - run: mise tasks validate
      - run: mise run fmt-py -- --check
      - run: mise run lint-py
      - run: mise run test-scripts
      - name: Python unit tests
        run: mise run test-py-unit
      - name: Python process and integration regressions
        run: mise run test-py-regression
      - run: mise run test-benchmark-tools
      - name: Criterion measurement contract smoke
        run: mise run benchmark -- --smoke --criterion-output "$RUNNER_TEMP/.data/criterion-contracts"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test the homepage's explanatory model
        run: mise run test-home-demo
      - name: Test Compose acceptance runner contracts without VMs
        run: mise run test-py -- discover -s examples/pvisor/08-compose-apps -p 'test_*.py' -v

  firmware:
    name: Firmware bundle and ABI / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build-env
        with:
          tools: python uv
          setup: python
      - name: Install firmware test compiler
        run: bash scripts/ci/ubuntu-apt-get.sh update -qq && bash scripts/ci/ubuntu-apt-get.sh install -y -qq --no-install-recommends build-essential
      - run: mise run fw -- test

  native-components:
    name: Native ${{ matrix.component }} / Linux x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: daemon
            package: pvisor-daemon
            test_args: ""
          - component: shim
            package: pvisor-shim
            test_args: ""
          - component: shim-vm
            package: pvisor-shim
            test_args: --features vm
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build-env
        with:
          native-firmware: "true"
          static-musl: "true"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ matrix.component }}
      # The shared pipeline prepares firmware/guest only for VM-bearing components.
      # Conventional tests are not an end-to-end KVM/prepared-image deployment gate.
      - run: mise run build -- debug ${{ matrix.component }}
      - run: mise run test -- ${{ matrix.package }} -- ${{ matrix.test_args }}

  rust-test:
    name: Rust Test / ${{ matrix.platform }} / ${{ matrix.shard }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
            shard: core
            packages: >-
              pvisor-journal
              pvisor-guest
              pvisor-containers
              pvisor-core
              pvisor-overlay-core
              pvisor-overlayfs
              pvisor-overlaynet
              pvisor-replay
            prepare_pvisor: false
          - platform: Linux
            os: ubuntu-latest
            shard: gateway
            packages: pvisor-gateway
            prepare_pvisor: false
          - platform: Linux
            os: ubuntu-latest
            shard: pvisor
            packages: pvisor pvisor-vm
            prepare_pvisor: true
          - platform: macOS
            os: macos-latest
            shard: core
            packages: >-
              pvisor-journal pvisor-guest pvisor-containers pvisor-shim pvisor-core pvisor-gateway
              pvisor-overlay-core pvisor-overlayfs pvisor-overlaynet pvisor-replay
            prepare_pvisor: false
          - platform: macOS
            os: macos-latest
            shard: pvisor
            packages: pvisor pvisor-vm
            prepare_pvisor: true
          - platform: macOS
            os: macos-latest
            shard: cli
            packages: pvisor-cli
            prepare_pvisor: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          native-firmware: "true"
          static-musl: "${{ matrix.prepare_pvisor }}"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-rust-${{ matrix.shard }}

      - name: Enable Linux runtime test prerequisites
        if: runner.os == 'Linux' && matrix.prepare_pvisor
        shell: bash
        run: |
          bash scripts/ci/ubuntu-apt-get.sh update -qq
          bash scripts/ci/ubuntu-apt-get.sh install -y -qq --no-install-recommends fuse3 util-linux
          if sysctl kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          test -c /dev/fuse
          unshare --user --map-root-user --mount --net /bin/true
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      # macOS needs the Hypervisor entitlement on the product binary. Running
      # the same recipe on Linux also keeps the smoke-test setup identical.
      - name: Build and smoke-test pVisor product binary
        if: matrix.prepare_pvisor
        run: mise run smoke

      - name: Common VM API workload / KVM
        # Hosted Apple Silicon runners cannot create nested HVF VMs.
        if: runner.os == 'Linux' && matrix.shard == 'pvisor'
        shell: bash
        run: |
          mise exec -- rustup target add x86_64-unknown-linux-musl
          mise exec -- rustc --edition=2021 --target x86_64-unknown-linux-musl -C linker=rust-lld tests/vm_guest.rs -o "$RUNNER_TEMP/vm-guest"
          api_firmware="$(mise run fw -- build --target x86_64-unknown-linux-musl)"
          mise exec -- cargo build --locked -p pvisor-vm --example vm_api_case
          python3 tests/vm_api_contract.py --binary target/debug/examples/vm_api_case --guest "$RUNNER_TEMP/vm-guest" --firmware "$api_firmware" --output "$RUNNER_TEMP/vm-api-${{ runner.os }}"
          cc -static -O2 -Wall -Wextra -Werror pvisor-kernel/tests/stat_visibility.c -o "$RUNNER_TEMP/linux-stat"
          python3 pvisor-kernel/tests/stat_visibility.py --binary target/debug/examples/vm_api_case \
            --firmware "$api_firmware" --guest "$RUNNER_TEMP/linux-stat"

      - name: Rust guest named stdio and authenticated exit / KVM
        id: native-stdio
        if: runner.os == 'Linux' && matrix.shard == 'pvisor'
        shell: bash
        run: |
          native_bundle="$(mise run kernel -- build)"
          echo "bundle=$native_bundle" >> "$GITHUB_OUTPUT"
          PVISOR_BUILD_NATIVE_KERNEL_BUNDLE="$native_bundle" mise exec -- cargo build --locked -p pvisor-vm --example vm_api_case
          mise exec -- rustc --edition=2021 --target x86_64-unknown-linux-musl -C linker=rust-lld pvisor-kernel/tests/guest.rs -o "$RUNNER_TEMP/native-stdio-guest"
          python3 pvisor-kernel/tests/task_stdio.py --binary target/debug/examples/vm_api_case --guest "$RUNNER_TEMP/native-stdio-guest"

      - name: Rust guest signal delivery on syscall return / KVM
        if: runner.os == 'Linux' && matrix.shard == 'pvisor'
        env:
          PVISOR_GUEST_KERNEL: rust-native
        shell: bash
        run: |
          root="$(mktemp -d "$RUNNER_TEMP/signal-return.XXXXXX")"
          cc -static -O2 -pthread -Wall -Wextra -Werror pvisor-kernel/tests/signal_return.c -o "$root/probe"
          result="$(timeout 30 target/debug/examples/vm_api_case --rootfs "$root" --cpus 2 --memory 64 \
            --task-stdio -- /probe </dev/null)"
          test "$result" = SIGNAL_RETURN_OK

      - name: Rust guest tmpfs sparse reads and concurrent truncate / KVM
        if: runner.os == 'Linux' && matrix.shard == 'pvisor'
        env:
          PVISOR_GUEST_KERNEL: rust-native
        shell: bash
        run: |
          root="$(mktemp -d "$RUNNER_TEMP/tmpfs-read.XXXXXX")"
          cp "$RUNNER_TEMP/native-stdio-guest" "$root/probe"
          status=0
          timeout 30 target/debug/examples/vm_api_case --rootfs "$root" --cpus 2 --memory 64 \
            -- /probe 7 --check-tmpfs-read || status=$?
          test "$status" = 7

      - name: Rust guest shared reads and acknowledged writes / KVM
        if: runner.os == 'Linux' && matrix.shard == 'pvisor'
        env:
          PVISOR_GUEST_KERNEL: rust-native
        shell: bash
        run: |
          vm=target/debug/examples/vm_api_case
          cc -static -O2 -Wall -Wextra -Werror pvisor-kernel/tests/readv.c -o "$RUNNER_TEMP/readv"
          mise exec -- rustc --edition=2021 --target x86_64-unknown-linux-musl -C linker=rust-lld \
            pvisor-kernel/tests/write_ack.rs -o "$RUNNER_TEMP/write-ack"
          for handoff in 0 auto 1; do
            export PVISOR_VM_FS_QUEUE_HANDOFF=$handoff
            root="$(mktemp -d "$RUNNER_TEMP/shared-read.XXXXXX")"
            cp "$RUNNER_TEMP/readv" "$root/probe"
            profile="$RUNNER_TEMP/shared-read-$handoff.log"
            PVISOR_FS_PROFILE=1 timeout 30 "$vm" --rootfs "$root" --cpus 1 --memory 256 \
              -- /probe check /records 2>"$profile" || { cat "$profile"; exit 1; }
            grep -q '"component":"virtio-fs-dispatch".*"final_record":true' "$profile"
            if grep -Eq '"handoff_(auto|forced)_queues"' "$profile"; then
              case "$handoff" in
                auto) grep -q '"handoff_auto_queues"' "$profile" ;;
                1) grep -q '"handoff_forced_queues"' "$profile" ;;
                *) exit 1 ;;
              esac
              echo "Verified shared reads with negotiated $handoff handoff policy."
            elif [[ "$handoff" != 0 ]]; then
              echo "::notice::Queue handoff was requested but not exercised on this runner; verified fallback only."
            fi
            python3 pvisor-kernel/tests/warm_write.py --binary "$vm" --guest "$RUNNER_TEMP/write-ack"
          done
          root="$(mktemp -d "$RUNNER_TEMP/mapped-write.XXXXXX")"
          cp "$RUNNER_TEMP/native-stdio-guest" "$root/probe"
          status=0
          timeout 30 "$vm" --rootfs "$root" --cpus 2 --memory 256 \
            -- /probe 7 --check-write-cache || status=$?
          test "$status" = 7
          printf WM | cmp - "$root/write-map-race"
          python3 -c 'import pathlib, sys; assert pathlib.Path(sys.argv[1]).read_bytes() == bytes(8192) + b"x\0\0"' "$root/mapped"
          root="$(mktemp -d "$RUNNER_TEMP/read-handles.XXXXXX")"
          mise exec -- rustc --edition=2021 --target x86_64-unknown-linux-musl -C linker=rust-lld -O \
            pvisor-kernel/tests/read_handles.rs -o "$root/probe"
          python3 -c 'import pathlib, sys; pathlib.Path(sys.argv[1]).write_bytes(bytes((i // 4096 + i % 251) % 256 for i in range(1027 * 4096)))' "$root/subject"
          timeout 30 "$vm" --rootfs "$root" --cpus 1 --memory 256 -- /probe 256

      - name: Rust guest metadata defaults and seeded filesystem stress / KVM
        if: runner.os == 'Linux' && matrix.shard == 'pvisor'
        env:
          PVISOR_BUILD_NATIVE_KERNEL_BUNDLE: ${{ steps.native-stdio.outputs.bundle }}
        shell: bash
        run: |
          mise exec -- cargo build --locked -p pvisor-vm --example guest_metadata_case
          cc -static -O2 -Wall -Wextra -Werror pvisor-kernel/tests/stat_visibility.c -o "$RUNNER_TEMP/native-stat"
          mise exec -- rustc --edition=2021 --target x86_64-unknown-linux-musl -C linker=rust-lld -O \
            crates/pvisor-vm/src/probes/guest_metadata_guest.rs -o "$RUNNER_TEMP/native-metadata"
          python3 pvisor-kernel/tests/fs_metadata.py \
            --vm-api target/debug/examples/vm_api_case --stat-guest "$RUNNER_TEMP/native-stat" \
            --metadata-case target/debug/examples/guest_metadata_case --metadata-guest "$RUNNER_TEMP/native-metadata" \
            --output "$RUNNER_TEMP/native-fs-metadata" --seed 1 --seed 314159 --seed 57596
      - uses: actions/upload-artifact@v4
        if: failure() && runner.os == 'Linux' && matrix.shard == 'pvisor'
        with:
          name: native-fs-metadata
          path: ${{ runner.temp }}/native-fs-metadata/
          if-no-files-found: ignore

      - name: Ready barrier and failed-start ownership / Linux and Rust guests / KVM
        if: runner.os == 'Linux' && matrix.shard == 'pvisor'
        env:
          PVISOR_BUILD_NATIVE_KERNEL_BUNDLE: ${{ steps.native-stdio.outputs.bundle }}
        shell: bash
        run: |
          set -euo pipefail
          lifecycle_firmware="$(mise run fw -- build --target x86_64-unknown-linux-musl)"
          junit=target/nextest/vm-lifecycle/junit.xml
          status=0
          for kernel in linux rust-native; do
            evidence="$RUNNER_TEMP/vm-lifecycle/$kernel"
            mkdir -p "$evidence"
            rm -f "$junit"
            (
              if [[ "$kernel" == rust-native ]]; then
                export PVISOR_GUEST_KERNEL=rust-native
                unset PVISOR_CASE_VM_FIRMWARE_PATH
              else
                unset PVISOR_GUEST_KERNEL
                export PVISOR_CASE_VM_FIRMWARE_PATH="$lifecycle_firmware"
              fi
              mise run test-vm-lifecycle
            ) 2>&1 | tee "$evidence/nextest.log" || status=1
            if [[ -f "$junit" ]]; then
              cp "$junit" "$evidence/junit.xml"
            else
              status=1
            fi
          done
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux' && matrix.shard == 'pvisor'
        with:
          name: vm-lifecycle-Linux
          path: ${{ runner.temp }}/vm-lifecycle/
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux' && matrix.shard == 'pvisor'
        with:
          name: vm-api-${{ runner.os }}
          path: ${{ runner.temp }}/vm-api-${{ runner.os }}
          if-no-files-found: warn
          retention-days: 7

      - name: Test Journal without workspace feature unification
        if: matrix.shard == 'core'
        run: mise run test -- pvisor-journal

      - name: Test public API documentation
        if: matrix.shard == 'core'
        run: mise run test-doc

      - name: Test portable daemon cache service on macOS
        if: runner.os == 'macOS' && matrix.shard == 'core'
        run: mise run test -- pvisor-daemon -- --test cache

      - name: Report macOS Hypervisor availability
        if: runner.os == 'macOS'
        run: sysctl kern.hv_support

      - name: Run ${{ matrix.shard }} tests
        if: matrix.shard != 'cli'
        run: mise run test-rust -- ${{ matrix.packages }}
      - name: Run CLI tests outside the dedicated Docker and Compose jobs
        if: matrix.shard == 'cli'
        run: mise run test-rust -- pvisor-cli -- -E 'not (binary(=docker_cli) | binary(=docker_p0_cli) | binary(=docker_staged_cli) | binary(=docker_staged_native) | binary(=compose_cli))'

  linux-product:
    name: Build Linux x86_64 CLI test artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build-env
        with:
          native-firmware: "true"
          static-musl: "true"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-linux-product
      - run: mise run smoke
      - name: Archive static CLI for contract jobs
        run: |
          # Retain matching firmware for the native SDK driver, which is built
          # separately from the product's embedded-kernel static executables.
          mise exec -- python3 - <<'PY'
          import os
          import shutil
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts/packaging")
          import firmware
          resolved = firmware.resolve_firmware(
              "x86_64-unknown-linux-musl", target_dir=os.environ["CARGO_TARGET_DIR"])
          if resolved.library_name is None:
              raise SystemExit("CI requires the repository-built firmware library")
          destination = Path("target/x86_64-unknown-linux-musl/debug/libkrunfw.so.5")
          shutil.copyfile(resolved.path, destination)
          PY
          tar -C target/x86_64-unknown-linux-musl/debug -czf "$RUNNER_TEMP/podman-runtime.tgz" \
            pvisor pvisor-replay pvisor-daemon libkrunfw.so.5 libkrunfw.SOURCE
      - uses: actions/upload-artifact@v4
        with:
          name: podman-runtime
          path: ${{ runner.temp }}/podman-runtime.tgz
          if-no-files-found: error
          retention-days: 7

  cli-test:
    name: Rust Test / Linux / cli
    needs: linux-product
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build-env
        with:
          static-musl: "true"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-rust-cli
      - name: Enable Linux runtime test prerequisites
        shell: bash
        run: |
          bash scripts/ci/ubuntu-apt-get.sh update -qq
          bash scripts/ci/ubuntu-apt-get.sh install -y -qq --no-install-recommends fuse3 util-linux
          if sysctl kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          test -c /dev/fuse
          unshare --user --map-root-user --mount --net /bin/true
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - uses: actions/download-artifact@v4
        with:
          name: podman-runtime
          path: ${{ runner.temp }}/cli-runtime
      - name: Extract frozen CLI
        run: tar -xzf "$RUNNER_TEMP/cli-runtime/podman-runtime.tgz" -C "$RUNNER_TEMP/cli-runtime"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run documented Pi, DSH and Codex tasks through the real CLI
        env:
          PVISOR_PLUGIN_BINARY: ${{ runner.temp }}/cli-runtime/pvisor
          PVISOR_PLUGIN_TEST_OUTPUT_DIR: ${{ runner.temp }}/agent-plugin-cases
        run: mise run test-agent-plugins-native
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: agent-plugin-native-cases
          path: ${{ runner.temp }}/agent-plugin-cases
          if-no-files-found: ignore
      - name: Run CLI tests
        run: mise run test -- pvisor-cli -- -E 'not (binary(=docker_cli) | binary(=docker_p0_cli) | binary(=docker_staged_cli) | binary(=docker_staged_native) | binary(=compose_cli))'

  podman-contracts:
    name: Feature docker-cli / ${{ matrix.suite }} / Linux KVM / ${{ matrix.kernel }} guest
    needs: linux-product
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [bats, go-0, go-1]
        kernel: [linux, rust-native]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build-env
        with:
          tools: python
          setup: none
      - uses: actions/download-artifact@v4
        with:
          name: podman-runtime
          path: ${{ runner.temp }}/podman-runtime
      - name: Prepare static runtime and KVM
        run: |
          tar -xzf "$RUNNER_TEMP/podman-runtime/podman-runtime.tgz" -C "$RUNNER_TEMP/podman-runtime"
          test -x "$RUNNER_TEMP/podman-runtime/pvisor"
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - uses: actions/setup-go@v5
        if: matrix.suite != 'bats'
        with:
          go-version: "1.23.12"
          cache: false
      - name: Install Bats
        if: matrix.suite == 'bats'
        run: bash scripts/ci/ubuntu-apt-get.sh update -qq && bash scripts/ci/ubuntu-apt-get.sh install -y -qq --no-install-recommends bats
      - name: Run contract shard
        env:
          SUITE: ${{ matrix.suite }}
          PVISOR_GUEST_KERNEL: ${{ matrix.kernel }}
          PVISOR_BINARY: ${{ runner.temp }}/podman-runtime/pvisor
          PVISOR_TEST_IMAGE: docker.io/library/alpine:3.20
          PVISOR_KRUN_LOG: "1"
          RUST_LOG: error
          CONTRACT_LOGS: ${{ runner.temp }}/podman-contracts
        shell: bash
        run: mise run test-feature-contracts -- docker-cli "$SUITE"
      - name: Capture host diagnostics on contract failure
        if: failure()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/podman-contracts"
          {
            uname -a
            lscpu
            sudo dmesg --ctime
          } > "$RUNNER_TEMP/podman-contracts/host-diagnostics.txt" 2>&1
      - name: Upload contract logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: podman-contracts-linux-amd64-${{ matrix.kernel }}-${{ matrix.suite }}
          path: ${{ runner.temp }}/podman-contracts/
          if-no-files-found: error

  gateway-features:
    name: Gateway-enabled runtime and CLI / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build-env
        with:
          native-firmware: "true"
          static-musl: "true"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-gateway-features
      - name: Enable Linux runtime test prerequisites
        if: runner.os == 'Linux'
        run: |
          bash scripts/ci/ubuntu-apt-get.sh update -qq
          bash scripts/ci/ubuntu-apt-get.sh install -y -qq --no-install-recommends fuse3 util-linux
          if sysctl kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          test -c /dev/fuse
          unshare --user --map-root-user --mount --net /bin/true
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - run: mise run smoke
      - name: Test Gateway-enabled runtime and CLI
        run: mise run test -- pvisor pvisor-cli -- --features pvisor/gateway,pvisor-cli/gateway

  pvisor-isolation-regression:
    name: Host isolation hardware and filesystem examples / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          native-firmware: "true"
          static-musl: "true"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-pvisor-isolation

      - name: Enable rootless isolation primitives
        shell: bash
        run: |
          bash scripts/ci/ubuntu-apt-get.sh update -qq
          bash scripts/ci/ubuntu-apt-get.sh install -y -qq --no-install-recommends fuse3 util-linux
          if sysctl kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          test -c /dev/fuse
          unshare --user --map-root-user --mount --net /bin/true

      - name: Report core metrics and check dependency boundaries
        run: |
          mise run build -- release
          # Size/count metrics are informational; forbidden dependency edges
          # remain enforced independently of source growth.
          mise run check-core-budget -- target/release/pvisor > target/pvisor-core-budget.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pvisor-core-budget-linux
          path: target/pvisor-core-budget.json
          if-no-files-found: ignore

      - name: Run strict pVisor isolation regressions
        env:
          PVISOR_RUN_HOME: ${{ runner.temp }}/pvisor-isolation-runs
          MISE_TASK_TIMINGS: "true"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rootless-evidence"
          mise run test-isolation 2>&1 | tee "$RUNNER_TEMP/rootless-evidence/mise.log"
      - name: Upload rootless JUnit and task log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rootless-evidence-linux
          path: |
            ${{ runner.temp }}/rootless-evidence/
            target/nextest/rootless/
          if-no-files-found: error

      - name: Stop debug Host listener before release scenarios
        shell: bash
        run: |
          pkill -f "^${GITHUB_WORKSPACE}/target/debug/pvisor --pvisor-internal-host$" || [[ $? == 1 ]]

      - name: Run pVisor filesystem examples
        env:
          WORK_ROOT: ${{ runner.temp }}/pvisor-filesystem-examples
        run: mise run examples -- 01-filesystem-isolation 02-changeset-management

  examples:
    name: pVisor network and Gateway examples
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          native-firmware: "true"
          static-musl: "true"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-pvisor-examples

      - name: Run network and Gateway examples
        env:
          WORK_ROOT: ${{ runner.temp }}/pvisor-examples
        run: mise run examples -- 03-network-isolation 04-gateway-llm-control

  ci:
    name: CI
    if: always()
    needs: [agent-plugins, checks, python, firmware, native-components, rust-test, linux-product, cli-test, podman-contracts, gateway-features, pvisor-isolation-regression, examples, spec-fixtures, windows, feature-inventory, feature-cases, feature-native]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI shard to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in ${RESULTS}; do
            if [[ "${result}" != "success" ]]; then
              echo "A required CI job finished with: ${result}" >&2
              exit 1
            fi
          done
