name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  checks:
    name: Format, Clippy, and workflows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build-env
        with:
          rust: "true"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-clippy
      - name: Install actionlint
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          cd "$RUNNER_TEMP/actionlint"
          curl --fail --location --retry 3 --output actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo '023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  actionlint.tar.gz' | sha256sum --check
          tar -xzf actionlint.tar.gz actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - run: actionlint
      - run: just fmt-rust --check
      - run: just lint-rust

  python:
    name: Python and benchmark checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build-env
      - run: just lint-py
      - run: just test-py
      - run: just test-benchmark

  rust-test:
    name: Rust Test / ${{ matrix.platform }} / ${{ matrix.shard }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
            shard: core
            packages: >-
              persisting-control
              persisting-overlay-core
              persisting-overlayfs
              persisting-overlaynet
              persisting-replay
            prepare_pvisor: false
            install_zig: false
          - platform: Linux
            os: ubuntu-latest
            shard: gateway
            packages: persisting-gateway
            prepare_pvisor: false
            install_zig: false
          - platform: Linux
            os: ubuntu-latest
            shard: pvisor
            packages: persisting-pvisor
            prepare_pvisor: true
            install_zig: false
          - platform: macOS
            os: macos-latest
            shard: workspace
            packages: >-
              persisting-control
              persisting-gateway
              persisting-overlay-core
              persisting-overlayfs
              persisting-overlaynet
              persisting-pvisor
              persisting-replay
            prepare_pvisor: true
            install_zig: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          rust: "true"
          install-nextest: "true"
          install-zig: "${{ matrix.install_zig }}"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-rust-${{ matrix.shard }}

      # macOS needs the Hypervisor entitlement on the product binary. Running
      # the same recipe on Linux also keeps the smoke-test setup identical.
      - name: Build and smoke-test pVisor product binary
        if: matrix.prepare_pvisor
        run: just smoke

      - name: Run ${{ matrix.shard }} tests
        env:
          # GitHub-hosted Linux runners may disable unprivileged user
          # namespaces. The dedicated isolation job remains strict.
          PERSISTING_TEST_ALLOW_NO_USERNS: "1"
        run: just test-rust ${{ matrix.packages }}

  pvisor-isolation-regression:
    name: pVisor isolation and documented cases / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          rust: "true"
          install-nextest: "true"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-pvisor-isolation

      - name: Enable rootless isolation primitives
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fuse3 jq util-linux
          if sysctl kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          test -c /dev/fuse
          unshare --user --map-root-user --mount --net /bin/true

      - name: Run strict pVisor isolation regressions
        env:
          PERSISTING_RUN_HOME: ${{ runner.temp }}/pvisor-isolation-runs
        run: just test-isolation

      - name: Run pVisor filesystem examples
        env:
          WORK_ROOT: ${{ runner.temp }}/pvisor-filesystem-examples
        run: just examples 01-filesystem-isolation 02-changeset-management

      - name: Run documented cases
        run: |
          just cases \
            --case A01,A02,A03,A04,A05,A06 \
            --case B01,B02,B03,B04 \
            --case C02,C03,C04 \
            --case D01,D03 \
            --case F01,F02,F03 \
            --case G01,G02,G03,G06 \
            --case H01,H02 \
            --case I01,I02,I03 \
            --case J03

      - name: Upload case report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pvisor-case-report
          path: target/pvisor-case-report.md
          if-no-files-found: ignore

  examples:
    name: pVisor network and Gateway examples
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          rust: "true"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-pvisor-examples

      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      - name: Run network and Gateway examples
        env:
          WORK_ROOT: ${{ runner.temp }}/pvisor-examples
        run: just examples 03-network-isolation 04-gateway-llm-control

  ci:
    name: CI
    if: always()
    needs: [checks, python, rust-test, pvisor-isolation-regression, examples]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI shard to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in ${RESULTS}; do
            if [[ "${result}" != "success" ]]; then
              echo "A required CI job finished with: ${result}" >&2
              exit 1
            fi
          done
