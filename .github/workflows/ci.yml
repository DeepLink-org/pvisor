name: CI

on:
  workflow_call:
  push:
    branches: [main, develop, next]
  pull_request:
    branches: [main, develop, next]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  checks:
    name: Format, Clippy, and workflows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build-env
        with:
          native-firmware: "true"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-clippy
      - run: mise run lint-workflows
      - run: mise run fmt-rust -- --check
      - run: mise run lint-rust
      - run: mise run lint-api-docs

  semspec:
    name: semspec / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build-env
        with:
          tools: python rust jq github:nextest-rs/nextest
          setup: none

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/semspec -> ../../target/semspec
      - run: mise run fmt-semspec
      - run: mise run lint-semspec
      - run: mise run test-semspec
      - run: mise run semspec -- --spec-dir docs/src/zh/reference lint
      - run: mise run semspec -- lint docs/src/zh/cases
      - run: mise run semspec -- --spec-dir tools/semspec/semantics lint
      # Human review must approve STAGE, its vocabulary and engine before enabling reviewed release gates.

  python:
    name: Python and benchmark checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build-env
        with:
          tools: python uv ruff jq rust
          setup: python
      - run: mise tasks validate
      - run: mise run fmt-py -- --check
      - run: mise run lint-py
      - run: mise run test-scripts
      - run: mise run test-py

  firmware:
    name: Firmware bundle and ABI / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build-env
        with:
          tools: python uv
          setup: python
      - name: Install firmware test compiler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends build-essential
      - run: mise run fw -- test

  native-components:
    name: Native ${{ matrix.component }} / Linux x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: daemon
            package: pvisor-daemon
            test_args: ""
          - component: shim
            package: pvisor-shim
            test_args: ""
          - component: shim-vm
            package: pvisor-shim
            test_args: --features vm
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build-env
        with:
          native-firmware: "true"
          static-musl: "true"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ matrix.component }}
      # The shared pipeline prepares firmware/guest only for VM-bearing components.
      # Conventional tests are not an end-to-end KVM/prepared-image deployment gate.
      - run: mise run build -- debug ${{ matrix.component }}
      - run: mise run test -- ${{ matrix.package }} -- ${{ matrix.test_args }}

  rust-test:
    name: Rust Test / ${{ matrix.platform }} / ${{ matrix.shard }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
            shard: core
            packages: >-
              pvisor-journal
              pvisor-guest
              pvisor-core
              pvisor-overlay-core
              pvisor-overlayfs
              pvisor-overlaynet
              pvisor-replay
            prepare_pvisor: false
          - platform: Linux
            os: ubuntu-latest
            shard: gateway
            packages: pvisor-gateway
            prepare_pvisor: false
          - platform: Linux
            os: ubuntu-latest
            shard: pvisor
            packages: pvisor pvisor-vm
            prepare_pvisor: true
          - platform: macOS
            os: macos-latest
            shard: core
            packages: >-
              pvisor-journal pvisor-guest pvisor-shim pvisor-core pvisor-gateway
              pvisor-overlay-core pvisor-overlayfs pvisor-overlaynet pvisor-replay
            prepare_pvisor: false
          - platform: macOS
            os: macos-latest
            shard: pvisor
            packages: pvisor pvisor-vm
            prepare_pvisor: true
          - platform: macOS
            os: macos-latest
            shard: cli
            packages: pvisor-cli
            prepare_pvisor: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          native-firmware: "true"
          static-musl: "${{ matrix.prepare_pvisor }}"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-rust-${{ matrix.shard }}

      - name: Enable Linux runtime test prerequisites
        if: runner.os == 'Linux' && matrix.prepare_pvisor
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fuse3 util-linux
          if sysctl kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          test -c /dev/fuse
          unshare --user --map-root-user --mount --net /bin/true
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      # macOS needs the Hypervisor entitlement on the product binary. Running
      # the same recipe on Linux also keeps the smoke-test setup identical.
      - name: Build and smoke-test pVisor product binary
        if: matrix.prepare_pvisor
        run: mise run smoke

      - name: Test Journal without workspace feature unification
        if: matrix.shard == 'core'
        run: mise run test -- pvisor-journal

      - name: Test portable daemon cache service on macOS
        if: runner.os == 'macOS' && matrix.shard == 'core'
        run: mise run test -- pvisor-daemon -- --test cache

      - name: Report macOS Hypervisor availability
        if: runner.os == 'macOS'
        run: sysctl kern.hv_support

      - name: Run ${{ matrix.shard }} tests
        env:
          # GitHub-hosted Linux runners may disable unprivileged user
          # namespaces. The dedicated isolation job remains strict.
          PVISOR_TEST_ALLOW_NO_USERNS: "1"
        run: mise run test-rust -- ${{ matrix.packages }}

  cli-test:
    name: Rust Test / Linux / cli
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build-env
        with:
          native-firmware: "true"
          static-musl: "true"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-rust-cli
      - name: Enable Linux runtime test prerequisites
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fuse3 util-linux
          if sysctl kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          test -c /dev/fuse
          unshare --user --map-root-user --mount --net /bin/true
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      - run: mise run smoke
      # Freeze the static product before Cargo's native tests can replace the
      # staged binaries. Contract jobs reuse this exact build on separate VMs.
      - name: Archive static CLI for contract jobs
        run: |
          tar -C target/x86_64-unknown-linux-musl/debug -czf "$RUNNER_TEMP/podman-runtime.tgz" pvisor pvisor-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: podman-runtime
          path: ${{ runner.temp }}/podman-runtime.tgz
          if-no-files-found: error
          retention-days: 7

      - name: Run CLI tests
        env:
          PVISOR_TEST_ALLOW_NO_USERNS: "1"
        run: mise run test -- pvisor-cli

  podman-contracts:
    name: CLI contracts / ${{ matrix.suite }}
    needs: cli-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [bats, go-0, go-1]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build-env
        with:
          tools: python
          setup: none
      - uses: actions/download-artifact@v4
        with:
          name: podman-runtime
          path: ${{ runner.temp }}/podman-runtime
      - name: Prepare static runtime and KVM
        run: |
          tar -xzf "$RUNNER_TEMP/podman-runtime/podman-runtime.tgz" -C "$RUNNER_TEMP/podman-runtime"
          test -x "$RUNNER_TEMP/podman-runtime/pvisor"
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - uses: actions/setup-go@v5
        if: matrix.suite != 'bats'
        with:
          go-version: "1.23.12"
          cache: false
      - name: Install Bats
        if: matrix.suite == 'bats'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends bats
      - name: Run contract shard
        env:
          SUITE: ${{ matrix.suite }}
          PVISOR_BINARY: ${{ runner.temp }}/podman-runtime/pvisor
          PVISOR_TEST_IMAGE: mirror.gcr.io/library/alpine:3.20
          PVISOR_KRUN_LOG: "1"
          RUST_LOG: error
          CONTRACT_LOGS: ${{ runner.temp }}/podman-contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CONTRACT_LOGS"
          {
            uname -a
            "$PVISOR_BINARY" --version
            printf 'suite=%s\nPVISOR_TEST_IMAGE=%s\n' "$SUITE" "$PVISOR_TEST_IMAGE"
          } | tee "$CONTRACT_LOGS/environment.txt"
          if [[ "$SUITE" == bats ]]; then
            bats --version | tee -a "$CONTRACT_LOGS/environment.txt"
            bats --tap tests/podman/system 2>&1 | tee "$CONTRACT_LOGS/bats.tap"
          else
            go version | tee -a "$CONTRACT_LOGS/environment.txt"
            # Discover every active test; stable hashing assigns each exactly once.
            # Compile all files on every shard so shared helpers remain available.
            go test -list '^Test' tests/podman/e2e/*.go > "$CONTRACT_LOGS/discovered.txt"
            python3 - <<'PY'
          import hashlib
          import os
          import re
          from pathlib import Path

          logs = Path(os.environ["CONTRACT_LOGS"])
          tests = [s for s in (logs / "discovered.txt").read_text().splitlines() if re.fullmatch(r"Test\w+", s)]
          index = int(os.environ["SUITE"].removeprefix("go-"))
          selected = [s for s in tests if int.from_bytes(hashlib.sha256(s.encode()).digest(), "big") % 2 == index]
          if not selected:
              raise SystemExit("empty contract shard")
          (logs / "selected.txt").write_text("\n".join(selected) + "\n")
          (logs / "filter.txt").write_text("^(" + "|".join(selected) + ")$")
          PY
            go test -json -count=1 -timeout=20m -run "$(cat "$CONTRACT_LOGS/filter.txt")" tests/podman/e2e/*.go 2>&1 | tee "$CONTRACT_LOGS/go.jsonl"
          fi
      - name: Upload contract logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: podman-contracts-linux-amd64-${{ matrix.suite }}
          path: ${{ runner.temp }}/podman-contracts/
          if-no-files-found: error

  gateway-features:
    name: Gateway-enabled runtime and CLI / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build-env
        with:
          native-firmware: "true"
          static-musl: "true"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-gateway-features
      - name: Enable Linux runtime test prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fuse3 util-linux
          if sysctl kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          test -c /dev/fuse
          unshare --user --map-root-user --mount --net /bin/true
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - run: mise run smoke
      - name: Test Gateway-enabled runtime and CLI
        env:
          PVISOR_TEST_ALLOW_NO_USERNS: "1"
        run: mise run test -- pvisor pvisor-cli -- --features pvisor/gateway,pvisor-cli/gateway

  pvisor-isolation-regression:
    name: pVisor isolation and documented cases / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          native-firmware: "true"
          static-musl: "true"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-pvisor-isolation

      - name: Enable rootless isolation primitives
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fuse3 util-linux
          if sysctl kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          test -c /dev/fuse
          unshare --user --map-root-user --mount --net /bin/true

      - name: Record isolated core budget
        run: |
          mise run build -- release
          # The budget ratchets against the committed baseline in
          # scripts/ci/core-budget.json; an intentional growth regenerates it
          # with `mise run update-core-budget` in the same change.
          mise run check-core-budget -- target/release/pvisor --baseline scripts/ci/core-budget.json > target/pvisor-core-budget.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pvisor-core-budget-linux
          path: target/pvisor-core-budget.json
          if-no-files-found: ignore

      - name: Run strict pVisor isolation regressions
        env:
          PVISOR_RUN_HOME: ${{ runner.temp }}/pvisor-isolation-runs
        run: mise run test-isolation

      - name: Stop debug Host listener before release scenarios
        shell: bash
        run: |
          pkill -f "^${GITHUB_WORKSPACE}/target/debug/pvisor --pvisor-internal-host$" || [[ $? == 1 ]]

      - name: Run pVisor filesystem examples
        env:
          WORK_ROOT: ${{ runner.temp }}/pvisor-filesystem-examples
        run: mise run examples -- 01-filesystem-isolation 02-changeset-management

      - name: Run documented cases
        run: |
          mise run cases -- \
            --case S-DOC-001,S-DOC-002,S-DOC-003,S-DOC-004,S-DOC-005,S-DOC-006 \
            --case S-DOC-008,S-DOC-009,S-DOC-010,S-DOC-011 \
            --case S-DOC-013,S-DOC-014,S-DOC-015 \
            --case S-DOC-018,S-DOC-020 \
            --case S-DOC-030,S-DOC-031,S-DOC-032 \
            --case S-DOC-034,S-DOC-035,S-DOC-036,S-DOC-039 \
            --case S-DOC-041,S-DOC-042 \
            --case S-DOC-043,S-DOC-044,S-DOC-045 \
            --case S-DOC-048

      - name: Run the CLI learning path (all cases must PASS)
        run: mise run cases -- --suite use

      - name: Upload learning-path report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pvisor-learning-report
          path: target/pvisor-learning-report.json
          if-no-files-found: error

      - name: Upload case report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pvisor-case-report
          path: target/pvisor-case-report.json
          if-no-files-found: ignore

  examples:
    name: pVisor network and Gateway examples
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          native-firmware: "true"
          static-musl: "true"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-pvisor-examples

      - name: Run network and Gateway examples
        env:
          WORK_ROOT: ${{ runner.temp }}/pvisor-examples
        run: mise run examples -- 03-network-isolation 04-gateway-llm-control

  ci:
    name: CI
    if: always()
    needs: [checks, python, firmware, native-components, rust-test, cli-test, podman-contracts, gateway-features, pvisor-isolation-regression, examples, semspec]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI shard to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in ${RESULTS}; do
            if [[ "${result}" != "success" ]]; then
              echo "A required CI job finished with: ${result}" >&2
              exit 1
            fi
          done
