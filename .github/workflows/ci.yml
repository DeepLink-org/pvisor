name: CI

on:
  push:
    branches: [main, develop, next]
  pull_request:
    branches: [main, develop, next]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  checks:
    name: Format, Clippy, and workflows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build-env
        with:
          rust: "true"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-clippy
      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color
      - run: just fmt-rust --check
      - run: just lint-rust

  semspec:
    name: semspec / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build-env
        with:
          rust: "true"
          components: rustfmt, clippy
          install-nextest: "true"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/semspec
      - run: cargo fmt --manifest-path tools/semspec/Cargo.toml --check
      - run: cargo clippy --manifest-path tools/semspec/Cargo.toml --all-targets --locked -- -D warnings
      - run: just test-semspec
      - run: just semspec lint
      - run: just semspec --config semspec-doc.toml lint
      - run: just semspec --config semspec-use.toml lint
      - run: just semspec --config tools/semspec/semantics/semspec.toml lint
      # Human review must approve STAGE, its vocabulary and engine before enabling reviewed release gates.

  python:
    name: Python and benchmark checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build-env
      - run: just lint-py
      - run: just test-py

  firmware:
    name: Firmware bundle and ABI / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build-env
      - name: Install firmware test compiler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends build-essential
      - run: just test-fw

  daemon:
    name: Native daemon / Linux x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build-env
        with:
          rust: "true"
          static-musl: "true"
          install-nextest: "true"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-daemon
      # Shared native pipeline prepares the embedded kernel and Rust guest.
      # Conventional tests are not an end-to-end KVM/prepared-image deployment gate.
      - run: just daemon-build
      - run: just test-daemon

  rust-test:
    name: Rust Test / ${{ matrix.platform }} / ${{ matrix.shard }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
            shard: core
            packages: >-
              pvisor-journal
              pvisor-guest
              pvisor-core
              pvisor-overlay-core
              pvisor-overlayfs
              pvisor-overlaynet
              pvisor-replay
            prepare_pvisor: false
          - platform: Linux
            os: ubuntu-latest
            shard: gateway
            packages: pvisor-gateway
            prepare_pvisor: false
          - platform: Linux
            os: ubuntu-latest
            shard: pvisor
            packages: pvisor pvisor-vm
            prepare_pvisor: true
          - platform: Linux
            os: ubuntu-latest
            shard: cli
            packages: pvisor-cli
            prepare_pvisor: true
          - platform: macOS
            os: macos-latest
            shard: workspace
            packages: >-
              pvisor-journal
              pvisor-guest
              pvisor-core
              pvisor-gateway
              pvisor-overlay-core
              pvisor-overlayfs
              pvisor-overlaynet
              pvisor
              pvisor-vm
              pvisor-replay
              pvisor-cli
            prepare_pvisor: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          rust: "true"
          static-musl: "${{ matrix.prepare_pvisor }}"
          install-nextest: "true"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-rust-${{ matrix.shard }}

      - name: Enable Linux runtime test prerequisites
        if: runner.os == 'Linux' && matrix.prepare_pvisor
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fuse3 util-linux
          if sysctl kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          test -c /dev/fuse
          unshare --user --map-root-user --mount --net /bin/true
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      # macOS needs the Hypervisor entitlement on the product binary. Running
      # the same recipe on Linux also keeps the smoke-test setup identical.
      - name: Build and smoke-test pVisor product binary
        if: matrix.prepare_pvisor
        run: just smoke

      - name: Test Journal without workspace feature unification
        if: matrix.shard == 'core'
        run: just test pvisor-journal

      - name: Run ${{ matrix.shard }} tests
        env:
          # GitHub-hosted Linux runners may disable unprivileged user
          # namespaces. The dedicated isolation job remains strict.
          PVISOR_TEST_ALLOW_NO_USERNS: "1"
        run: just test-rust ${{ matrix.packages }}

  pvisor-isolation-regression:
    name: pVisor isolation and documented cases / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          rust: "true"
          static-musl: "true"
          install-nextest: "true"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-pvisor-isolation

      - name: Enable rootless isolation primitives
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fuse3 jq util-linux
          if sysctl kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          test -c /dev/fuse
          unshare --user --map-root-user --mount --net /bin/true

      - name: Record isolated core budget
        run: |
          cargo build --release --locked -p pvisor --lib
          cargo build --release --locked -p pvisor-cli --bin pvisor
          # Rebaseline after moving the VM implementation into the runtime closure.
          python3 scripts/ci/check_core_budget.py target/release/pvisor --max-dependencies 235 --max-workspace-lines 180000 --max-core-items 301 > target/pvisor-core-budget.json
      - uses: actions/upload-artifact@v4
        with:
          name: pvisor-core-budget-linux
          path: target/pvisor-core-budget.json

      - name: Run strict pVisor isolation regressions
        env:
          PVISOR_RUN_HOME: ${{ runner.temp }}/pvisor-isolation-runs
        run: just test-isolation

      - name: Stop debug Host listener before release scenarios
        shell: bash
        run: |
          pkill -f "^${GITHUB_WORKSPACE}/target/debug/pvisor --pvisor-internal-host$" || [[ $? == 1 ]]

      - name: Run pVisor filesystem examples
        env:
          WORK_ROOT: ${{ runner.temp }}/pvisor-filesystem-examples
        run: just examples 01-filesystem-isolation 02-changeset-management

      - name: Run documented cases
        run: |
          just cases \
            --case S-DOC-001,S-DOC-002,S-DOC-003,S-DOC-004,S-DOC-005,S-DOC-006 \
            --case S-DOC-008,S-DOC-009,S-DOC-010,S-DOC-011 \
            --case S-DOC-013,S-DOC-014,S-DOC-015 \
            --case S-DOC-018,S-DOC-020 \
            --case S-DOC-030,S-DOC-031,S-DOC-032 \
            --case S-DOC-034,S-DOC-035,S-DOC-036,S-DOC-039 \
            --case S-DOC-041,S-DOC-042 \
            --case S-DOC-043,S-DOC-044,S-DOC-045 \
            --case S-DOC-048

      - name: Run the CLI learning path (all cases must PASS)
        run: just cases-v2

      - name: Upload learning-path report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pvisor-learning-report
          path: target/pvisor-learning-report.json
          if-no-files-found: error

      - name: Upload case report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pvisor-case-report
          path: target/pvisor-case-report.json
          if-no-files-found: ignore

  examples:
    name: pVisor network and Gateway examples
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          rust: "true"
          static-musl: "true"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-pvisor-examples

      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      - name: Run network and Gateway examples
        env:
          WORK_ROOT: ${{ runner.temp }}/pvisor-examples
        run: just examples 03-network-isolation 04-gateway-llm-control

  ci:
    name: CI
    if: always()
    needs: [checks, python, firmware, daemon, rust-test, pvisor-isolation-regression, examples, semspec]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI shard to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in ${RESULTS}; do
            if [[ "${result}" != "success" ]]; then
              echo "A required CI job finished with: ${result}" >&2
              exit 1
            fi
          done
