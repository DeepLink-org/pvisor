name: Setup pVisor environment
description: Python, uv, and just, with opt-in Rust build tools
inputs:
  rust:
    description: Install stable Rust
    default: "false"
  components:
    description: Additional Rust components (comma-separated)
    default: ""
  install-nextest:
    description: Install cargo-nextest
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true

    - uses: taiki-e/install-action@v2
      with:
        tool: just@1.57.0

    - name: Install Rust
      if: inputs.rust == 'true'
      uses: dtolnay/rust-toolchain@stable
      with:
        components: ${{ inputs.components }}

    - name: Install cargo-nextest
      if: inputs.install-nextest == 'true'
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest@0.9.137

    - name: Install Apple Silicon guest Rust target
      if: runner.os == 'macOS' && inputs.rust == 'true'
      shell: bash
      run: rustup target add aarch64-unknown-linux-musl

    - name: Install Linux static musl build tools
      if: runner.os == 'Linux' && inputs.rust == 'true'
      shell: bash
      run: |
        python -m pip install ziglang==0.13.0
        echo "$(python -c 'import pathlib, ziglang; print(pathlib.Path(ziglang.__file__).parent)')" >> "$GITHUB_PATH"
        rustup target add x86_64-unknown-linux-musl
        cargo install cargo-zigbuild --locked
