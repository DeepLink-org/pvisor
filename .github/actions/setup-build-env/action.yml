name: Setup pVisor environment
description: Pinned mise toolchain and Python environment, with opt-in native build prerequisites
inputs:
  native-firmware:
    description: Prepare native firmware build prerequisites
    default: "false"
  static-musl:
    description: Install Linux tools for static CLI/shim and firmware builds
    default: "false"

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@v3
      with:
        version: 2026.10.18
        cache: true

    - name: Prepare development environment
      shell: bash
      run: mise run setup

    - name: Install Linux static musl build tools
      if: runner.os == 'Linux' && inputs.static-musl == 'true'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends build-essential flex bison libelf-dev libssl-dev curl

    - name: Install macOS native firmware build tools
      if: runner.os == 'macOS' && inputs.native-firmware == 'true'
      shell: bash
      run: |
        brew install llvm lld make gnu-sed gnu-tar
        brew_prefix="$(brew --prefix)"
        for tool_path in opt/llvm/bin opt/lld/bin opt/make/libexec/gnubin opt/gnu-sed/libexec/gnubin opt/gnu-tar/libexec/gnubin; do
          echo "$brew_prefix/$tool_path" >> "$GITHUB_PATH"
        done
        image="$RUNNER_TEMP/pvisor-fw.sparseimage"
        volume="/Volumes/pvisor-fw-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        if ! mount | grep -Fq " on $volume ("; then
          if [[ ! -f "$image" ]]; then
            hdiutil create -size 32g -type SPARSE -fs "Case-sensitive APFS" -volname pvisor-fw "$image"
          fi
          hdiutil attach -nobrowse -mountpoint "$volume" "$image"
        fi
        mkdir -p "$volume/build"
        echo "PVISOR_FW_BUILD_DIR=$volume/build" >> "$GITHUB_ENV"
