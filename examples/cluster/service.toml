# Paths are relative to this TOML, except node paths under service state.
state = "../../.pvisor/services"

# Run inside a dedicated systemd user service with Delegate=yes.
# Remove this setting only for an explicitly uncapped local preview.
cgroup_root = ":self:"

[controller]
listen = "127.0.0.1:19800"
lease_ms = 30000
admin_token_env = "PVISOR_CLUSTER_TOKEN"
worker_token_env = "PVISOR_CLUSTER_WORKER_TOKEN"

[node]
max_owners = 16
warm_owners = 2
max_sessions = 64
max_preparations = 4
max_cache_bytes = 67108864
# To enable immutable environments, set an already-published filesystem or S3 cache.
# cache_backend = "filesystem"
# cache_location = "/absolute/path/to/native-cache"
# Explicitly authorize any checkpoint/filesystem pools outside managed Worker state.
# snapshot_roots = ["/absolute/path/to/shared-checkpoints"]

[[workers]]
id = "local"
backend = "host"
slots = 1
memory_bytes = 134217728
cpu_millis = 1000
poll_ms = 200

[limits.controller]
memory_bytes = 134217728
cpu_millis = 250

[limits.node]
memory_bytes = 268435456
cpu_millis = 500

[limits."worker:local"]
memory_bytes = 536870912
cpu_millis = 500
