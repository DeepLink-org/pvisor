services:
  minio:
    image: ${CASE_MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-09-06T17-38-46Z}
    cpus: 1
    mem_limit: 512m
    command: [server, --console-address, ":9001", /data]
    environment:
      MINIO_ROOT_USER: composeadmin
      MINIO_ROOT_PASSWORD: ${CASE_ADMIN_PASSWORD:?required}
      MINIO_REGION_NAME: us-east-1
    volumes: [objects:/data]
  nginx:
    image: nginx:1.28-alpine
    cpus: 1
    mem_limit: 128m
    ports: ["127.0.0.1:${CASE_HTTP_PORT:?required}:80"]
    volumes: ["./nginx-s3.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [minio]
volumes:
  objects: {}
