events {}
http {
    server {
        listen 80;
        client_max_body_size 16m;
        add_header X-Pvisor-Proxy nginx always;
        location / {
            proxy_pass http://couchdb:5984;
            proxy_set_header Host $http_host;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
