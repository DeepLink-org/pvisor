services:
  rabbitmq:
    image: rabbitmq:4.1.8-management-alpine
    cpus: 1
    mem_limit: 512m
    environment:
      RABBITMQ_DEFAULT_USER: composeadmin
      RABBITMQ_DEFAULT_PASS: ${CASE_ADMIN_PASSWORD:?required}
      RABBITMQ_NODENAME: rabbit@localhost
    volumes:
      - messages:/var/lib/rabbitmq
      - "./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro"
  nginx:
    image: nginx:1.28-alpine
    cpus: 1
    mem_limit: 128m
    ports: ["127.0.0.1:${CASE_HTTP_PORT:?required}:80"]
    volumes: ["./nginx-rabbitmq.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [rabbitmq]
volumes:
  messages: {}
