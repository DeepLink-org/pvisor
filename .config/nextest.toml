[profile.default]
# Keep the existing detection budget, but never count leaked output handles as PASS.
leak-timeout = { period = "200ms", result = "fail" }
retries = 0

[profile.windows-ci]
# Preserve each test's own deadlines; this is a final watchdog for deadlocks.
slow-timeout = { period = "60s", terminate-after = 3 }
fail-fast = false
status-level = "fail"
final-status-level = "fail"

[profile.vm-lifecycle]
slow-timeout = { period = "60s", terminate-after = 2 }
retries = 0
fail-fast = false

[profile.vm-lifecycle.junit]
path = "junit.xml"

[profile.rootless]
# Keep capability-suite selection and results in the native runner.
default-filter = 'binary(=rootless_local) | binary(=run_config_cli) | binary(=prepared_rootfs_cli)'
retries = 0
fail-fast = false

[profile.rootless.junit]
path = "junit.xml"

[profile.macos-fuse]
# Run with --run-ignored only; the Seatbelt-only macos_safe test stays default.
default-filter = '''
binary(=macos_safe) |
(binary(=run_config_cli) & test(=safe_preset_reaches_the_run_and_reports_its_limits)) |
(binary(=session_checkpoint_cli) &
 (test(=inspect_launch_errors_clean_owned_mount_roots_and_preserve_the_proposal) |
  test(=workspace_fork_copies_files_and_preimages_and_retains_source_checkpoint)))
'''
retries = 0
fail-fast = false

# The real-time TCP recovery contract needs both guest stacks and backend threads.
[[profile.default.overrides]]
filter = 'package(=pvisor-overlaynet) & binary(=peer_network) & test(=tcp_guests::tcp_duplex_recovers_from_loss_duplication_and_reordering)'
threads-required = "num-test-threads"

# Concurrent execs/fsyncs on hosted macOS can consume the one-second output probe
# or ten-second FIFO drain budget. Reserve all slots for these deadline checks.
[[profile.default.overrides]]
filter = 'package(=pvisor-gateway) & (test(=injection::process::tests::large_output_does_not_deadlock_on_a_pipe) | test(=engine::tests::scheduling::one_bounded_fifo_reports_overload_and_shutdown_drains_accepted_tail))'
threads-required = "num-test-threads"

# Concurrent cold Mach-O launches can stall before main on macOS and consume
# the five-second resolver readiness budget.
[[profile.default.overrides]]
filter = 'package(=pvisor-cli) & binary(=command_extensions) & test(=session_pool_startup_remains_cancellable_while_the_companion_waits)'
threads-required = "num-test-threads"

# These wall-clock checks include synchronous spawn and reader-thread startup,
# before supervision starts; concurrent cold launches can exhaust that budget.
[[profile.default.overrides]]
filter = 'package(=pvisor-replay) & (test(=adapter::claude_code::tests::bash_timeout_kills_the_historical_process_group) | test(=process::tests::times_out_and_reaps_the_foreground_process_group))'
threads-required = "num-test-threads"

# The continuation fixture's upstream deadline includes child and Python startup.
# Concurrent cold launches on macOS can exhaust it before the first request.
[[profile.default.overrides]]
filter = 'package(=pvisor-replay) & binary(=continuation_failures) & test(=opencode_continuation_preserves_failure_and_step_budget)'
threads-required = "num-test-threads"

# This fixture mounts FUSE beneath the checkout. Reserve all slots so concurrent
# Sessions staging HOME do not inherit it as an unsupported nested mount.
[[profile.default.overrides]]
filter = 'package(=pvisor-cli) & binary(=rootless_local) & test(=safe_shell_supports_nested_stages_without_exposing_their_backing)'
threads-required = "num-test-threads"
