[project.theme]
language = "en"
custom_dir = "overrides"
logo = "assets/logos/pvisor-icon.png"
favicon = "assets/logos/pvisor-icon.png"
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.expand",
  "navigation.indexes",
  "navigation.path",
  "navigation.tracking",
  "navigation.top",
  "search.highlight",
  "content.code.copy",
  "content.code.select",
  "content.code.annotate",
  "content.tabs.link",
  "content.tooltips",
  "content.footnote.tooltips",
  "toc.follow",
]

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"

[[project.extra.alternate]]
name = "English"
link = "https://deeplink-org.github.io/pvisor/en/"
lang = "en"

[[project.extra.alternate]]
name = "中文"
link = "https://deeplink-org.github.io/pvisor/zh/"
lang = "zh"

[project.markdown_extensions."admonition"]

[project.markdown_extensions."pymdownx.details"]

[project.markdown_extensions."pymdownx.superfences"]

[project.markdown_extensions."pymdownx.highlight"]
anchor_linenums = true

[project.markdown_extensions."pymdownx.inlinehilite"]

[project.markdown_extensions."pymdownx.tabbed"]
alternate_style = true

[project.markdown_extensions."attr_list"]

[project.markdown_extensions."md_in_html"]

[project.markdown_extensions."def_list"]

[project.markdown_extensions."tables"]

[project.markdown_extensions."toc"]
permalink = true

[project.plugins.search]
lang = ["en"]

[project.plugins.exclude]
regex = ["(^|/)\\.data(/|$)"]
