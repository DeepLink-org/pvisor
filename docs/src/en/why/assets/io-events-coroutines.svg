<rect x="342" y="607" width="280" height="36" rx="6" fill="#eef2f6" stroke="#dbe3ed"/>
<text x="482.0" y="632" font-size="18" font-weight="500" text-anchor="middle" style="fill:#526176">I/O wait · suspended</text>
<rect x="622" y="607" width="140" height="36" rx="6" fill="#2563eb" stroke="#2563eb"/>
<text x="692.0" y="632" font-size="18" font-weight="500" text-anchor="middle" style="fill:white">A</text>
