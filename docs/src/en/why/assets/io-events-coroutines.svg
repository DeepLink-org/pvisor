<rect x="342" y="658" width="140" height="36" rx="6" fill="#059669" stroke="#059669"/>
<text x="412.0" y="683" font-size="18" font-weight="500" text-anchor="middle" style="fill:white">B</text>
<rect x="482" y="658" width="280" height="36" rx="6" fill="#eef2f6" stroke="#dbe3ed"/>
<text x="622.0" y="683" font-size="18" font-weight="500" text-anchor="middle" style="fill:#526176">I/O wait · suspended</text>
<rect x="762" y="658" width="140" height="36" rx="6" fill="#059669" stroke="#059669"/>
<text x="832.0" y="683" font-size="18" font-weight="500" text-anchor="middle" style="fill:white">B</text>
<text x="52" y="734" font-size="18" font-weight="400" text-anchor="start" style="fill:#172033">Coroutine C</text>
<path d="M202 727 L1042 727" fill="none" stroke="#cbd5e1" stroke-width="2"/>
<rect x="482" y="709" width="140" height="36" rx="6" fill="#b45309" stroke="#b45309"/>
<text x="552.0" y="734" font-size="18" font-weight="500" text-anchor="middle" style="fill:white">C</text>
<rect x="622" y="709" width="280" height="36" rx="6" fill="#eef2f6" stroke="#dbe3ed"/>
<text x="762.0" y="734" font-size="18" font-weight="500" text-anchor="middle" style="fill:#526176">I/O wait · suspended</text>
<rect x="902" y="709" width="140" height="36" rx="6" fill="#b45309" stroke="#b45309"/>
<text x="972.0" y="734" font-size="18" font-weight="500" text-anchor="middle" style="fill:white">C</text>
<text x="202" y="792" font-size="18" font-weight="400" text-anchor="start" style="fill:#526176">Syscall hooks / library integration → suspend &amp; resume → event engine</text>
<path d="M622 807 L622 836" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="52" y="880" font-size="18" font-weight="400" text-anchor="start" style="fill:#172033">Worker</text>
<rect x="202" y="854" width="140" height="36" rx="6" fill="#2563eb" stroke="#2563eb"/>
<text x="272.0" y="879" font-size="18" font-weight="500" text-anchor="middle" style="fill:white">A</text>
<rect x="342" y="854" width="140" height="36" rx="6" fill="#059669" stroke="#059669"/>
<text x="412.0" y="879" font-size="18" font-weight="500" text-anchor="middle" style="fill:white">B</text>
<rect x="482" y="854" width="140" height="36" rx="6" fill="#b45309" stroke="#b45309"/>
<text x="552.0" y="879" font-size="18" font-weight="500" text-anchor="middle" style="fill:white">C</text>
<rect x="622" y="854" width="140" height="36" rx="6" fill="#2563eb" stroke="#2563eb"/>
<text x="692.0" y="879" font-size="18" font-weight="500" text-anchor="middle" style="fill:white">A</text>
<rect x="762" y="854" width="140" height="36" rx="6" fill="#059669" stroke="#059669"/>
<text x="832.0" y="879" font-size="18" font-weight="500" text-anchor="middle" style="fill:white">B</text>
<rect x="902" y="854" width="140" height="36" rx="6" fill="#b45309" stroke="#b45309"/>
<text x="972.0" y="879" font-size="18" font-weight="500" text-anchor="middle" style="fill:white">C</text>
<text x="32" y="960" font-size="18" font-weight="400" text-anchor="start" style="fill:#526176">Same scheduling idea: explicit event code manages states; coroutines let the runtime retain context.</text>
<text x="32" y="989" font-size="17" font-weight="400" text-anchor="start" style="fill:#526176">One worker is illustrative and can scale to several; transparency covers integrated I/O paths.</text>
</svg>
