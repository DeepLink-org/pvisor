<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 540" width="1120" height="540" role="img" aria-labelledby="title desc" xml:lang="en" style="max-width:100%;height:auto">
<title id="title">Long lifetimes, intermittent computation</title>
<desc id="desc">The upper panel summarizes DSec production statistics. The lower panel is a schematic of alternating computation and waits, not a measured trace or a fixed period.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",sans-serif;fill:#172033} .muted{fill:#526176}</style>
<rect width="1120" height="540" rx="16" fill="white"/>
<text x="32" y="43" font-size="17" font-weight="700" text-anchor="start" style="fill:#2563eb">01 · WORKLOAD</text>
<text x="32" y="80" font-size="28" font-weight="700" text-anchor="start" style="fill:#172033">State persists; computation comes in phases</text>
<text x="32" y="113" font-size="18" font-weight="400" text-anchor="start" style="fill:#526176">DeepSeek DSec: one week of production samples in early 2026 · §4.3, Figs. 5 / 7</text>
<rect x="32" y="138" width="510" height="146" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
<rect x="558" y="138" width="530" height="146" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
<text x="54" y="174" font-size="19" font-weight="600" text-anchor="start" style="fill:#2563eb">Sparse CPU use</text>
<text x="54" y="219" font-size="36" font-weight="700" text-anchor="start" style="fill:#2563eb">≈90%</text>
<text x="223" y="205" font-size="18" font-weight="400" text-anchor="start" style="fill:#172033">of sandboxes, for both backends</text>
<text x="223" y="235" font-size="18" font-weight="400" text-anchor="start" style="fill:#172033">average ≤5% of requested CPU</text>
<text x="580" y="174" font-size="19" font-weight="600" text-anchor="start" style="fill:#059669">Long sandbox lifetimes</text>
<text x="580" y="214" font-size="30" font-weight="700" text-anchor="start" style="fill:#059669">17.4 / 15.5 min</text>
<text x="580" y="251" font-size="18" font-weight="400" text-anchor="start" style="fill:#172033">Container / microVM medians; both P99 &gt;3 hours</text>
<text x="32" y="326" font-size="17" font-weight="700" text-anchor="start" style="fill:#526176">SCHEMATIC</text>
<text x="32" y="376" font-size="18" font-weight="400" text-anchor="start" style="fill:#172033">Compute / wait</text>
<rect x="202" y="351" width="112" height="36" rx="6" fill="#2563eb" stroke="#2563eb"/>
<text x="258.0" y="376" font-size="18" font-weight="500" text-anchor="middle" style="fill:white">Read</text>
<rect x="314" y="351" width="264" height="36" rx="6" fill="#eef2f6" stroke="#dbe3ed"/>
<text x="446.0" y="376" font-size="18" font-weight="500" text-anchor="middle" style="fill:#526176">Wait for model</text>
<rect x="578" y="351" width="124" height="36" rx="6" fill="#2563eb" stroke="#2563eb"/>
<text x="640.0" y="376" font-size="18" font-weight="500" text-anchor="middle" style="fill:white">Edit</text>
<rect x="702" y="351" width="180" height="36" rx="6" fill="#eef2f6" stroke="#dbe3ed"/>
<text x="792.0" y="376" font-size="18" font-weight="500" text-anchor="middle" style="fill:#526176">Wait for I/O</text>
<rect x="882" y="351" width="174" height="36" rx="6" fill="#2563eb" stroke="#2563eb"/>
<text x="969.0" y="376" font-size="18" font-weight="500" text-anchor="middle" style="fill:white">Test</text>
<text x="32" y="435" font-size="18" font-weight="400" text-anchor="start" style="fill:#172033">Environment</text>
<rect x="202" y="410" width="854" height="36" rx="6" fill="#059669" stroke="#059669"/>
<text x="629.0" y="435" font-size="18" font-weight="500" text-anchor="middle" style="fill:white">Processes, memory and caches may stay resident across the task</text>
<text x="32" y="488" font-size="18" font-weight="400" text-anchor="start" style="fill:#526176">Schematic only, not to scale: computation and waits recur at irregular intervals.</text>
<text x="32" y="518" font-size="16" font-weight="400" text-anchor="start" style="fill:#526176">Lifetime sample: 30K containers, 10K microVMs · Source: arxiv.org/abs/2609.22978</text>
</svg>
