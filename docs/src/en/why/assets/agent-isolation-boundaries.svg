<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" width="1200" height="1000" role="img" aria-labelledby="title desc" xml:lang="en" style="max-width:100%;height:auto">
  <title id="title">Processes, containers and VMs: where isolation happens</title>
  <desc id="desc">Three columns compare isolation. Ordinary processes have separate user address spaces but enter the same host kernel. Containers use namespaces and cgroups to separate resource views and limit resources, while sharing the host kernel and its address space. In a hosted virtual machine model, user processes enter separate guest kernels, then access the host platform through virtual I/O, a VMM or hypervisor, and the host kernel. Typical I/O paths below illustrate boundaries, not linear performance costs or absolute security guarantees.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Noto Sans", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #172033; }
    .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
    .user { fill: #eff6ff; stroke: #60a5fa; stroke-width: 1.5; }
    .shared { fill: #ecfdf5; stroke: #34d399; stroke-width: 1.5; }
    .guest { fill: #fff7ed; stroke: #fb923c; stroke-width: 1.5; }
    .platform { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 1.2; }
    .arrow { fill: none; stroke: #475569; stroke-width: 1.8; marker-end: url(#arrow); }
    .muted { fill: #475569; }
  </style>
  <rect width="1200" height="1000" fill="#ffffff"/>
  <text x="24" y="44" font-size="28" text-anchor="start" font-weight="700">Processes, containers and VMs: where isolation happens</text>
  <text x="24" y="77" font-size="16" text-anchor="start" class="muted">Separate user address spaces, shared or separate kernels, and different paths for data I/O.</text>
  <rect x="24" y="100" width="18" height="18" rx="4" class="user"/>
  <text x="52" y="115" font-size="14" text-anchor="start" class="muted">User address space</text>
  <rect x="340" y="100" width="18" height="18" rx="4" class="shared"/>
  <text x="368" y="115" font-size="14" text-anchor="start" class="muted">Shared host kernel</text>
  <rect x="704" y="100" width="18" height="18" rx="4" class="guest"/>
  <text x="732" y="115" font-size="14" text-anchor="start" class="muted">Separate guest kernel</text>
  <rect x="24" y="134" width="368" height="636" rx="16" class="panel"/>
  <text x="44" y="176" font-size="24" text-anchor="start" font-weight="700" style="fill:#1d4ed8">Process</text>
  <text x="44" y="207" font-size="14" text-anchor="start" class="muted">Separate user spaces; shared kernel</text>
  <rect x="416" y="134" width="368" height="636" rx="16" class="panel"/>
  <text x="436" y="176" font-size="24" text-anchor="start" font-weight="700" style="fill:#047857">Container</text>
  <text x="436" y="207" font-size="14" text-anchor="start" class="muted">Separate resource views; shared kernel</text>
  <rect x="808" y="134" width="368" height="636" rx="16" class="panel"/>
  <text x="828" y="176" font-size="24" text-anchor="start" font-weight="700" style="fill:#b45309">Virtual machine</text>
  <text x="828" y="207" font-size="14" text-anchor="start" class="muted">Separate user spaces and guest kernels</text>
  <rect x="44" y="263" width="152" height="77" rx="10" class="user"/>
  <text x="120" y="293" font-size="17" text-anchor="middle" font-weight="600" style="fill:#1e3a8a">Process A</text>
  <text x="120" y="320" font-size="12" text-anchor="middle" style="fill:#1e3a8a">Own user address space</text>
  <rect x="220" y="263" width="152" height="77" rx="10" class="user"/>
  <text x="296" y="293" font-size="17" text-anchor="middle" font-weight="600" style="fill:#1e3a8a">Process B</text>
  <text x="296" y="320" font-size="12" text-anchor="middle" style="fill:#1e3a8a">Own user address space</text>
  <rect x="434" y="248" width="160" height="122" rx="12" fill="#f0fdf4" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="442" y="263" width="144" height="77" rx="10" class="user"/>
  <text x="514" y="293" font-size="17" text-anchor="middle" font-weight="600" style="fill:#1e3a8a">Process A</text>
  <text x="514" y="320" font-size="12" text-anchor="middle" style="fill:#1e3a8a">Own user address space</text>
  <text x="514" y="359" font-size="12" text-anchor="middle" style="fill:#065f46">namespace / cgroup</text>
  <rect x="612" y="248" width="160" height="122" rx="12" fill="#f0fdf4" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="620" y="263" width="144" height="77" rx="10" class="user"/>
  <text x="692" y="293" font-size="17" text-anchor="middle" font-weight="600" style="fill:#1e3a8a">Process B</text>
  <text x="692" y="320" font-size="12" text-anchor="middle" style="fill:#1e3a8a">Own user address space</text>
  <text x="692" y="359" font-size="12" text-anchor="middle" style="fill:#065f46">namespace / cgroup</text>
  <rect x="826" y="248" width="160" height="268" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.7"/>
  <rect x="834" y="263" width="144" height="77" rx="10" class="user"/>
  <text x="906" y="293" font-size="17" text-anchor="middle" font-weight="600" style="fill:#1e3a8a">Process A</text>
  <text x="906" y="320" font-size="12" text-anchor="middle" style="fill:#1e3a8a">Own user address space</text>
  <text x="906" y="363" font-size="12" text-anchor="middle" class="muted">System call</text>
  <path d="M 906 373 L 906 390" class="arrow"/>
  <rect x="834" y="398" width="144" height="70" rx="10" class="guest"/>
  <text x="906" y="427" font-size="17" text-anchor="middle" font-weight="600" style="fill:#9a3412">Guest kernel</text>
  <text x="906" y="452" font-size="11" text-anchor="middle" style="fill:#9a3412">Own kernel address space</text>
  <text x="906" y="493" font-size="13" text-anchor="middle" font-weight="600" style="fill:#92400e">VM A</text>
  <rect x="1004" y="248" width="160" height="268" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.7"/>
  <rect x="1012" y="263" width="144" height="77" rx="10" class="user"/>
  <text x="1084" y="293" font-size="17" text-anchor="middle" font-weight="600" style="fill:#1e3a8a">Process B</text>
  <text x="1084" y="320" font-size="12" text-anchor="middle" style="fill:#1e3a8a">Own user address space</text>
  <text x="1084" y="363" font-size="12" text-anchor="middle" class="muted">System call</text>
  <path d="M 1084 373 L 1084 390" class="arrow"/>
  <rect x="1012" y="398" width="144" height="70" rx="10" class="guest"/>
  <text x="1084" y="427" font-size="17" text-anchor="middle" font-weight="600" style="fill:#9a3412">Guest kernel</text>
  <text x="1084" y="452" font-size="11" text-anchor="middle" style="fill:#9a3412">Own kernel address space</text>
  <text x="1084" y="493" font-size="13" text-anchor="middle" font-weight="600" style="fill:#92400e">VM B</text>
  <path d="M 120 348 L 120 390" class="arrow"/>
  <path d="M 296 348 L 296 390" class="arrow"/>
  <text x="208" y="370" font-size="13" text-anchor="middle" class="muted">System call</text>
  <rect x="44" y="398" width="328" height="118" rx="10" class="shared"/>
  <text x="208" y="438" font-size="22" text-anchor="middle" font-weight="600" style="fill:#065f46">Shared host kernel</text>
  <text x="208" y="470" font-size="14" text-anchor="middle" style="fill:#065f46">One kernel instance / address space</text>
  <text x="208" y="496" font-size="13" text-anchor="middle" style="fill:#065f46">Both processes execute kernel code here</text>
  <path d="M 208 530 L 208 656" class="arrow"/>
  <rect x="52" y="546" width="312" height="61" rx="0" fill="#f8fafc"/>
  <text x="208" y="568" font-size="15" text-anchor="middle" class="muted">File / network / device I/O</text>
  <text x="208" y="592" font-size="12" text-anchor="middle" class="muted">Kernel checks permissions and resources</text>
  <path d="M 514 378 L 514 390" class="arrow"/>
  <path d="M 692 378 L 692 390" class="arrow"/>
  <text x="600" y="385" font-size="13" text-anchor="middle" class="muted">System call</text>
  <rect x="436" y="398" width="328" height="118" rx="10" class="shared"/>
  <text x="600" y="438" font-size="22" text-anchor="middle" font-weight="600" style="fill:#065f46">Shared host kernel</text>
  <text x="600" y="470" font-size="14" text-anchor="middle" style="fill:#065f46">One kernel instance / address space</text>
  <text x="600" y="496" font-size="13" text-anchor="middle" style="fill:#065f46">Implements namespaces and cgroups</text>
  <path d="M 600 530 L 600 656" class="arrow"/>
  <rect x="444" y="546" width="312" height="61" rx="0" fill="#f8fafc"/>
  <text x="600" y="568" font-size="15" text-anchor="middle" class="muted">File / network / device I/O</text>
  <text x="600" y="592" font-size="12" text-anchor="middle" class="muted">Kernel checks permissions, views and limits</text>
  <text x="992" y="536" font-size="13" text-anchor="middle" class="muted">Virtual I/O</text>
  <path d="M 906 518 L 906 540" class="arrow"/>
  <path d="M 1084 518 L 1084 540" class="arrow"/>
  <rect x="828" y="546" width="328" height="44" rx="10" fill="#fff7ed" stroke="#fb923c"/>
  <text x="992" y="574" font-size="16" text-anchor="middle" font-weight="600" style="fill:#9a3412">VMM / hypervisor boundary</text>
  <path d="M 992 593 L 992 603" class="arrow"/>
  <rect x="828" y="607" width="328" height="41" rx="10" class="shared"/>
  <text x="992" y="634" font-size="17" text-anchor="middle" font-weight="600" style="fill:#065f46">Host kernel</text>
  <path d="M 992 651 L 992 662" class="arrow"/>
  <rect x="44" y="666" width="328" height="60" rx="10" class="platform"/>
  <text x="208" y="702" font-size="14" text-anchor="middle" font-weight="600" style="fill:#334155">Host platform · CPU / RAM / devices</text>
  <text x="208" y="749" font-size="12" text-anchor="middle" class="muted">Processes enter the same kernel instance.</text>
  <rect x="436" y="666" width="328" height="60" rx="10" class="platform"/>
  <text x="600" y="702" font-size="14" text-anchor="middle" font-weight="600" style="fill:#334155">Host platform · CPU / RAM / devices</text>
  <text x="600" y="749" font-size="12" text-anchor="middle" class="muted">Containers share the kernel address space.</text>
  <rect x="828" y="666" width="328" height="60" rx="10" class="platform"/>
  <text x="992" y="702" font-size="14" text-anchor="middle" font-weight="600" style="fill:#334155">Host platform · CPU / RAM / devices</text>
  <text x="992" y="749" font-size="12" text-anchor="middle" class="muted">Hosted VM model; separate guest kernels.</text>
  <text x="24" y="806" font-size="20" text-anchor="start" font-weight="600">Typical I/O paths: boundaries require permission checks or protocol handling</text>
  <rect x="24" y="828" width="368" height="104" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="44" y="865" font-size="14" text-anchor="start" font-weight="600">Process → system call → host kernel</text>
  <text x="44" y="897" font-size="13" text-anchor="start" class="muted">Permissions, data copying and kernel work</text>
  <rect x="416" y="828" width="368" height="104" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="436" y="865" font-size="14" text-anchor="start" font-weight="600">Process → system call → shared kernel</text>
  <text x="436" y="897" font-size="13" text-anchor="start" class="muted">Resource views and limits in the same kernel</text>
  <rect x="808" y="828" width="368" height="104" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="828" y="865" font-size="14" text-anchor="start" font-weight="600">Guest → virtual I/O → host service</text>
  <text x="828" y="897" font-size="13" text-anchor="start" class="muted">Device, filesystem or network protocols</text>
  <text x="24" y="962" font-size="14" text-anchor="start" class="muted">Boundaries show structure, not a performance scale. I/O cost depends on the path, batching, shared memory and implementation.</text>
  <text x="24" y="987" font-size="14" text-anchor="start" class="muted">Isolation also depends on privileges, configuration and vulnerabilities. VMs do not guarantee absolute security.</text>
</svg>
