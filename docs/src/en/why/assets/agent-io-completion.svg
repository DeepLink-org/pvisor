<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="title desc" xml:lang="en" style="max-width:100%;height:auto">
  <title id="title">Core challenge: Agent-level I/O completion</title>
  <desc id="desc">pVisor's core architecture and engineering path; the protocol loop remains incomplete. Time runs left to right. The guest submits a request and hands off its payload; the host takes ownership of independent buffers and requests. After guest RAM and descriptor borrowers are drained and recoverable state is committed, the guest can be offloaded without termination. Downloads, LLM requests and bulk writes continue using host-owned state without accessing offloaded guest RAM. Results enter a bounded completion queue or staged object and trigger wakeup. Guest RAM is restored before completion delivery and continuation of the same attempt. Host buffers and result staging consume memory and must be charged against savings. Current whole-VM offload still drains device requests first; this diagram does not describe an implemented feature.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/></marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#059669"/></marker>
  </defs>
  <style>
    text { font-family: "Noto Sans", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #172033; }
    .muted { fill: #475569; }
    .guest { fill: #eff6ff; stroke: #60a5fa; stroke-width: 1.5; }
    .host { fill: #ecfdf5; stroke: #34d399; stroke-width: 1.5; }
    .arrow { fill: none; stroke: #475569; stroke-width: 1.8; marker-end: url(#arrow); }
    .host-arrow { fill: none; stroke: #059669; stroke-width: 2; marker-end: url(#green-arrow); }
    .offload { stroke-dasharray: 7 5; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="24" y="43" font-size="28" text-anchor="start" font-weight="700">Core challenge: Agent-level I/O completion</text>
  <text x="24" y="76" font-size="16" text-anchor="start" class="muted">Park the execution environment safely; host-owned I/O keeps progressing and wakes execution when ready.</text>
  <path d="M 180 115 L 1168 115" class="arrow"/>
  <text x="1082" y="103" font-size="14" text-anchor="start" class="muted">Time →</text>
  <rect x="160" y="136" width="1016" height="150" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="160" y="318" width="1016" height="148" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
  <rect x="560" y="146" width="350" height="310" rx="12" fill="#f0f9ff" stroke="#60a5fa" class="offload" stroke-width="1.5"/>
  <text x="24" y="186" font-size="16" text-anchor="start" font-weight="700" style="fill:#1d4ed8">Guest execution</text>
  <text x="24" y="211" font-size="12" text-anchor="start" class="muted">Program + Linux state</text>
  <text x="24" y="370" font-size="17" text-anchor="start" font-weight="700" style="fill:#047857">Host I/O</text>
  <text x="24" y="396" font-size="12" text-anchor="start" class="muted">Owned objects + tasks</text>
  <rect x="180" y="173" width="150" height="74" rx="12" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="255.0" y="201" font-size="14" text-anchor="middle" font-weight="600" style="fill:#1e3a8a">Run program</text>
  <text x="255.0" y="227" font-size="13" text-anchor="middle" style="fill:#1e3a8a">Issue an I/O request</text>
  <rect x="360" y="173" width="180" height="74" rx="12" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="450.0" y="201" font-size="14" text-anchor="middle" font-weight="600" style="fill:#1e3a8a">Submit request + data</text>
  <text x="450.0" y="227" font-size="13" text-anchor="middle" style="fill:#1e3a8a">Transfer data ownership</text>
  <rect x="938" y="173" width="230" height="74" rx="12" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="1053.0" y="201" font-size="14" text-anchor="middle" font-weight="600" style="fill:#1e3a8a">Restore guest RAM</text>
  <text x="1053.0" y="227" font-size="13" text-anchor="middle" style="fill:#1e3a8a">Deliver completion; continue</text>
  <rect x="575" y="166" width="320" height="85" rx="12" fill="#eff6ff" stroke="#3b82f6" class="offload" stroke-width="1.7"/>
  <text x="735" y="198" font-size="17" text-anchor="middle" font-weight="600" style="fill:#1e3a8a">Safe offload · same attempt</text>
  <text x="735" y="227" font-size="14" text-anchor="middle" style="fill:#1e3a8a">Park execution; reduce RAM residency</text>
  <path d="M 332 210 L 356 210" class="arrow"/>
  <path d="M 542 210 L 570 210" class="arrow offload"/>
  <path d="M 897 210 L 934 210" class="arrow offload"/>
  <text x="735" y="274" font-size="12" text-anchor="middle" style="fill:#1d4ed8">Offload window: host I/O does not access guest RAM</text>
  <path d="M 450 250 L 450 345" class="host-arrow"/>
  <text x="466" y="302" font-size="13" text-anchor="start" style="fill:#047857">Data handoff</text>
  <rect x="360" y="350" width="180" height="84" rx="12" fill="#ecfdf5" stroke="#34d399"/>
  <text x="450.0" y="376" font-size="14" text-anchor="middle" font-weight="600" style="fill:#065f46">Own buffer / request</text>
  <text x="450.0" y="401" font-size="12" text-anchor="middle" style="fill:#065f46">Keep owned data / objects</text>
  <text x="450.0" y="422" font-size="12" text-anchor="middle" style="fill:#065f46">No borrowed guest memory</text>
  <rect x="575" y="350" width="320" height="84" rx="12" fill="#ecfdf5" stroke="#34d399"/>
  <text x="735.0" y="376" font-size="14" text-anchor="middle" font-weight="600" style="fill:#065f46">Download / LLM / bulk write progresses</text>
  <text x="735.0" y="401" font-size="12" text-anchor="middle" style="fill:#065f46">Host owns connection, request and payload</text>
  <text x="735.0" y="422" font-size="12" text-anchor="middle" style="fill:#065f46">No guest execution needed for this I/O</text>
  <rect x="938" y="350" width="230" height="84" rx="12" fill="#ecfdf5" stroke="#34d399"/>
  <text x="1053.0" y="376" font-size="14" text-anchor="middle" font-weight="600" style="fill:#065f46">Bounded completion queue</text>
  <text x="1053.0" y="401" font-size="12" text-anchor="middle" style="fill:#065f46">Keep result or object handle</text>
  <text x="1053.0" y="422" font-size="12" text-anchor="middle" style="fill:#065f46">Capacity limits, backpressure, expiry</text>
  <path d="M 542 392 L 570 392" class="host-arrow"/>
  <path d="M 897 392 L 934 392" class="host-arrow"/>
  <path d="M 1053 347 L 1053 251" class="host-arrow offload"/>
  <text x="1068" y="302" font-size="12" text-anchor="start" style="fill:#047857">Complete → wake</text>
  <rect x="24" y="494" width="560" height="141" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="42" y="523" font-size="17" text-anchor="start" font-weight="600">Prerequisites for safe parking</text>
  <text x="42" y="550" font-size="12.5" text-anchor="start" class="muted">Park vCPUs; drain guest RAM / descriptor borrowers.</text>
  <text x="42" y="572" font-size="12.5" text-anchor="start" class="muted">Host-owned I/O proceeds; guest delivery waits for restore.</text>
  <text x="42" y="594" font-size="12.5" text-anchor="start" class="muted">Accepted ≠ durable ≠ completed ≠ received by guest.</text>
  <text x="42" y="616" font-size="12.5" text-anchor="start" class="muted">Resolve timeout / cancel outcomes; no blind non-idempotent replay.</text>
  <rect x="600" y="494" width="576" height="141" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="618" y="523" font-size="17" text-anchor="start" font-weight="600">Trade-off: host buffers versus whole-guest residency</text>
  <text x="618" y="550" font-size="12.5" text-anchor="start" class="muted">Memory saved (GiB·s) ≈ (G − H) × T</text>
  <text x="618" y="572" font-size="12.5" text-anchor="start" class="muted">G: physical RAM freed; H: added buffers, queues and page cache</text>
  <text x="618" y="594" font-size="12.5" text-anchor="start" class="muted">T: offloaded duration. Use residency integrals for actual savings.</text>
  <text x="618" y="616" font-size="12.5" text-anchor="start" class="muted">Include copy / restore costs and concurrent-wakeup memory peaks.</text>
  <text x="24" y="662" font-size="14" text-anchor="start" class="muted">Core architecture. Current whole-VM offload drains device requests; host handoff and automatic wakeup are not implemented.</text>
  <text x="24" y="686" font-size="14" text-anchor="start" class="muted">Uses submission / completion queues as a model; does not implement Windows IOCP APIs or terminate / restart the guest.</text>
</svg>
