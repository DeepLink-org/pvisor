<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850" role="img" aria-labelledby="title desc" xml:lang="en" style="max-width:100%;height:auto">
<title id="title">How pVisor connects Linux execution to host services</title>
<desc id="desc">Agents and tools run inside guest Linux. Most system calls remain in the guest. Exported file-tree requests use virtio-fs to reach the host file service, and network requests use virtio-net to reach controlled egress. Host facilities also manage supported memory sharing and reclamation, plus staging and result acceptance for native Jobs.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/></marker></defs>
<style>text{font-family:"Noto Sans","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}.line{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="1200" height="850" fill="#fff"/>
<text x="30" y="43" font-size="27" font-weight="700" text-anchor="start" style="fill:#172033">How pVisor connects Linux execution to host services</text>
<text x="30" y="78" font-size="17" font-weight="400" text-anchor="start" style="fill:#475569">Keep Linux application compatibility; coordinate control and resources at explicit boundaries.</text>
<rect x="30" y="108" width="480" height="408" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="680" y="108" width="490" height="408" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="55" y="147" font-size="22" font-weight="700" text-anchor="start" style="fill:#1d4ed8">Guest execution environment</text>
<text x="705" y="147" font-size="22" font-weight="700" text-anchor="start" style="fill:#047857">Host services</text>
<rect x="65" y="181" width="410" height="90" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
<text x="85" y="213" font-size="18" font-weight="600" text-anchor="start" style="fill:#172033">Agent CLI, shell, and development tools</text>
<text x="85" y="240" font-size="15" font-weight="400" text-anchor="start" style="fill:#172033">Separate user processes and address spaces</text>
<rect x="65" y="326" width="410" height="153" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
<text x="85" y="358" font-size="18" font-weight="600" text-anchor="start" style="fill:#172033">Customized Linux guest kernel</text>
<text x="85" y="385" font-size="15" font-weight="400" text-anchor="start" style="fill:#172033">System calls, processes, caches, and TCP/IP</text>
<text x="85" y="412" font-size="15" font-weight="400" text-anchor="start" style="fill:#172033">Internal work and cache hits can stay local</text>
<path d="M 270 272 L 270 319" class="line"/>
<text x="290" y="304" font-size="15" font-weight="400" text-anchor="start" style="fill:#172033">System calls</text>
<rect x="710" y="181" width="430" height="85" rx="12" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
<text x="730" y="213" font-size="18" font-weight="600" text-anchor="start" style="fill:#172033">OCI user space and shared image cache</text>
<text x="730" y="240" font-size="15" font-weight="400" text-anchor="start" style="fill:#172033">Pinned content versions; files read on demand</text>
<path d="M 925 267 L 925 298" class="line"/>
<rect x="710" y="306" width="430" height="90" rx="12" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
<text x="730" y="338" font-size="18" font-weight="600" text-anchor="start" style="fill:#172033">File service and OverlayCore</text>
<text x="730" y="365" font-size="15" font-weight="400" text-anchor="start" style="fill:#172033">Policy, layered views, private writes, baselines</text>
<rect x="710" y="419" width="430" height="76" rx="12" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
<text x="730" y="451" font-size="18" font-weight="600" text-anchor="start" style="fill:#172033">Controlled network egress</text>
<text x="730" y="478" font-size="15" font-weight="400" text-anchor="start" style="fill:#172033">Host smoltcp, access policy, upstream connections</text>
<path d="M 476 355 L 702 355" class="line"/>
<text x="590" y="341" font-size="16" font-weight="600" text-anchor="middle" style="fill:#172033">virtio-fs</text>
<path d="M 476 446 L 702 457" class="line"/>
<text x="590" y="432" font-size="16" font-weight="600" text-anchor="middle" style="fill:#172033">virtio-net</text>
<rect x="30" y="550" width="1140" height="65" rx="12" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
<text x="55" y="578" font-size="19" font-weight="600" text-anchor="start" style="fill:#172033">Virtualization boundary and VMM</text>
<text x="55" y="603" font-size="16" font-weight="400" text-anchor="start" style="fill:#172033">KVM / HVF, virtual devices, and controlled guest RAM access</text>
<rect x="30" y="654" width="550" height="119" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/>
<text x="50" y="686" font-size="18" font-weight="600" text-anchor="start" style="fill:#172033">Memory lifecycle</text>
<text x="50" y="713" font-size="15" font-weight="400" text-anchor="start" style="fill:#172033">Share identical data; compress or offload as supported</text>
<text x="50" y="740" font-size="15" font-weight="400" text-anchor="start" style="fill:#172033">Keep recovery backing; coordinate CPU and devices</text>
<rect x="610" y="654" width="560" height="119" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
<text x="630" y="686" font-size="18" font-weight="600" text-anchor="start" style="fill:#172033">Result acceptance for native Jobs</text>
<text x="630" y="713" font-size="15" font-weight="400" text-anchor="start" style="fill:#172033">Staged files and execution records → review</text>
<text x="630" y="740" font-size="15" font-weight="400" text-anchor="start" style="fill:#172033">Selective apply or discard unaccepted changes</text>
<text x="30" y="817" font-size="16" font-weight="400" text-anchor="start" style="fill:#475569">Mechanisms depend on platform and profile; automatic offload and wake during model waits remain research.</text>
</svg>
