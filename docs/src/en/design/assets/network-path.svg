<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="922" viewBox="0 0 1080 922" role="img" aria-labelledby="title desc"><title id="title">Network egress: recover the target before connecting</title><desc id="desc">Implemented VM IPv4 TCP path; solid: requests; dashed: replies / connection success.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#a8cefa"/></marker><marker id="change" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#e2bd80"/></marker></defs><rect width="1080" height="922" fill="#0d1b30"/><g font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" fill="#e9eef8">
