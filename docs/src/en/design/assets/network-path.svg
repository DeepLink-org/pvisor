<text x="28" y="846" font-size="15">6 Advance the guest handshake only after host connection succeeds; the service sees host egress.</text>
<text x="28" y="885" font-size="15">Model payload capture requires explicit Gateway configuration; the TCP policy gate does not decrypt TLS.</text>
