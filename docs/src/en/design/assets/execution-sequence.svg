<text x="952.0" y="130.0" font-size="17" font-weight="600" text-anchor="middle">Durable records</text>
<path d="M952 148 V690" stroke="#416080" stroke-dasharray="4 4"/>
<polyline points="128,185 405,185" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="210" y="175" font-size="14">RunSpec</text>
<rect x="315" y="205" width="180" height="58" rx="2" fill="#142840" stroke="#6485a8" stroke-width="1.4"/>
<text x="405.0" y="228.0" font-size="17" font-weight="600" text-anchor="middle">Admission</text>
<text x="405.0" y="252.0" font-size="14" text-anchor="middle">effective configuration</text>
<polyline points="405,290 677,290" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="458" y="280" font-size="14">1 Prepare resources</text>
<polyline points="677,325 405,325" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="450" y="348" font-size="14">attachments / controls</text>
<polyline points="405,378 952,378" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="575" y="367" font-size="14">2 Commit required launch facts</text>
<polyline points="952,411 405,411" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="573" y="433" font-size="14">dispatch only after receipt</text>
<polyline points="405,466 677,466" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="510" y="455" font-size="14">3 execute</text>
<polyline points="128,497 405,497" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)" stroke-dasharray="5 4"/>
<text x="143" y="487" font-size="14">cancel (during execution)</text>
