<text x="465" y="558" font-size="14">ExecutorOutput</text>
<polyline points="405,589 677,589" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="455" y="578" font-size="14">4 Cleanup / observations</text>
<polyline points="405,632 952,632" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="560" y="621" font-size="14">5 Persist result; publish terminal state</text>
