<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="700" viewBox="0 0 1080 700" role="img" aria-labelledby="title desc"><title id="title">A full snapshot needs one consistent cut</title><desc id="desc">A normal pause parks vCPUs; a full freeze also reclaims device queues and RAM access.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#a8cefa"/></marker><marker id="change" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#e2bd80"/></marker></defs><rect width="1080" height="700" fill="#0d1b30"/><g font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" fill="#e9eef8">
<text x="28" y="37" font-size="24" font-weight="600">A full snapshot needs one consistent cut</text>
<text x="28" y="67" font-size="15">A normal pause parks vCPUs; a full freeze also reclaims device queues and RAM access.</text>
<rect x="20" y="136" width="1040" height="92" fill="#1a304c"/>
<rect x="20" y="247" width="1040" height="92" fill="#12243b"/>
<rect x="20" y="358" width="1040" height="92" fill="#1a304c"/>
<text x="28" y="185" font-size="16" font-weight="600">vCPU / registers</text>
<text x="28" y="296" font-size="16" font-weight="600">Devices / virtqueues</text>
<text x="28" y="407" font-size="16" font-weight="600">RAM / file state</text>
<text x="365" y="111" font-size="18" font-weight="600" text-anchor="middle">Running</text>
<text x="635" y="111" font-size="18" font-weight="600" text-anchor="middle">Freeze and drain</text>
<text x="905" y="111" font-size="18" font-weight="600" text-anchor="middle">Consistent capture window</text>
<rect x="255" y="143" width="230" height="78" rx="2" fill="#142840" stroke="#6485a8" stroke-width="1.4"/>
<text x="370.0" y="176.0" font-size="17" font-weight="600" text-anchor="middle">execute; mutate</text>
<text x="370.0" y="200.0" font-size="14" text-anchor="middle">registers</text>
<polyline points="485,182 525,182" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="525" y="143" width="230" height="78" rx="2" fill="#142840" stroke="#6485a8" stroke-width="1.4"/>
<text x="640.0" y="176.0" font-size="17" font-weight="600" text-anchor="middle">all CPUs</text>
<text x="640.0" y="200.0" font-size="14" text-anchor="middle">acknowledge park</text>
<polyline points="755,182 795,182" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="795" y="143" width="230" height="78" rx="2" fill="#193d40" stroke="#74b7b0" stroke-width="1.4"/>
<text x="910.0" y="188.0" font-size="17" font-weight="600" text-anchor="middle">capture CPU state</text>
<rect x="255" y="254" width="230" height="78" rx="2" fill="#142840" stroke="#6485a8" stroke-width="1.4"/>
<text x="370.0" y="287.0" font-size="17" font-weight="600" text-anchor="middle">process requests;</text>
<text x="370.0" y="311.0" font-size="14" text-anchor="middle">write RAM</text>
<polyline points="485,293 525,293" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="525" y="254" width="230" height="78" rx="2" fill="#142840" stroke="#6485a8" stroke-width="1.4"/>
<text x="640.0" y="287.0" font-size="17" font-weight="600" text-anchor="middle">workers return queues;</text>
<text x="640.0" y="311.0" font-size="14" text-anchor="middle">drain RAM leases</text>
<polyline points="755,293 795,293" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="795" y="254" width="230" height="78" rx="2" fill="#193d40" stroke="#74b7b0" stroke-width="1.4"/>
<text x="910.0" y="287.0" font-size="17" font-weight="600" text-anchor="middle">capture queue /</text>
<text x="910.0" y="311.0" font-size="14" text-anchor="middle">device state</text>
<rect x="255" y="365" width="230" height="78" rx="2" fill="#142840" stroke="#6485a8" stroke-width="1.4"/>
<text x="370.0" y="398.0" font-size="17" font-weight="600" text-anchor="middle">RAM and files</text>
<text x="370.0" y="422.0" font-size="14" text-anchor="middle">may change</text>
<polyline points="485,404 525,404" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="525" y="365" width="230" height="78" rx="2" fill="#142840" stroke="#6485a8" stroke-width="1.4"/>
<text x="640.0" y="398.0" font-size="17" font-weight="600" text-anchor="middle">close RAM gate;</text>
<text x="640.0" y="422.0" font-size="14" text-anchor="middle">pin file state</text>
<polyline points="755,404 795,404" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="795" y="365" width="230" height="78" rx="2" fill="#193d40" stroke="#74b7b0" stroke-width="1.4"/>
<text x="910.0" y="398.0" font-size="17" font-weight="600" text-anchor="middle">capture RAM +</text>
<text x="910.0" y="422.0" font-size="14" text-anchor="middle">profile files</text>
<rect x="28" y="535" width="475" height="89" rx="2" fill="#193d40" stroke="#74b7b0" stroke-width="1.4"/>
<text x="265.5" y="573.5" font-size="17" font-weight="600" text-anchor="middle">Store owner publishes</text>
<text x="265.5" y="597.5" font-size="14" text-anchor="middle">objects / digests / references → checkpoint</text>
<rect x="556" y="535" width="496" height="89" rx="2" fill="#142840" stroke="#6485a8" stroke-width="1.4"/>
<text x="804.0" y="573.5" font-size="17" font-weight="600" text-anchor="middle">Restore paused; install before release</text>
<text x="804.0" y="597.5" font-size="14" text-anchor="middle">compatibility + RAM + private files + devices</text>
<polyline points="910,443 910,483 266,483 266,535" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<polyline points="503,578 556,578" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="28" y="668" font-size="14">Freeze failure leaves the runner stopped for termination; remote server state lies outside this cut.</text></g></svg>
