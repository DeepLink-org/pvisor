<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="650" viewBox="0 0 1080 650" role="img" aria-labelledby="title desc"><title id="title">Lazy image: from a path to immutable content blocks</title><desc id="desc">Metadata fixes identity and layout; reads fetch ranges, while writes create a private upper.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#a8cefa"/></marker><marker id="change" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#e2bd80"/></marker></defs><rect width="1080" height="650" fill="#0d1b30"/><g font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" fill="#e9eef8">
<text x="28" y="37" font-size="24" font-weight="600">Lazy image: from a path to immutable content blocks</text>
<text x="28" y="67" font-size="15">Metadata fixes identity and layout; reads fetch ranges, while writes create a private upper.</text>
<rect x="20" y="100" width="1040" height="136" fill="#1a304c"/>
<rect x="20" y="290" width="1040" height="138" fill="#12243b"/>
<rect x="20" y="453" width="1040" height="130" fill="#1a304c"/>
<rect x="30" y="124" width="295" height="85" rx="2" fill="#142840" stroke="#6485a8" stroke-width="1.4"/>
<text x="177.5" y="160.5" font-size="17" font-weight="600" text-anchor="middle">Pin the image handle</text>
<text x="177.5" y="184.5" font-size="14" text-anchor="middle">image + platform + revision</text>
<rect x="391" y="124" width="295" height="85" rx="2" fill="#142840" stroke="#6485a8" stroke-width="1.4"/>
<text x="538.5" y="160.5" font-size="17" font-weight="600" text-anchor="middle">Path / inode metadata</text>
<text x="538.5" y="184.5" font-size="14" text-anchor="middle">files + index + attributes</text>
<rect x="752" y="124" width="295" height="85" rx="2" fill="#142840" stroke="#6485a8" stroke-width="1.4"/>
<text x="899.5" y="160.5" font-size="17" font-weight="600" text-anchor="middle">File content index</text>
<text x="899.5" y="184.5" font-size="14" text-anchor="middle">file digest → ordered chunks</text>
<polyline points="325,166 391,166" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<polyline points="686,166 752,166" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="30" y="314" width="295" height="88" rx="2" fill="#142840" stroke="#6485a8" stroke-width="1.4"/>
<text x="177.5" y="352.0" font-size="17" font-weight="600" text-anchor="middle">read(offset, length)</text>
<text x="177.5" y="376.0" font-size="14" text-anchor="middle">find intersecting blocks</text>
<rect x="391" y="314" width="295" height="88" rx="2" fill="#193d40" stroke="#74b7b0" stroke-width="1.4"/>
<text x="538.5" y="352.0" font-size="17" font-weight="600" text-anchor="middle">Fetch + verify</text>
<text x="538.5" y="376.0" font-size="14" text-anchor="middle">cache / local / remote objects</text>
<rect x="752" y="314" width="295" height="88" rx="2" fill="#142840" stroke="#6485a8" stroke-width="1.4"/>
<text x="899.5" y="352.0" font-size="17" font-weight="600" text-anchor="middle">Return requested bytes</text>
<text x="899.5" y="376.0" font-size="14" text-anchor="middle">slice edges; concatenate</text>
<polyline points="900,209 900,256 177,256 177,314" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<polyline points="325,358 391,358" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<polyline points="686,358 752,358" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="30" y="474" width="1017" height="89" rx="2" fill="#443929" stroke="#c9a96e" stroke-width="1.4"/>
<text x="538.5" y="512.5" font-size="17" font-weight="600" text-anchor="middle">Share immutable data across images; do not follow mutable HEAD during a run</text>
<text x="538.5" y="536.5" font-size="14" text-anchor="middle">First in-place edit: materialize → copy-up → private upper; full exports may fetch untouched content</text>
<text x="30" y="610" font-size="15">Names, metadata revisions, file digests and block digests address different objects; failed validation returns an error.</text></g></svg>
