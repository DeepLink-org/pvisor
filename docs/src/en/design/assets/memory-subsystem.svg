<text x="720" y="1139" fill="#c8e0fc" font-size="31" font-weight="700">Host Kernel · Private Mappings / COW / Fault Handling</text>
<text x="720" y="1208" fill="#c8e0fc" font-size="21" font-weight="700">These modes have compatibility limits; KSM advice and whole-VM offload have separate entry points.</text>
