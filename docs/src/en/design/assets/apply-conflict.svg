<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="690" viewBox="0 0 1080 690" role="img" aria-labelledby="title desc"><title id="title">Apply checks the old state before publishing the new</title><desc id="desc">One path can have preimage A, candidate C, and a developer edit D.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#a8cefa"/></marker><marker id="change" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#e2bd80"/></marker></defs><rect width="1080" height="690" fill="#0d1b30"/><g font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" fill="#e9eef8">
<text x="28" y="37" font-size="24" font-weight="600">Apply checks the old state before publishing the new</text>
<text x="28" y="67" font-size="15">One path can have preimage A, candidate C, and a developer edit D.</text>
<rect x="20" y="94" width="1040" height="132" fill="#1a304c"/>
<rect x="20" y="257" width="1040" height="128" fill="#12243b"/>
<rect x="20" y="445" width="1040" height="130" fill="#1a304c"/>
<rect x="30" y="118" width="280" height="83" rx="2" fill="#193d40" stroke="#74b7b0" stroke-width="1.4"/>
<text x="170.0" y="153.5" font-size="17" font-weight="600" text-anchor="middle">First observation / mutation</text>
<text x="170.0" y="177.5" font-size="14" text-anchor="middle">preimage = fingerprint(A)</text>
<rect x="400" y="118" width="280" height="83" rx="2" fill="#443929" stroke="#c9a96e" stroke-width="1.4"/>
<text x="540.0" y="153.5" font-size="17" font-weight="600" text-anchor="middle">Task ends and seals stage</text>
<text x="540.0" y="177.5" font-size="14" text-anchor="middle">upper = C</text>
<rect x="770" y="118" width="280" height="83" rx="2" fill="#142840" stroke="#6485a8" stroke-width="1.4"/>
<text x="910.0" y="153.5" font-size="17" font-weight="600" text-anchor="middle">Recheck at apply</text>
<text x="910.0" y="177.5" font-size="14" text-anchor="middle">current target = ?</text>
<polyline points="310,160 400,160" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<polyline points="680,160 770,160" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="590" y="282" width="210" height="80" rx="2" fill="#193d40" stroke="#74b7b0" stroke-width="1.4"/>
<text x="695.0" y="316.0" font-size="17" font-weight="600" text-anchor="middle">target = A</text>
<text x="695.0" y="340.0" font-size="14" text-anchor="middle">check passes</text>
<rect x="840" y="282" width="210" height="80" rx="2" fill="#452d39" stroke="#d99aa7" stroke-width="1.4"/>
<text x="945.0" y="316.0" font-size="17" font-weight="600" text-anchor="middle">target = D</text>
<text x="945.0" y="340.0" font-size="14" text-anchor="middle">reject; retain C and D</text>
<polyline points="910,201 910,245 695,245 695,282" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<polyline points="910,245 945,245 945,282" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="30" y="465" width="300" height="90" rx="2" fill="#443929" stroke="#c9a96e" stroke-width="1.4"/>
<text x="180.0" y="504.0" font-size="17" font-weight="600" text-anchor="middle">Prepared</text>
<text x="180.0" y="528.0" font-size="14" text-anchor="middle">persist selection / preimages</text>
<polyline points="330,510 390,510" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="390" y="465" width="300" height="90" rx="2" fill="#193d40" stroke="#74b7b0" stroke-width="1.4"/>
<text x="540.0" y="504.0" font-size="17" font-weight="600" text-anchor="middle">TargetApplied</text>
<text x="540.0" y="528.0" font-size="14" text-anchor="middle">target writes complete</text>
<polyline points="690,510 750,510" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="750" y="465" width="300" height="90" rx="2" fill="#193d40" stroke="#74b7b0" stroke-width="1.4"/>
<text x="900.0" y="504.0" font-size="17" font-weight="600" text-anchor="middle">Committed</text>
<text x="900.0" y="528.0" font-size="14" text-anchor="middle">commit after upper pruning</text>
<polyline points="695,362 695,400 180,400 180,465" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="278" y="426" font-size="14">target lock; recover pending batches first</text>
<text x="30" y="606" font-size="15">After interruption, reconcile the ledger and recover forward; multi-file visibility is not atomic.</text>
<text x="30" y="644" font-size="15">The advisory lock coordinates cooperating callers; external editors may still write concurrently.</text></g></svg>
