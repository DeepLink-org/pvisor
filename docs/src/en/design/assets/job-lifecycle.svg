<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">One Job: execute, publish, accept</title><desc id="desc">Stages run left to right; lower layers identify owners and persistent identity.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#a8cefa"/></marker><marker id="change" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#e2bd80"/></marker></defs><rect width="960" height="640" fill="#0d1b30"/><g font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" fill="#e9eef8">
<text x="28" y="37" font-size="24" font-weight="600">One Job: execute, publish, accept</text>
<text x="28" y="67" font-size="15">Stages run left to right; lower layers identify owners and persistent identity.</text>
<rect x="20" y="100" width="920" height="148" fill="#1a304c"/>
<rect x="20" y="283" width="920" height="150" fill="#12243b"/>
<rect x="20" y="471" width="920" height="113" fill="#1a304c"/>
<rect x="36" y="149" width="165" height="79" rx="2" fill="#142840" stroke="#6485a8" stroke-width="1.4"/>
<text x="118.5" y="182.5" font-size="17" font-weight="600" text-anchor="middle">① Admission</text>
<text x="118.5" y="206.5" font-size="14" text-anchor="middle">policy + capability</text>
<polyline points="201,188 216,188" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="216" y="149" width="165" height="79" rx="2" fill="#142840" stroke="#6485a8" stroke-width="1.4"/>
<text x="298.5" y="182.5" font-size="17" font-weight="600" text-anchor="middle">② Prepare</text>
<text x="298.5" y="206.5" font-size="14" text-anchor="middle">stage / network / VM</text>
<polyline points="381,188 396,188" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="396" y="149" width="165" height="79" rx="2" fill="#142840" stroke="#6485a8" stroke-width="1.4"/>
<text x="478.5" y="182.5" font-size="17" font-weight="600" text-anchor="middle">③ Execute</text>
<text x="478.5" y="206.5" font-size="14" text-anchor="middle">Attempt + controls</text>
<polyline points="561,188 576,188" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="576" y="149" width="165" height="79" rx="2" fill="#142840" stroke="#6485a8" stroke-width="1.4"/>
<text x="658.5" y="182.5" font-size="17" font-weight="600" text-anchor="middle">④ Publish</text>
<text x="658.5" y="206.5" font-size="14" text-anchor="middle">result + Job record</text>
<polyline points="741,188 756,188" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="756" y="149" width="165" height="79" rx="2" fill="#193d40" stroke="#74b7b0" stroke-width="1.4"/>
<text x="838.5" y="182.5" font-size="17" font-weight="600" text-anchor="middle">⑤ Accept</text>
<text x="838.5" y="206.5" font-size="14" text-anchor="middle">review → apply/drop</text>
<rect x="36" y="331" width="270" height="81" rx="2" fill="#142840" stroke="#6485a8" stroke-width="1.4"/>
<text x="171.0" y="365.5" font-size="17" font-weight="600" text-anchor="middle">Session</text>
<text x="171.0" y="389.5" font-size="14" text-anchor="middle">resources / cancel / cleanup</text>
<rect x="345" y="331" width="270" height="81" rx="2" fill="#142840" stroke="#6485a8" stroke-width="1.4"/>
<text x="480.0" y="365.5" font-size="17" font-weight="600" text-anchor="middle">ManagedJobRun</text>
<text x="480.0" y="389.5" font-size="14" text-anchor="middle">Attempt join → Server::finish</text>
<rect x="654" y="331" width="270" height="81" rx="2" fill="#142840" stroke="#6485a8" stroke-width="1.4"/>
<text x="789.0" y="365.5" font-size="17" font-weight="600" text-anchor="middle">Developer or verifier</text>
<text x="789.0" y="389.5" font-size="14" text-anchor="middle">select files to publish</text>
<polyline points="118,228 118,331" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<polyline points="658,228 658,264 480,264 480,331" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<polyline points="838,228 838,331" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="44" y="527" font-size="17" font-weight="600">execution resume → retain the Job, create a new Attempt</text>
<text x="44" y="559" font-size="15">execution fork → new Job and branch; applications reconcile external effects</text>
<text x="28" y="619" font-size="15">Completion receipts, cleanup and file acceptance have distinct commit points.</text>
<text x="36" y="123" font-size="14" font-weight="600" stroke="#1a304c" stroke-width="6" stroke-linejoin="round" paint-order="stroke">01  Stages and commit points</text>
<text x="36" y="306" font-size="14" font-weight="600" stroke="#12243b" stroke-width="6" stroke-linejoin="round" paint-order="stroke">02  Respective owners</text>
<text x="36" y="494" font-size="14" font-weight="600" stroke="#1a304c" stroke-width="6" stroke-linejoin="round" paint-order="stroke">03  Persistent identity and branches</text></g></svg>
