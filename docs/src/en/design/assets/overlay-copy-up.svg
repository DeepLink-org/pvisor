<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="680" viewBox="0 0 1080 680" role="img" aria-labelledby="title desc"><title id="title">Copy-up changes the write destination</title><desc id="desc">Example: the first in-place edit of config.toml. A and C denote different contents.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#a8cefa"/></marker><marker id="change" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#e2bd80"/></marker></defs><rect width="1080" height="680" fill="#0d1b30"/><g font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" fill="#e9eef8">
<text x="28" y="37" font-size="24" font-weight="600">Copy-up changes the write destination</text>
<text x="28" y="67" font-size="15">Example: the first in-place edit of config.toml. A and C denote different contents.</text>
<rect x="20" y="136" width="1040" height="112" fill="#12243b"/>
<rect x="20" y="280" width="1040" height="158" fill="#1a304c"/>
<rect x="20" y="465" width="1040" height="110" fill="#12243b"/>
<text x="160" y="119" font-size="19" font-weight="600" text-anchor="middle">① Before write</text>
<text x="521" y="119" font-size="19" font-weight="600" text-anchor="middle">② First write</text>
<text x="882" y="119" font-size="19" font-weight="600" text-anchor="middle">③ After write</text>
<rect x="30" y="155" width="280" height="73" rx="2" fill="#142840" stroke="#6485a8" stroke-width="1.4"/>
<text x="170.0" y="197.5" font-size="17" font-weight="600" text-anchor="middle">upper: no config.toml</text>
<rect x="30" y="340" width="280" height="80" rx="2" fill="#193d40" stroke="#74b7b0" stroke-width="1.4"/>
<text x="170.0" y="374.0" font-size="17" font-weight="600" text-anchor="middle">lower / target</text>
<text x="170.0" y="398.0" font-size="14" text-anchor="middle">config.toml = A</text>
<rect x="30" y="494" width="280" height="65" rx="2" fill="#142840" stroke="#6485a8" stroke-width="1.4"/>
<text x="170.0" y="532.5" font-size="17" font-weight="600" text-anchor="middle">merged view reads A</text>
<polyline points="170,420 170,494" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="182" y="466" font-size="14">fall through</text>
<rect x="391" y="155" width="280" height="85" rx="2" fill="#443929" stroke="#c9a96e" stroke-width="1.4"/>
<text x="531.0" y="191.5" font-size="17" font-weight="600" text-anchor="middle">preimage</text>
<text x="531.0" y="215.5" font-size="14" text-anchor="middle">retain target A fingerprint</text>
<rect x="391" y="300" width="280" height="98" rx="2" fill="#142840" stroke="#6485a8" stroke-width="1.4"/>
<text x="531.0" y="343.0" font-size="17" font-weight="600" text-anchor="middle">Private temporary file</text>
<text x="531.0" y="367.0" font-size="14" text-anchor="middle">copy A + metadata</text>
<rect x="391" y="480" width="280" height="80" rx="2" fill="#142840" stroke="#6485a8" stroke-width="1.4"/>
<text x="531.0" y="514.0" font-size="17" font-weight="600" text-anchor="middle">rename into upper</text>
<text x="531.0" y="538.0" font-size="14" text-anchor="middle">subsequent write yields C</text>
<polyline points="310,380 360,380 360,198 391,198" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="343" y="289" font-size="14">1</text>
<polyline points="531,240 531,300" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="545" y="277" font-size="14">2</text>
<polyline points="531,398 531,480" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="545" y="443" font-size="14">3</text>
<rect x="752" y="155" width="280" height="73" rx="2" fill="#443929" stroke="#c9a96e" stroke-width="1.4"/>
<text x="892.0" y="185.5" font-size="17" font-weight="600" text-anchor="middle">upper</text>
<text x="892.0" y="209.5" font-size="14" text-anchor="middle">config.toml = C</text>
<rect x="752" y="340" width="280" height="80" rx="2" fill="#193d40" stroke="#74b7b0" stroke-width="1.4"/>
<text x="892.0" y="374.0" font-size="17" font-weight="600" text-anchor="middle">lower / target</text>
<text x="892.0" y="398.0" font-size="14" text-anchor="middle">config.toml = A</text>
<rect x="752" y="494" width="280" height="65" rx="2" fill="#142840" stroke="#6485a8" stroke-width="1.4"/>
<text x="892.0" y="532.5" font-size="17" font-weight="600" text-anchor="middle">merged view reads C</text>
<polyline points="671,520 716,520 716,193 752,193" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<polyline points="1032,193 1051,193 1051,527 1032,527" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="831" y="464" font-size="14">upper wins</text>
<text x="30" y="610" font-size="15">Delete a lower file → upper/.wh.name; an opaque marker hides lower directory children.</text>
<text x="30" y="643" font-size="15">Temporary-file rename hides partial copies; stage durability additionally needs synchronization and sealing.</text></g></svg>
