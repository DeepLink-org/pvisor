<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="title desc"><title id="title">Shared pages and private writes: the Linux pool path</title><desc id="desc">Three layers: VMs, private host mappings, physical content. Dashed: A before its write.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#a8cefa"/></marker><marker id="change" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#e2bd80"/></marker></defs><rect width="960" height="720" fill="#0d1b30"/><g font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" fill="#e9eef8">
<text x="28" y="37" font-size="24" font-weight="600">Shared pages and private writes: the Linux pool path</text>
<text x="28" y="67" font-size="15">Three layers: VMs, private host mappings, physical content. Dashed: A before its write.</text>
<rect x="20" y="100" width="920" height="112" fill="#1a304c"/>
<rect x="20" y="258" width="920" height="122" fill="#12243b"/>
<rect x="20" y="448" width="920" height="143" fill="#1a304c"/>
<rect x="132" y="143" width="216" height="52" rx="2" fill="#142840" stroke="#6485a8" stroke-width="1.4"/>
<text x="240.0" y="175.0" font-size="17" font-weight="600" text-anchor="middle">VM A</text>
<rect x="132" y="302" width="216" height="60" rx="2" fill="#142840" stroke="#6485a8" stroke-width="1.4"/>
<text x="240.0" y="326.0" font-size="17" font-weight="600" text-anchor="middle">mapping A</text>
<text x="240.0" y="350.0" font-size="14" text-anchor="middle">MAP_PRIVATE</text>
<polyline points="240,195 240,302" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="612" y="143" width="216" height="52" rx="2" fill="#142840" stroke="#6485a8" stroke-width="1.4"/>
<text x="720.0" y="175.0" font-size="17" font-weight="600" text-anchor="middle">VM B</text>
<rect x="612" y="302" width="216" height="60" rx="2" fill="#142840" stroke="#6485a8" stroke-width="1.4"/>
<text x="720.0" y="326.0" font-size="17" font-weight="600" text-anchor="middle">mapping B</text>
<text x="720.0" y="350.0" font-size="14" text-anchor="middle">MAP_PRIVATE</text>
<polyline points="720,195 720,302" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="112" y="494" width="256" height="76" rx="2" fill="#443929" stroke="#c9a96e" stroke-width="1.4"/>
<text x="240.0" y="526.0" font-size="17" font-weight="600" text-anchor="middle">A private page Y</text>
<text x="240.0" y="550.0" font-size="14" text-anchor="middle">kernel COW; affects only A</text>
<rect x="582" y="494" width="276" height="76" rx="2" fill="#193d40" stroke="#74b7b0" stroke-width="1.4"/>
<text x="720.0" y="526.0" font-size="17" font-weight="600" text-anchor="middle">Pool immutable slot X</text>
<text x="720.0" y="550.0" font-size="14" text-anchor="middle">4 KiB / readonly FD</text>
<polyline points="240,362 240,494" fill="none" stroke="#e2bd80" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#change)"/>
<text x="253" y="423" font-size="14">② After write</text>
<polyline points="348,332 474,332 474,417 666,417 666,494" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)" stroke-dasharray="5 4"/>
<text x="490" y="403" font-size="14">① Shared reads</text>
<polyline points="720,362 720,494" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="734" y="423" font-size="14">B stays shared</text>
<text x="28" y="628" font-size="15">Publish: resident sample → CPU/device quiescence → byte recheck → replace mapping.</text>
<text x="28" y="660" font-size="15">A referenced slot cannot be reused; release its reference after unmapping.</text>
<text x="28" y="692" font-size="15">Disconnected references stay pinned until pidfd confirms peer exit.</text>
<text x="36" y="123" font-size="14" font-weight="600" stroke="#1a304c" stroke-width="6" stroke-linejoin="round" paint-order="stroke">01  Guest processes</text>
<text x="36" y="281" font-size="14" font-weight="600" stroke="#12243b" stroke-width="6" stroke-linejoin="round" paint-order="stroke">02  Private host mappings</text>
<text x="36" y="471" font-size="14" font-weight="600" stroke="#1a304c" stroke-width="6" stroke-linejoin="round" paint-order="stroke">03  Physical content</text></g></svg>
