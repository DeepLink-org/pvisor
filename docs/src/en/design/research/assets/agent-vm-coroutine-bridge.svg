<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 704" width="1120" height="704" role="img" aria-labelledby="title desc" xml:lang="en" style="max-width:100%;height:auto">
<title id="title">From coroutine context to VM execution context</title>
<desc id="desc">Transparent coroutines retain stacks and locals while runtime integration takes over waits. The pVisor target model uses a VM to retain unmodified Agent code, Linux tools and kernel state; virtual-device and protocol adapters hand supported I/O to a host execution engine. The Agent calls no explicit suspend or resume interface.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",sans-serif;fill:#172033} .muted{fill:#526176}</style>
<rect width="1120" height="704" rx="16" fill="white"/>
<text x="32" y="43" font-size="17" font-weight="700" text-anchor="start" style="fill:#2563eb">04 · THE MECHANISM</text>
<text x="32" y="80" font-size="28" font-weight="700" text-anchor="start" style="fill:#172033">Use the VM to hold the Agent’s execution context</text>
<text x="32" y="113" font-size="18" font-weight="400" text-anchor="start" style="fill:#526176">Target model: preserve Agent code and calls; integrate waits across the guest, VMM and host.</text>
<rect x="32" y="139" width="512" height="508" rx="10" fill="#f8fafc" stroke="#dbe3ed"/>
<rect x="576" y="139" width="512" height="508" rx="10" fill="#f8fafc" stroke="#dbe3ed"/>
<text x="52" y="175" font-size="22" font-weight="600" text-anchor="start" style="fill:#172033">Coroutines · manage a program context</text>
<text x="596" y="175" font-size="22" font-weight="600" text-anchor="start" style="fill:#172033">pVisor · manage an execution environment</text>
<rect x="52" y="192" width="472" height="218" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
<rect x="596" y="192" width="472" height="218" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
<text x="70" y="222" font-size="18" font-weight="600" text-anchor="start" style="fill:#2563eb">Application</text>
<text x="614" y="222" font-size="18" font-weight="600" text-anchor="start" style="fill:#2563eb">Inside the VM: existing Agent + Linux tools</text>
<rect x="70" y="237" width="436" height="54" rx="10" fill="white" stroke="#bfdbfe"/>
<rect x="614" y="237" width="436" height="54" rx="10" fill="white" stroke="#bfdbfe"/>
<text x="288" y="272" font-size="23" font-weight="600" text-anchor="middle" style="fill:#2563eb">read() → request() → write()</text>
<text x="832" y="272" font-size="23" font-weight="600" text-anchor="middle" style="fill:#2563eb">read() → request() → write()</text>
<rect x="70" y="308" width="436" height="78" rx="10" fill="white" stroke="#bfdbfe"/>
<rect x="614" y="308" width="436" height="78" rx="10" fill="white" stroke="#bfdbfe"/>
<text x="288" y="339" font-size="21" font-weight="600" text-anchor="middle" style="fill:#2563eb">Retain coroutine context</text>
<text x="288" y="370" font-size="18" font-weight="400" text-anchor="middle" style="fill:#526176">Call stack · local variables</text>
<text x="832" y="339" font-size="21" font-weight="600" text-anchor="middle" style="fill:#2563eb">Retain Linux execution context</text>
<text x="832" y="370" font-size="18" font-weight="400" text-anchor="middle" style="fill:#526176">Processes · memory · kernel state</text>
<text x="560" y="354" font-size="30" font-weight="400" text-anchor="middle" style="fill:#526176">≈</text>
<path d="M288 411 L288 438" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M832 411 L832 438" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="52" y="442" width="472" height="66" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
<rect x="596" y="442" width="472" height="66" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
<text x="288" y="469" font-size="20" font-weight="600" text-anchor="middle" style="fill:#059669">Syscall hooks / library integration</text>
<text x="288" y="495" font-size="17" font-weight="400" text-anchor="middle" style="fill:#526176">Runtime takes over supported blocking I/O</text>
<text x="832" y="469" font-size="20" font-weight="600" text-anchor="middle" style="fill:#059669">Linux I/O → device / protocol adapters</text>
<text x="832" y="495" font-size="17" font-weight="400" text-anchor="middle" style="fill:#526176">pVisor takes ownership of requests and data</text>
<path d="M288 509 L288 540" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M832 509 L832 540" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="52" y="544" width="472" height="80" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
<rect x="596" y="544" width="472" height="80" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
<text x="288" y="576" font-size="22" font-weight="600" text-anchor="middle" style="fill:#059669">Shared event engine</text>
<text x="288" y="606" font-size="17" font-weight="400" text-anchor="middle" style="fill:#526176">Progress I/O · resume the coroutine on events</text>
<text x="832" y="576" font-size="22" font-weight="600" text-anchor="middle" style="fill:#059669">Shared host execution engine</text>
<text x="832" y="606" font-size="17" font-weight="400" text-anchor="middle" style="fill:#526176">Progress I/O · resume the VM on events</text>
<text x="32" y="678" font-size="19" font-weight="400" text-anchor="start" style="fill:#526176">Same shift: sequential application calls; runtime-owned waits, retained context, and resumption in place.</text>
</svg>
