<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 686" width="1120" height="686" role="img" aria-labelledby="title desc" xml:lang="en" style="max-width:100%;height:auto">
<title id="title">Continuous Agent calls, event-driven host scheduling</title>
<desc id="desc">Target model, not a delivered end-to-end capability. Agent A makes an ordinary I/O call. After host ownership handoff and a safe guest-wide wait, pVisor retains context and reclaims offloadable memory. The host advances I/O while reusable execution budget serves B and C. Completion triggers restoration of A and return from the original call. The timeline is schematic, not to scale; restoration does not restart or rerun the task.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",sans-serif;fill:#172033} .muted{fill:#526176}</style>
<rect width="1120" height="686" rx="16" fill="white"/>
<text x="32" y="43" font-size="17" font-weight="700" text-anchor="start" style="fill:#2563eb">05 · TWO VIEWS</text>
<text x="32" y="80" font-size="28" font-weight="700" text-anchor="start" style="fill:#172033">One Agent waits; the host schedules other timelines</text>
<text x="32" y="113" font-size="18" font-weight="400" text-anchor="start" style="fill:#526176">Target model · unchanged application calls, with resources reassigned across compute and waits.</text>
<rect x="32" y="139" width="1056" height="126" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
<text x="52" y="176" font-size="20" font-weight="600" text-anchor="start" style="fill:#2563eb">Agent’s view</text>
<rect x="202" y="154" width="118" height="36" rx="6" fill="#2563eb" stroke="#2563eb"/>
<text x="261.0" y="179" font-size="18" font-weight="500" text-anchor="middle" style="fill:white">Call I/O</text>
<rect x="320" y="154" width="580" height="36" rx="6" fill="#eef2f6" stroke="#dbe3ed"/>
<text x="610.0" y="179" font-size="18" font-weight="500" text-anchor="middle" style="fill:#526176">Wait for the original call to return</text>
<rect x="900" y="154" width="142" height="36" rx="6" fill="#2563eb" stroke="#2563eb"/>
<text x="971.0" y="179" font-size="18" font-weight="500" text-anchor="middle" style="fill:white">Continue</text>
<text x="202" y="232" font-size="18" font-weight="400" text-anchor="start" style="fill:#2563eb">Same Agent, process and call; no application suspend or resume logic.</text>
<rect x="32" y="283" width="1056" height="342" rx="10" fill="#f8fafc" stroke="#dbe3ed"/>
<text x="52" y="312" font-size="20" font-weight="600" text-anchor="start" style="fill:#172033">Host’s view</text>
<text x="52" y="366" font-size="19" font-weight="400" text-anchor="start" style="fill:#172033">VM A</text>
<rect x="202" y="340" width="220" height="36" rx="6" fill="#2563eb" stroke="#2563eb"/>
<text x="312.0" y="365" font-size="18" font-weight="500" text-anchor="middle" style="fill:white">Run / hand off I/O</text>
<rect x="422" y="340" width="378" height="36" rx="6" fill="#eef2f6" stroke="#dbe3ed"/>
<text x="611.0" y="365" font-size="18" font-weight="500" text-anchor="middle" style="fill:#526176">Retain context · reclaim eligible RAM</text>
<rect x="800" y="340" width="100" height="36" rx="6" fill="#2563eb" stroke="#2563eb"/>
<text x="850.0" y="365" font-size="18" font-weight="500" text-anchor="middle" style="fill:white">Restore</text>
<rect x="900" y="340" width="142" height="36" rx="6" fill="#2563eb" stroke="#2563eb"/>
<text x="971.0" y="365" font-size="18" font-weight="500" text-anchor="middle" style="fill:white">Resume</text>
<text x="52" y="466" font-size="19" font-weight="400" text-anchor="start" style="fill:#059669">Host I/O</text>
<rect x="320" y="440" width="102" height="36" rx="6" fill="#059669" stroke="#059669"/>
<text x="371.0" y="465" font-size="18" font-weight="500" text-anchor="middle" style="fill:white">Own</text>
<rect x="422" y="440" width="378" height="36" rx="6" fill="#059669" stroke="#059669"/>
<text x="611.0" y="465" font-size="18" font-weight="500" text-anchor="middle" style="fill:white">Host advances the request</text>
<rect x="800" y="440" width="100" height="36" rx="6" fill="#059669" stroke="#059669"/>
<text x="850.0" y="465" font-size="18" font-weight="500" text-anchor="middle" style="fill:white">Done</text>
<path d="M422 378 L422 436" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="440" y="413" font-size="16" font-weight="400" text-anchor="start" style="fill:#526176">Host owns data; guest RAM is detached</text>
<path d="M800 437 L800 380" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="820" y="413" font-size="16" font-weight="400" text-anchor="start" style="fill:#059669">Done → restore</text>
<path d="M1044 358 H1070 V172 H1045" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="52" y="569" font-size="19" font-weight="400" text-anchor="start" style="fill:#172033">Run budget</text>
<rect x="202" y="543" width="220" height="36" rx="6" fill="#2563eb" stroke="#2563eb"/>
<text x="312.0" y="568" font-size="18" font-weight="500" text-anchor="middle" style="fill:white">A</text>
<rect x="422" y="543" width="180" height="36" rx="6" fill="#059669" stroke="#059669"/>
<text x="512.0" y="568" font-size="18" font-weight="500" text-anchor="middle" style="fill:white">B</text>
<rect x="602" y="543" width="198" height="36" rx="6" fill="#b45309" stroke="#b45309"/>
<text x="701.0" y="568" font-size="18" font-weight="500" text-anchor="middle" style="fill:white">C</text>
<rect x="800" y="543" width="242" height="36" rx="6" fill="#2563eb" stroke="#2563eb"/>
<text x="921.0" y="568" font-size="18" font-weight="500" text-anchor="middle" style="fill:white">A restores and runs</text>
<text x="202" y="605" font-size="18" font-weight="400" text-anchor="start" style="fill:#526176">During A’s wait, reusable execution resources serve other Agents.</text>
<text x="32" y="660" font-size="18" font-weight="400" text-anchor="start" style="fill:#526176">Schematic only: RAM offload requires a safe guest-wide wait and a completed I/O ownership handoff.</text>
</svg>
