<text x="48" y="1304" class="b">GET → scratch 校验 → MAP_PRIVATE | MAP_ANON → 内容复制 → icache 同步 → GPA 映射。</text>
<text x="48" y="1341" class="b">Q 页为 VM 私有可写匿名 backing；HVA h 不变，backing 身份已改变；与原文件无映射线。</text>
<text x="48" y="1375" class="s">另一 VM 恢复相同内容时获得自己的私有映射。全零块不主动写脏，实际驻留页由系统决定。</text>
<text x="48" y="1408" class="s">原文件 FD / offset 仍在 RamBlock 中，用于生命周期与记账，不是恢复数据来源。</text>
<text x="36" y="1491" class="b">文件几何：file_offset = region.file_start + block_offset；GPA = region.guest_start + block_offset。</text>
<text x="36" y="1528" class="s">多个 guest region 在文件中按宿主页对齐紧凑排列；GPA 的间隔不要求在文件中保留同样的洞。</text>
</svg>
