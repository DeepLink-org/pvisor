<rect x="494" y="1162" width="364" height="34" rx="2" fill="#193d40" stroke="#6485a8" stroke-width="1.5"/>
<text x="506" y="1186" class="m">h + 16 KiB → Q1</text>
<rect x="494" y="1200" width="364" height="34" rx="2" fill="#193d40" stroke="#6485a8" stroke-width="1.5"/>
<text x="506" y="1224" class="m">h + 32 KiB → Q2</text>
<rect x="494" y="1238" width="364" height="34" rx="2" fill="#193d40" stroke="#6485a8" stroke-width="1.5"/>
<text x="506" y="1262" class="m">h + 48 KiB → Q3</text>
<rect x="968" y="1124" width="364" height="34" rx="2" fill="url(#holes)" stroke="#6485a8" stroke-width="1.5"/>
<text x="980" y="1148" class="m">f + 0 KiB：hole</text>
<rect x="968" y="1162" width="364" height="34" rx="2" fill="url(#holes)" stroke="#6485a8" stroke-width="1.5"/>
<text x="980" y="1186" class="m">f + 16 KiB：hole</text>
<rect x="968" y="1200" width="364" height="34" rx="2" fill="url(#holes)" stroke="#6485a8" stroke-width="1.5"/>
<text x="980" y="1224" class="m">f + 32 KiB：hole</text>
<rect x="968" y="1238" width="364" height="34" rx="2" fill="url(#holes)" stroke="#6485a8" stroke-width="1.5"/>
