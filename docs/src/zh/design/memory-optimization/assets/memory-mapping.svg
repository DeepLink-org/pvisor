<text x="980" y="288" class="m">f + 16 KiB … 32 KiB</text>
<rect x="968" y="302" width="364" height="34" rx="2" fill="#443929" stroke="#6485a8" stroke-width="1.5"/>
<text x="980" y="326" class="m">f + 32 KiB … 48 KiB</text>
<rect x="968" y="340" width="364" height="34" rx="2" fill="#443929" stroke="#6485a8" stroke-width="1.5"/>
<text x="980" y="364" class="m">f + 48 KiB … 64 KiB</text>
