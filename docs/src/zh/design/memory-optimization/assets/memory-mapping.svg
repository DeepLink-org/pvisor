<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1570" viewBox="0 0 1440 1570" role="img" aria-labelledby="title desc"><title id="title">冷块的 GPA、HVA、宿主页与原 RAM 文件布局</title><desc id="desc">同一64KiB块在驻留、冷态与恢复态的地址映射和文件关系。本机16KiB宿主页，物理页地址未实测，符号页不代表PFN。</desc><defs><style>text{font-family:system-ui,-apple-system,'PingFang SC',sans-serif;fill:#e9eef8}.h{font-size:28px;font-weight:600}.l{font-size:21px;font-weight:600}.b{font-size:18px}.s{font-size:16px;fill:#a8cefa}.m{font-family:ui-monospace,monospace;font-size:17px}</style><pattern id="holes" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 12L12 0" stroke="#416080" stroke-width="2"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#a8cefa" stroke-width="1.4"/></marker></defs><rect width="1440" height="1570" fill="#0d1b30"/>
<text x="36" y="48" class="h">同一个 64 KiB 块：地址映射、宿主页与文件范围</text>
<text x="36" y="80" class="s">g / h / f 分别为块起始 GPA、HVA、file offset。以下展示一个 runner；另一 VM 拥有独立映射。</text>
<text x="36" y="107" class="s">本机宿主页为 16 KiB。P0…P3 / Q0…Q3 是示意页，未查询 PFN；不保证物理连续或始终驻留。</text>
<rect x="24" y="132" width="1392" height="420" fill="#1a304c"/>
<text x="44" y="169" class="l">① Resident：MAP_SHARED 文件映射；文件页缓存由系统管理</text>
<text x="48" y="207" class="l">guest GPA 区间</text>
<text x="494" y="207" class="l">runner HVA / 宿主页</text>
<text x="968" y="207" class="l">原 RAM 文件 · inode A</text>
<rect x="24" y="595" width="1392" height="420" fill="#12243b"/>
<text x="44" y="632" class="l">② Cold：GPA 解映射；HVA 保留范围；原文件回收完成</text>
<text x="48" y="670" class="l">guest GPA 区间</text>
<text x="494" y="670" class="l">runner HVA / 宿主页</text>
<text x="968" y="670" class="l">原 RAM 文件 · inode A</text>
<rect x="24" y="1030" width="1392" height="420" fill="#1a304c"/>
<text x="44" y="1067" class="l">③ Restored：相同 HVA，被私有匿名映射替换；不映回文件</text>
<text x="48" y="1105" class="l">guest GPA 区间</text>
<text x="494" y="1105" class="l">runner HVA / 宿主页</text>
<text x="968" y="1105" class="l">原 RAM 文件 · inode A</text>
<rect x="48" y="226" width="364" height="34" rx="2" fill="#142840" stroke="#6485a8" stroke-width="1.5"/>
<text x="60" y="250" class="m">g + 0 KiB … 16 KiB</text>
<rect x="48" y="264" width="364" height="34" rx="2" fill="#142840" stroke="#6485a8" stroke-width="1.5"/>
<text x="60" y="288" class="m">g + 16 KiB … 32 KiB</text>
<rect x="48" y="302" width="364" height="34" rx="2" fill="#142840" stroke="#6485a8" stroke-width="1.5"/>
