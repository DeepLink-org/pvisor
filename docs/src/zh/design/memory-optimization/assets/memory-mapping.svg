<text x="48" y="406" class="b">HVF stage-2 将 GPA 映射到 h；宿主 VM 再解析文件页。</text>
<text x="48" y="437" class="b">这里的 P 页与右侧文件范围属于同一 backing；不能把 RAM 与页缓存重复计一份。</text>
<text x="48" y="473" class="s">Observing：只将 HVF 权限置为 no-access，host 文件映射与原内容仍在。</text>
<text x="48" y="505" class="s">Publishing：另有 64 KiB snapshot；CPU / 设备访问会取消该快照的回收资格。</text>
<rect x="48" y="689" width="364" height="34" rx="2" fill="url(#holes)" stroke="#6485a8" stroke-width="1.5"/>
<text x="60" y="713" class="m">g + 0 KiB：未映射</text>
<rect x="48" y="727" width="364" height="34" rx="2" fill="url(#holes)" stroke="#6485a8" stroke-width="1.5"/>
<text x="60" y="751" class="m">g + 16 KiB：未映射</text>
<rect x="48" y="765" width="364" height="34" rx="2" fill="url(#holes)" stroke="#6485a8" stroke-width="1.5"/>
<text x="60" y="789" class="m">g + 32 KiB：未映射</text>
<rect x="48" y="803" width="364" height="34" rx="2" fill="url(#holes)" stroke="#6485a8" stroke-width="1.5"/>
<text x="60" y="827" class="m">g + 48 KiB：未映射</text>
<rect x="494" y="689" width="364" height="34" rx="2" fill="url(#holes)" stroke="#6485a8" stroke-width="1.5"/>
<text x="506" y="713" class="m">h + 0 KiB：PROT_NONE</text>
<rect x="494" y="727" width="364" height="34" rx="2" fill="url(#holes)" stroke="#6485a8" stroke-width="1.5"/>
<text x="506" y="751" class="m">h + 16 KiB：PROT_NONE</text>
<rect x="494" y="765" width="364" height="34" rx="2" fill="url(#holes)" stroke="#6485a8" stroke-width="1.5"/>
<text x="506" y="789" class="m">h + 32 KiB：PROT_NONE</text>
<rect x="494" y="803" width="364" height="34" rx="2" fill="url(#holes)" stroke="#6485a8" stroke-width="1.5"/>
<text x="506" y="827" class="m">h + 48 KiB：PROT_NONE</text>
<rect x="968" y="689" width="364" height="34" rx="2" fill="url(#holes)" stroke="#6485a8" stroke-width="1.5"/>
<text x="980" y="713" class="m">f + 0 KiB：hole</text>
<rect x="968" y="727" width="364" height="34" rx="2" fill="url(#holes)" stroke="#6485a8" stroke-width="1.5"/>
<text x="980" y="751" class="m">f + 16 KiB：hole</text>
<rect x="968" y="765" width="364" height="34" rx="2" fill="url(#holes)" stroke="#6485a8" stroke-width="1.5"/>
<text x="980" y="789" class="m">f + 32 KiB：hole</text>
<rect x="968" y="803" width="364" height="34" rx="2" fill="url(#holes)" stroke="#6485a8" stroke-width="1.5"/>
<text x="980" y="827" class="m">f + 48 KiB：hole</text>
<text x="48" y="868" class="b">GPA 不再连接 h；设备也须先 prepare。</text>
<text x="494" y="868" class="b">匿名虚拟范围，不保存原内容。</text>
<text x="968" y="868" class="b">读洞返回零，不是原块内容。</text>
<text x="48" y="911" class="b">Cold(RemoteObject) → session / token → 池内对象；runner 没有池 payload 的 mmap。</text>
<text x="48" y="944" class="s">图示为 punch 完成后的状态。discard 与 punch 之间，原文件数据仍可能占用页缓存 / 磁盘。</text>
<text x="48" y="979" class="s">文件长度 L 不变；st_blocks 随回收变化。洞不存储 token、ID 或压缩数据。</text>
<rect x="48" y="1124" width="364" height="34" rx="2" fill="#142840" stroke="#6485a8" stroke-width="1.5"/>
<text x="60" y="1148" class="m">g + 0 KiB … 16 KiB</text>
<rect x="48" y="1162" width="364" height="34" rx="2" fill="#142840" stroke="#6485a8" stroke-width="1.5"/>
<text x="60" y="1186" class="m">g + 16 KiB … 32 KiB</text>
<rect x="48" y="1200" width="364" height="34" rx="2" fill="#142840" stroke="#6485a8" stroke-width="1.5"/>
<text x="60" y="1224" class="m">g + 32 KiB … 48 KiB</text>
<rect x="48" y="1238" width="364" height="34" rx="2" fill="#142840" stroke="#6485a8" stroke-width="1.5"/>
<text x="60" y="1262" class="m">g + 48 KiB … 64 KiB</text>
