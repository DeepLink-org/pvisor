<text x="506" y="250" class="m">h + 0 KiB → P0</text>
<rect x="494" y="264" width="364" height="34" rx="2" fill="#193d40" stroke="#6485a8" stroke-width="1.5"/>
<text x="506" y="288" class="m">h + 16 KiB → P1</text>
<rect x="494" y="302" width="364" height="34" rx="2" fill="#193d40" stroke="#6485a8" stroke-width="1.5"/>
<text x="506" y="326" class="m">h + 32 KiB → P2</text>
<rect x="494" y="340" width="364" height="34" rx="2" fill="#193d40" stroke="#6485a8" stroke-width="1.5"/>
<text x="506" y="364" class="m">h + 48 KiB → P3</text>
