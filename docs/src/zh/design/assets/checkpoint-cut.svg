<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="700" viewBox="0 0 1080 700" role="img" aria-labelledby="title desc"><title id="title">完整快照需要同一个一致性切面</title><desc id="desc">普通 pause 停止 vCPU；完整冻结还要收回设备队列及 RAM 访问。</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#a8cefa"/></marker><marker id="change" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#e2bd80"/></marker></defs><rect width="1080" height="700" fill="#0d1b30"/><g font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" fill="#e9eef8">
<text x="28" y="37" font-size="24" font-weight="600">完整快照需要同一个一致性切面</text>
<text x="28" y="67" font-size="15">普通 pause 停止 vCPU；完整冻结还要收回设备队列及 RAM 访问。</text>
<rect x="20" y="136" width="1040" height="92" fill="#1a304c"/>
<rect x="20" y="247" width="1040" height="92" fill="#12243b"/>
<rect x="20" y="358" width="1040" height="92" fill="#1a304c"/>
<text x="28" y="185" font-size="16" font-weight="600">vCPU / 寄存器</text>
<text x="28" y="296" font-size="16" font-weight="600">设备 / virtqueue</text>
<text x="28" y="407" font-size="16" font-weight="600">RAM / 文件状态</text>
<text x="365" y="111" font-size="18" font-weight="600" text-anchor="middle">运行中</text>
<text x="635" y="111" font-size="18" font-weight="600" text-anchor="middle">冻结并收敛</text>
<text x="905" y="111" font-size="18" font-weight="600" text-anchor="middle">一致的捕获窗口</text>
<rect x="255" y="143" width="230" height="78" rx="2" fill="#142840" stroke="#6485a8" stroke-width="1.4"/>
<text x="370.0" y="188.0" font-size="17" font-weight="600" text-anchor="middle">执行指令并改寄存器</text>
<polyline points="485,182 525,182" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="525" y="143" width="230" height="78" rx="2" fill="#142840" stroke="#6485a8" stroke-width="1.4"/>
<text x="640.0" y="188.0" font-size="17" font-weight="600" text-anchor="middle">确认全部 CPU 停驻</text>
<polyline points="755,182 795,182" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="795" y="143" width="230" height="78" rx="2" fill="#193d40" stroke="#74b7b0" stroke-width="1.4"/>
<text x="910.0" y="188.0" font-size="17" font-weight="600" text-anchor="middle">捕获 CPU state</text>
<rect x="255" y="254" width="230" height="78" rx="2" fill="#142840" stroke="#6485a8" stroke-width="1.4"/>
<text x="370.0" y="299.0" font-size="17" font-weight="600" text-anchor="middle">处理请求并写 guest RAM</text>
<polyline points="485,293 525,293" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="525" y="254" width="230" height="78" rx="2" fill="#142840" stroke="#6485a8" stroke-width="1.4"/>
<text x="640.0" y="287.0" font-size="17" font-weight="600" text-anchor="middle">worker 交回队列</text>
<text x="640.0" y="311.0" font-size="14" text-anchor="middle">lease 排空</text>
<polyline points="755,293 795,293" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="795" y="254" width="230" height="78" rx="2" fill="#193d40" stroke="#74b7b0" stroke-width="1.4"/>
<text x="910.0" y="299.0" font-size="17" font-weight="600" text-anchor="middle">捕获 queue / device state</text>
<rect x="255" y="365" width="230" height="78" rx="2" fill="#142840" stroke="#6485a8" stroke-width="1.4"/>
<text x="370.0" y="410.0" font-size="17" font-weight="600" text-anchor="middle">内存与文件可能变化</text>
<polyline points="485,404 525,404" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="525" y="365" width="230" height="78" rx="2" fill="#142840" stroke="#6485a8" stroke-width="1.4"/>
<text x="640.0" y="398.0" font-size="17" font-weight="600" text-anchor="middle">关闭 RAM gate</text>
<text x="640.0" y="422.0" font-size="14" text-anchor="middle">固定文件状态</text>
<polyline points="755,404 795,404" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="795" y="365" width="230" height="78" rx="2" fill="#193d40" stroke="#74b7b0" stroke-width="1.4"/>
<text x="910.0" y="410.0" font-size="17" font-weight="600" text-anchor="middle">捕获 RAM + profile 文件树</text>
<rect x="28" y="535" width="475" height="89" rx="2" fill="#193d40" stroke="#74b7b0" stroke-width="1.4"/>
<text x="265.5" y="573.5" font-size="17" font-weight="600" text-anchor="middle">存储所有者负责发布</text>
<text x="265.5" y="597.5" font-size="14" text-anchor="middle">对象 / 摘要 / 引用 → 可发现检查点</text>
<rect x="556" y="535" width="496" height="89" rx="2" fill="#142840" stroke="#6485a8" stroke-width="1.4"/>
<text x="804.0" y="573.5" font-size="17" font-weight="600" text-anchor="middle">恢复先暂停，再安装与放行</text>
<text x="804.0" y="597.5" font-size="14" text-anchor="middle">兼容性 + RAM 拓扑 + 文件副本 + 设备状态</text>
<polyline points="910,443 910,483 266,483 266,535" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<polyline points="503,578 556,578" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="28" y="668" font-size="14">CPU / 设备冻结失败后保留停止推进状态，终止失败 runner；远程服务器状态不在切面内。</text></g></svg>
