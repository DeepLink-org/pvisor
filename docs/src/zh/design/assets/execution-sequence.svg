<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="760" viewBox="0 0 1080 760" role="img" aria-labelledby="title desc"><title id="title">一次执行：谁在何时拥有结果</title><desc id="desc">自上向下表示时间；箭头表示调用或回执。虚线是取消请求。</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#a8cefa"/></marker><marker id="change" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#e2bd80"/></marker></defs><rect width="1080" height="760" fill="#0d1b30"/><g font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" fill="#e9eef8">
<text x="28" y="37" font-size="24" font-weight="600">一次执行：谁在何时拥有结果</text>
<text x="28" y="67" font-size="15">自上向下表示时间；箭头表示调用或回执。虚线是取消请求。</text>
