<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1280" viewBox="0 0 1440 1280" role="img" aria-labelledby="title desc">
<title id="title">内存子系统 · 映射、共享与回收</title><desc id="desc">上层访问共用 RAM 映射；下方是按 profile 选择的三条机制路径</desc>
<rect width="1440" height="1280" fill="#0d1b30"/>
<g font-family="Arial,Helvetica,PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">
<text x="720" y="59" fill="#c8e0fc" font-size="39" font-weight="700">内存子系统 · 映射、共享与回收</text>
<text x="720" y="98" fill="#b7c6db" font-size="21" font-weight="500">上层访问共用 RAM 映射；下方是按 profile 选择的三条机制路径</text>
<rect x="30" y="126" width="1380" height="125" rx="38" fill="#244569" stroke="#416080" stroke-width="7"/>
<text x="720" y="173" fill="#c8e0fc" font-size="31" font-weight="700">RAM 的两个访问方</text>
<rect x="54" y="187" width="650" height="45" rx="20" fill="#142840" stroke="#416080" stroke-width="7"/>
<text x="379.0" y="218.5" fill="#e9eef8" font-size="26" font-weight="700">vCPU · GVA → GPA</text>
<rect x="726" y="187" width="660" height="45" rx="20" fill="#142840" stroke="#416080" stroke-width="7"/>
<text x="1056.0" y="218.5" fill="#e9eef8" font-size="26" font-weight="700">virtio worker · descriptor GPA</text>
<path d="M720 258 v18 m-10 -8 l10 10 10 -10" stroke="#a8cefa" stroke-width="4" fill="none"/>
<rect x="30" y="292" width="1380" height="220" rx="38" fill="#102138" stroke="#416080" stroke-width="7"/>
<text x="720" y="339" fill="#c8e0fc" font-size="31" font-weight="700">pvisor-vm · RAM ownership</text>
<rect x="54" y="354" width="1332" height="65" rx="20" fill="#142840" stroke="#416080" stroke-width="7"/>
<text x="720.0" y="382.5" fill="#e9eef8" font-size="27" font-weight="700">GuestMemoryMmap · GPA regions ↔ HVA</text>
<text x="720.0" y="411.5" fill="#e9eef8" font-size="20" font-weight="500">平台注册映射；设备借用期间保持 backing 有效</text>
<rect x="54" y="436" width="1332" height="51" rx="20" fill="#142840" stroke="#416080" stroke-width="7"/>
<text x="720.0" y="470.5" fill="#e9eef8" font-size="25" font-weight="700">映射变更窗口：停驻 vCPU → 排空设备访问 → 复核 live bytes</text>
<path d="M269 519 v18 m-10 -8 l10 10 10 -10" stroke="#a8cefa" stroke-width="4" fill="none"/>
<path d="M720 519 v18 m-10 -8 l10 10 10 -10" stroke="#a8cefa" stroke-width="4" fill="none"/>
<path d="M1171 519 v18 m-10 -8 l10 10 10 -10" stroke="#a8cefa" stroke-width="4" fill="none"/>
<rect x="54" y="553" width="430" height="341" rx="28" fill="#2e4c70" stroke="#416080" stroke-width="7"/>
<text x="269" y="599" fill="#e9eef8" font-size="28" font-weight="700">基线私有 COW</text>
<text x="269" y="634" fill="#e9eef8" font-size="21" font-weight="500">snapshot restore</text>
<rect x="68" y="655" width="402" height="62" rx="20" fill="#142840" stroke="#416080" stroke-width="7"/>
<text x="269.0" y="695.0" fill="#e9eef8" font-size="24" font-weight="700">已校验的 RAM backing</text>
<rect x="68" y="733" width="402" height="53" rx="20" fill="#142840" stroke="#416080" stroke-width="7"/>
<text x="269.0" y="768.5" fill="#e9eef8" font-size="27" font-weight="700">MAP_PRIVATE</text>
<rect x="68" y="802" width="402" height="64" rx="20" fill="#142840" stroke="#416080" stroke-width="7"/>
<text x="269.0" y="843.0" fill="#e9eef8" font-size="22" font-weight="700">写入 → 私有物理页</text>
<rect x="505" y="553" width="430" height="341" rx="28" fill="#284867" stroke="#416080" stroke-width="7"/>
<text x="720" y="599" fill="#e9eef8" font-size="28" font-weight="700">Linux 物理共享</text>
<text x="720" y="634" fill="#e9eef8" font-size="21" font-weight="500">运行中重复的 4 KiB 页</text>
<rect x="519" y="655" width="402" height="62" rx="20" fill="#142840" stroke="#416080" stroke-width="7"/>
<text x="720.0" y="695.0" fill="#e9eef8" font-size="24" font-weight="700">固定 pool 槽位并复核</text>
<rect x="519" y="733" width="402" height="53" rx="20" fill="#142840" stroke="#416080" stroke-width="7"/>
<text x="720.0" y="768.5" fill="#e9eef8" font-size="27" font-weight="700">MAP_PRIVATE</text>
<rect x="519" y="802" width="402" height="64" rx="20" fill="#142840" stroke="#416080" stroke-width="7"/>
<text x="720.0" y="843.0" fill="#e9eef8" font-size="22" font-weight="700">替换映射后释放旧引用</text>
<rect x="956" y="553" width="430" height="341" rx="28" fill="#264956" stroke="#416080" stroke-width="7"/>
<text x="1171" y="599" fill="#e9eef8" font-size="28" font-weight="700">Linux 实例内压缩</text>
<text x="1171" y="634" fill="#e9eef8" font-size="21" font-weight="500">64 KiB 块 · 实验模式</text>
<rect x="970" y="655" width="402" height="62" rx="20" fill="#142840" stroke="#416080" stroke-width="7"/>
<text x="1171.0" y="695.0" fill="#e9eef8" font-size="24" font-weight="700">捕获 → 编码 → 复核</text>
<rect x="970" y="733" width="402" height="53" rx="20" fill="#142840" stroke="#416080" stroke-width="7"/>
<text x="1171.0" y="768.5" fill="#e9eef8" font-size="27" font-weight="700">discard / userfaultfd</text>
<rect x="970" y="802" width="402" height="64" rx="20" fill="#142840" stroke="#416080" stroke-width="7"/>
<text x="1171.0" y="843.0" fill="#e9eef8" font-size="22" font-weight="700">decode → check → UFFD_COPY</text>
<rect x="30" y="920" width="1380" height="146" rx="38" fill="#223852" stroke="#416080" stroke-width="7"/>
<text x="720" y="967" fill="#c8e0fc" font-size="31" font-weight="700">宿主 backing 与存储所有者</text>
<rect x="54" y="986" width="430" height="58" rx="20" fill="#142840" stroke="#416080" stroke-width="7"/>
<text x="269.0" y="1024.0" fill="#e9eef8" font-size="25" font-weight="700">SnapshotStore · leases</text>
<rect x="505" y="986" width="430" height="58" rx="20" fill="#142840" stroke="#416080" stroke-width="7"/>
<text x="720.0" y="1024.0" fill="#e9eef8" font-size="24" font-weight="700">Physical pool · pinned slots</text>
<rect x="956" y="986" width="430" height="58" rx="20" fill="#142840" stroke="#416080" stroke-width="7"/>
<text x="1171.0" y="1024.0" fill="#e9eef8" font-size="26" font-weight="700">LocalColdRamStore</text>
<rect x="30" y="1092" width="1380" height="78" rx="38" fill="#1c3c45" stroke="#416080" stroke-width="7"/>
<text x="720" y="1139" fill="#c8e0fc" font-size="31" font-weight="700">宿主内核 · 私有映射 / COW / 缺页处理</text>
<text x="720" y="1208" fill="#c8e0fc" font-size="21" font-weight="700">这些模式有组合限制；KSM advice 与整 VM offload 有各自入口。</text>
<text x="720" y="1244" fill="#c8e0fc" font-size="21" font-weight="700">释放原页之前必须已有恢复来源；共享池存活不等于持久快照。</text>
</g></svg>
