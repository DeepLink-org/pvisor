<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="650" viewBox="0 0 1080 650" role="img" aria-labelledby="title desc"><title id="title">Lazy image：从路径到不可变内容块</title><desc id="desc">元数据决定身份与布局；读请求只取所需范围，首次写入另建 upper。</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#a8cefa"/></marker><marker id="change" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#e2bd80"/></marker></defs><rect width="1080" height="650" fill="#0d1b30"/><g font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" fill="#e9eef8">
<text x="28" y="37" font-size="24" font-weight="600">Lazy image：从路径到不可变内容块</text>
<text x="28" y="67" font-size="15">元数据决定身份与布局；读请求只取所需范围，首次写入另建 upper。</text>
<rect x="20" y="100" width="1040" height="136" fill="#1a304c"/>
<rect x="20" y="290" width="1040" height="138" fill="#12243b"/>
<rect x="20" y="453" width="1040" height="130" fill="#1a304c"/>
<rect x="30" y="124" width="295" height="85" rx="2" fill="#142840" stroke="#6485a8" stroke-width="1.4"/>
<text x="177.5" y="160.5" font-size="17" font-weight="600" text-anchor="middle">启动时固定镜像句柄</text>
<text x="177.5" y="184.5" font-size="14" text-anchor="middle">image + platform + revision</text>
<rect x="391" y="124" width="295" height="85" rx="2" fill="#142840" stroke="#6485a8" stroke-width="1.4"/>
<text x="538.5" y="160.5" font-size="17" font-weight="600" text-anchor="middle">路径 / inode 元数据</text>
<text x="538.5" y="184.5" font-size="14" text-anchor="middle">files + index + attributes</text>
<rect x="752" y="124" width="295" height="85" rx="2" fill="#142840" stroke="#6485a8" stroke-width="1.4"/>
<text x="899.5" y="160.5" font-size="17" font-weight="600" text-anchor="middle">文件内容索引</text>
<text x="899.5" y="184.5" font-size="14" text-anchor="middle">file digest → ordered chunks</text>
<polyline points="325,166 391,166" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<polyline points="686,166 752,166" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="30" y="314" width="295" height="88" rx="2" fill="#142840" stroke="#6485a8" stroke-width="1.4"/>
<text x="177.5" y="352.0" font-size="17" font-weight="600" text-anchor="middle">read(offset, length)</text>
<text x="177.5" y="376.0" font-size="14" text-anchor="middle">计算覆盖请求的块</text>
<rect x="391" y="314" width="295" height="88" rx="2" fill="#193d40" stroke="#74b7b0" stroke-width="1.4"/>
<text x="538.5" y="352.0" font-size="17" font-weight="600" text-anchor="middle">按需获取 + 校验</text>
<text x="538.5" y="376.0" font-size="14" text-anchor="middle">缓存 / 本地对象 / 远程对象</text>
<rect x="752" y="314" width="295" height="88" rx="2" fill="#142840" stroke="#6485a8" stroke-width="1.4"/>
<text x="899.5" y="352.0" font-size="17" font-weight="600" text-anchor="middle">返回所需字节</text>
<text x="899.5" y="376.0" font-size="14" text-anchor="middle">截取首尾，按顺序拼接</text>
<polyline points="900,209 900,256 177,256 177,314" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<polyline points="325,358 391,358" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<polyline points="686,358 752,358" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="30" y="474" width="1017" height="89" rx="2" fill="#443929" stroke="#c9a96e" stroke-width="1.4"/>
<text x="538.5" y="512.5" font-size="17" font-weight="600" text-anchor="middle">跨镜像共享 data 对象；运行中不追随可变 HEAD</text>
<text x="538.5" y="536.5" font-size="14" text-anchor="middle">普通首次修改：补齐原文件 → copy-up → 私有 upper；完整导出可能下载未访问内容</text>
<text x="30" y="610" font-size="15">名称、元数据版本、文件内容摘要与数据块摘要分别寻址；校验失败返回错误。</text></g></svg>
