<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2300" viewBox="0 0 1600 2300" role="img" aria-labelledby="title desc">
<title id="title">pVisor 技术架构</title><desc id="desc">以 pvisor-vm 为中心的技术分层图。上层是执行入口、Session 与宿主文件网络存储服务。VM 部分展开 Guest、统一 API、vCPU 与事件循环、RAM 映射及可选内存模式、virtio 设备、冻结与快照恢复、KVM 与 HVF 适配。Host 和 OCI 是另外的执行路径。共享契约、Gateway 与 Replay 只作页脚说明。</desc>
