<text x="800" y="2246" font-size="19" font-weight="500" fill="#b7c6db">* Linux 物理共享与 UFFD 冷页按模式选择，均与当前完整快照路径互斥；能力依平台与配置。</text>
<text x="800" y="2277" font-size="19" font-weight="500" fill="#b7c6db">支撑契约：pvisor-core　｜　可选能力：Gateway / Replay　｜　Daemon 仅开放 VM sandbox 生命周期</text>
