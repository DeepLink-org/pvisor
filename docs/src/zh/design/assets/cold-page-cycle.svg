<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="705" viewBox="0 0 1080 705" role="img" aria-labelledby="title desc"><title id="title">冷内存：先保留恢复来源，再丢弃驻留页</title><desc id="desc">Linux 实例内 userfaultfd 压缩；与 daemon 的 raw-page 共享分开。</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#a8cefa"/></marker><marker id="change" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#e2bd80"/></marker></defs><rect width="1080" height="705" fill="#0d1b30"/><g font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" fill="#e9eef8">
<text x="28" y="37" font-size="24" font-weight="600">冷内存：先保留恢复来源，再丢弃驻留页</text>
<text x="28" y="67" font-size="15">Linux 实例内 userfaultfd 压缩；与 daemon 的 raw-page 共享分开。</text>
<rect x="20" y="108" width="1040" height="134" fill="#1a304c"/>
<rect x="20" y="300" width="1040" height="124" fill="#12243b"/>
<rect x="20" y="477" width="1040" height="132" fill="#1a304c"/>
<rect x="30" y="132" width="295" height="93" rx="2" fill="#142840" stroke="#6485a8" stroke-width="1.4"/>
<text x="177.5" y="172.5" font-size="17" font-weight="600" text-anchor="middle">① 短暂静止窗口</text>
<text x="177.5" y="196.5" font-size="14" text-anchor="middle">复制候选 RAM 字节</text>
<rect x="391" y="132" width="295" height="93" rx="2" fill="#142840" stroke="#6485a8" stroke-width="1.4"/>
<text x="538.5" y="172.5" font-size="17" font-weight="600" text-anchor="middle">② 恢复 guest 执行</text>
<text x="538.5" y="196.5" font-size="14" text-anchor="middle">窗口外编码并发布对象</text>
<rect x="752" y="132" width="295" height="93" rx="2" fill="#142840" stroke="#6485a8" stroke-width="1.4"/>
<text x="899.5" y="172.5" font-size="17" font-weight="600" text-anchor="middle">③ 再次静止并复核</text>
<text x="899.5" y="196.5" font-size="14" text-anchor="middle">live bytes == 候选副本？</text>
<polyline points="325,178 391,178" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<polyline points="686,178 752,178" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="752" y="318" width="295" height="86" rx="2" fill="#443929" stroke="#c9a96e" stroke-width="1.4"/>
<text x="899.5" y="355.0" font-size="17" font-weight="600" text-anchor="middle">未变化：discard</text>
<text x="899.5" y="379.0" font-size="14" text-anchor="middle">保留冷对象的引用</text>
<polyline points="900,225 900,318" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="913" y="285" font-size="14">未变化</text>
<rect x="391" y="254" width="295" height="40" rx="2" fill="#142840" stroke="#6485a8" stroke-width="1.4"/>
<text x="538.5" y="280.0" font-size="17" font-weight="600" text-anchor="middle">变化：保留原页</text>
<polyline points="900,239 714,239 714,274 686,274" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="391" y="318" width="295" height="86" rx="2" fill="#142840" stroke="#6485a8" stroke-width="1.4"/>
<text x="538.5" y="355.0" font-size="17" font-weight="600" text-anchor="middle">下一次访问触发缺页</text>
<text x="538.5" y="379.0" font-size="14" text-anchor="middle">userfaultfd 阻塞访问方</text>
<polyline points="752,360 686,360" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="30" y="318" width="295" height="86" rx="2" fill="#193d40" stroke="#74b7b0" stroke-width="1.4"/>
<text x="177.5" y="355.0" font-size="17" font-weight="600" text-anchor="middle">解码与完整性校验</text>
<text x="177.5" y="379.0" font-size="14" text-anchor="middle">长度 + checksum</text>
<polyline points="391,360 325,360" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="30" y="498" width="1017" height="92" rx="2" fill="#193d40" stroke="#74b7b0" stroke-width="1.4"/>
<text x="538.5" y="538.0" font-size="17" font-weight="600" text-anchor="middle">UFFD_COPY</text>
<text x="538.5" y="562.0" font-size="14" text-anchor="middle">确认完整字节恢复 → 唤醒访问 → 释放冷引用</text>
<polyline points="177,404 177,498" fill="none" stroke="#a8cefa" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="30" y="636" font-size="15">两次屏障保护内容一致性；字节未变化仍可能被频繁读取，不等于真正“冷”。</text>
<text x="30" y="674" font-size="15">收益需要扣除编码 CPU、暂存内存和缺页延迟；恢复失败终止 runner。</text></g></svg>
