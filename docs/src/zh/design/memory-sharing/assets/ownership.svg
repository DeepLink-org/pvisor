<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="920" viewBox="0 0 1280 920" role="img" aria-labelledby="title desc">
<title id="title">跨 VM 压缩态去重：内容所有权与映射</title>
<desc id="desc">两个 VM 先各持一份相同的 64 KiB 内容；冷态时各有独立连接引用，共同指向池中的一个不可变编码对象；恢复后各自拥有私有可写匿名页。原文件冷块范围打洞，池不提供持久化。</desc>
<defs>
<style>text{font-family:system-ui,-apple-system,'PingFang SC',sans-serif;fill:#172d44}.heading{font-size:28px;font-weight:700}.sub{font-size:16px;fill:#53677a}.label{font-size:20px;font-weight:650}.body{font-size:17px}.mono{font-family:ui-monospace,monospace;font-size:16px}.small{font-size:15px;fill:#53677a}.panel{fill:#fff;stroke:#cad5df;stroke-width:1.5}.private{fill:#eaf1ff;stroke:#6490cf;stroke-width:1.5}.pool{fill:#e4f4ed;stroke:#439373;stroke-width:1.5}</style>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#439373" stroke-width="1.5"/></marker>
</defs>
<rect width="1280" height="920" rx="18" fill="#f5f8fa"/>
<text x="42" y="54" class="heading">共享的是冷块内容；恢复后的写入属于各自 VM</text>
<text x="42" y="84" class="sub">以两份相同的 64 KiB 块为例。对象编码长度取决于内容；图中不表示物理页节省比例。</text>
<rect x="32" y="111" width="1216" height="204" rx="12" class="panel"/>
<text x="54" y="147" class="label">① 驻留态：两个 VM 各持一份 RAM</text>
<rect x="62" y="169" width="526" height="117" rx="8" class="private"/>
<text x="82" y="199" class="label">VM A · runner A</text>
<text x="82" y="229" class="mono">GPA A → host A → 64 KiB 内容 X</text>
<text x="82" y="260" class="small">初始文件映射，或上次恢复的私有匿名页</text>
<rect x="692" y="169" width="526" height="117" rx="8" class="private"/>
<text x="712" y="199" class="label">VM B · runner B</text>
<text x="712" y="229" class="mono">GPA B → host B → 64 KiB 内容 X</text>
<text x="712" y="260" class="small">内容相同仍可有两份驻留映射；没有热页合并</text>
<rect x="32" y="331" width="1216" height="300" rx="12" class="panel"/>
<text x="54" y="367" class="label">② 冷态：两个连接引用，一个不可变对象</text>
<rect x="62" y="389" width="344" height="176" rx="8" class="private"/>
<text x="82" y="421" class="label">runner A</text>
<text x="82" y="455" class="mono">Cold(session A, token A)</text>
<text x="82" y="488" class="body">host A：匿名 PROT_NONE</text>
<text x="82" y="519" class="body">GPA A：无 HVF 映射</text>
<text x="82" y="548" class="small">保留地址范围；访问必须先恢复</text>
<rect x="462" y="389" width="356" height="176" rx="8" class="pool"/>
<text x="482" y="421" class="label">共享池进程 · 一个对象</text>
<text x="482" y="455" class="mono">ID = SHA-256(域 / 长度 / X)</text>
<text x="482" y="488" class="body">decoded length：64 KiB</text>
<text x="482" y="519" class="body">Payload：Fill / Zstd / Raw</text>
<text x="482" y="548" class="small">Arc 共享；没有 GPA，也没有磁盘文件</text>
<rect x="874" y="389" width="344" height="176" rx="8" class="private"/>
<text x="894" y="421" class="label">runner B</text>
<text x="894" y="455" class="mono">Cold(session B, token B)</text>
<text x="894" y="488" class="body">host B：匿名 PROT_NONE</text>
<text x="894" y="519" class="body">GPA B：无 HVF 映射</text>
<text x="894" y="548" class="small">token 分别释放；断线只释放本连接</text>
<path d="M408 475H457" stroke="#439373" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M872 475H823" stroke="#439373" stroke-width="2" marker-end="url(#arrow)"/>
<text x="62" y="600" class="body">原 RAM 文件：冷块范围异步打洞，长度不变。打洞完成后，池引用是该冷块唯一保存来源。</text>
<rect x="32" y="647" width="1216" height="204" rx="12" class="panel"/>
<text x="54" y="683" class="label">③ 恢复态：GET 校验后分别建立私有可写页</text>
<rect x="62" y="705" width="526" height="117" rx="8" class="private"/>
<text x="82" y="735" class="label">VM A · 私有匿名 RAM</text>
<text x="82" y="765" class="mono">GPA A → host A → X，可写为 X′</text>
<text x="82" y="796" class="small">映射发布后 RELEASE token A；不修改池中对象</text>
<rect x="692" y="705" width="526" height="117" rx="8" class="private"/>
<text x="712" y="735" class="label">VM B · 私有匿名 RAM</text>
<text x="712" y="765" class="mono">GPA B → host B → X，保持独立</text>
<text x="712" y="796" class="small">最后外部引用释放后，对象可从池索引删除</text>
<text x="42" y="887" class="sub">可用性边界：池失效会停止依赖它的 VM。当前没有持久 checkpoint、池重启恢复或共享解压热页缓存。</text>
</svg>
