<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1960" viewBox="0 0 1600 1960" role="img" aria-labelledby="title"><title id="title">02 · &lt;ImageId&gt;.pvdelta 的内部布局</title><desc>文件字节布局，offset、length 和编码均明确标注。可变段的绘图高度不按实际字节数缩放。</desc><style>text{font-family:"PingFang SC",sans-serif;fill:#203246;font-size:20px}.title{font-size:34px;font-weight:700}.head{font-size:24px;font-weight:600}.mono{font-family:Menlo,monospace;font-size:19px}.small{font-size:17px;fill:#526477}</style><rect width="1600" height="1960" fill="#fff"/>
<text x="55" y="60" class="title">02 · &lt;ImageId&gt;.pvdelta 的内部布局</text>
<text x="55" y="100" class="">base / delta 使用同一格式。P=frames 总长度；F=frame 数；J=metadata JSON 长度；I=P+17+8F。</text>
<text x="55" y="153" class="mono">FILE OFFSET</text>
<text x="270" y="153" class="mono">FILE BYTES</text>
<text x="1150" y="153" class="mono">LENGTH</text>
<text x="55" y="205" class="mono">0</text>
<rect x="270" y="175" width="850" height="145" fill="#eaf6ef" stroke="#9bafc4"/>
<text x="292" y="207" class="head">Zstd frame payload</text>
<text x="292" y="237" class="">frame 0 | frame 1 | … | frame F−1</text>
<text x="292" y="265" class="">每个 frame 解码为一个逻辑块；通常 65536 B</text>
<text x="292" y="293" class="">fill entry 没有 frame；frame 数可以少于 entry 数</text>
<text x="1150" y="205" class="mono">P B</text>
<text x="55" y="350" class="mono">P</text>
<rect x="270" y="320" width="850" height="160" fill="#edf3fc" stroke="#9bafc4"/>
<text x="292" y="352" class="head">Zstd Seekable table</text>
<text x="292" y="382" class="">记录每个 frame 的 stored / decoded 长度</text>
<text x="292" y="410" class="">seek checksum flag = 0</text>
<text x="292" y="438" class="">其自身布局在下方展开</text>
<text x="1150" y="350" class="mono">17 + 8F B</text>
<text x="55" y="510" class="mono">I</text>
<rect x="270" y="480" width="850" height="200" fill="#fff3e5" stroke="#9bafc4"/>
<text x="292" y="512" class="head">Metadata · UTF-8 JSON index</text>
<text x="292" y="542" class="">version / block_bytes / parent / layout / entries</text>
<text x="292" y="570" class="">ImageId = SHA-256(metadata 原始 JSON 字节)</text>
<text x="292" y="598" class="">base: parent=null，entries 覆盖全部逻辑块</text>
<text x="292" y="626" class="">delta: parent=[32 bytes]，entries 仅保存变化块</text>
<text x="1150" y="510" class="mono">J B</text>
<text x="55" y="710" class="mono">I + J</text>
<rect x="270" y="680" width="850" height="100" fill="#f1edfa" stroke="#9bafc4"/>
<text x="292" y="712" class="head">PVSNAP2 footer</text>
<text x="292" y="742" class="">reader 从 EOF−64 读取；字段布局见下方</text>
<text x="1150" y="710" class="mono">64 B</text>
<text x="55" y="815" class="mono">EOF = P + 17 + 8F + J + 64</text>
<text x="55" y="878" class="head">放大 Seekable table · 相对 offset，以文件 offset P 为原点</text>
<rect x="55" y="905" width="1490" height="44" fill="#f7f9fc" stroke="#9bafc4"/>
<text x="75" y="934" class="mono">0</text>
<text x="325" y="934" class="mono">4 B</text>
<text x="465" y="934" class="mono">magic = 0x184d2a5e</text>
<rect x="55" y="949" width="1490" height="44" fill="#fff" stroke="#9bafc4"/>
<text x="75" y="978" class="mono">4</text>
<text x="325" y="978" class="mono">4 B</text>
<text x="465" y="978" class="mono">table body length = 9 + 8F</text>
<rect x="55" y="993" width="1490" height="44" fill="#f7f9fc" stroke="#9bafc4"/>
<text x="75" y="1022" class="mono">8 + 8j</text>
<text x="325" y="1022" class="mono">4 B</text>
<text x="465" y="1022" class="mono">frame[j].stored_bytes  · u32 LE</text>
<rect x="55" y="1037" width="1490" height="44" fill="#fff" stroke="#9bafc4"/>
<text x="75" y="1066" class="mono">12 + 8j</text>
<text x="325" y="1066" class="mono">4 B</text>
<text x="465" y="1066" class="mono">frame[j].decoded_bytes · u32 LE</text>
<rect x="55" y="1081" width="1490" height="44" fill="#f7f9fc" stroke="#9bafc4"/>
<text x="75" y="1110" class="mono">8 + 8F</text>
<text x="325" y="1110" class="mono">4 B</text>
<text x="465" y="1110" class="mono">frame_count = F        · u32 LE</text>
<rect x="55" y="1125" width="1490" height="44" fill="#fff" stroke="#9bafc4"/>
<text x="75" y="1154" class="mono">12 + 8F</text>
<text x="325" y="1154" class="mono">1 B</text>
<text x="465" y="1154" class="mono">flags = 0</text>
<rect x="55" y="1169" width="1490" height="44" fill="#f7f9fc" stroke="#9bafc4"/>
<text x="75" y="1198" class="mono">13 + 8F</text>
<text x="325" y="1198" class="mono">4 B</text>
<text x="465" y="1198" class="mono">seek footer magic = 0x8f92eab1</text>
<text x="55" y="1250" class="small">j∈[0,F)；两个 size 字段形成一个 8 B entry；所有整数为 little-endian。</text>
<text x="55" y="1310" class="head">放大 footer · 64 B，以下横向宽度按字节数比例绘制</text>
<rect x="160" y="1355" width="160.0" height="95" fill="#f1edfa" stroke="#9bafc4"/>
<text x="170" y="1391" class="">magic</text>
<text x="170" y="1425" class="mono">8 B</text>
<text x="160" y="1343" class="mono">0</text>
<rect x="320.0" y="1355" width="160.0" height="95" fill="#edf3fc" stroke="#9bafc4"/>
<text x="330.0" y="1391" class="">I u64 LE</text>
<text x="330.0" y="1425" class="mono">8 B</text>
<text x="320.0" y="1343" class="mono">8</text>
<rect x="480.0" y="1355" width="160.0" height="95" fill="#fff3e5" stroke="#9bafc4"/>
<text x="490.0" y="1391" class="">J u64 LE</text>
<text x="490.0" y="1425" class="mono">8 B</text>
<text x="480.0" y="1343" class="mono">16</text>
<rect x="640.0" y="1355" width="160.0" height="95" fill="#edf3fc" stroke="#9bafc4"/>
<text x="650.0" y="1391" class="">seek len</text>
<text x="650.0" y="1425" class="mono">8 B</text>
<text x="640.0" y="1343" class="mono">24</text>
<rect x="800.0" y="1355" width="640.0" height="95" fill="#eaf6ef" stroke="#9bafc4"/>
<text x="810.0" y="1391" class="">ImageId = SHA-256(metadata)</text>
<text x="810.0" y="1425" class="mono">32 B</text>
<text x="800.0" y="1343" class="mono">32</text>
<text x="1425.0" y="1343" class="mono">64</text>
<text x="160" y="1488" class="mono">magic = PVSNAP2\0；seek len = 17 + 8F；64 位 offset / length 均为 LE。</text>
<text x="55" y="1560" class="head">Metadata 的 entry 结构 · JSON 中的 ID / checksum 是整数数组，不是 hex string</text>
<rect x="55" y="1590" width="1490" height="190" fill="#fff3e5" stroke="#9bafc4"/>
<text x="78" y="1630" class="mono">entries: [</text>
<text x="78" y="1666" class="mono">  { block: 353, frame: 0, fill: null, checksum: [32 个 u8] },</text>
<text x="78" y="1702" class="mono">  { block: 354, frame: null, fill: 0, checksum: [32 个 u8] }</text>
<text x="78" y="1738" class="mono">]  // 第一项读取 payload frame 0；第二项直接合成整块零，无 payload frame</text>
<text x="55" y="1830" class="">已有 base：P=21797445，F=1360，J=677657 ⇒ 文件大小 22486063 B。</text>
<text x="55" y="1870" class="">已有 delta：P=1901198，F=209，J=34911 ⇒ 文件大小 1937862 B。</text>
<text x="55" y="1910" class="small">capture .tmp 文件逐段写成上述格式；footer 未完成、未发布前不能当作 committed generation。</text>
</svg>