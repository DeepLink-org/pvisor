<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1450" viewBox="0 0 1600 1450" role="img" aria-labelledby="title"><title id="title">01 · vm.ram / manifest 的内部布局</title><desc>文件字节布局，offset、length 和编码均明确标注。可变段的绘图高度不按实际字节数缩放。</desc><style>text{font-family:"PingFang SC",sans-serif;fill:#203246;font-size:20px}.title{font-size:34px;font-weight:700}.head{font-size:24px;font-weight:600}.mono{font-family:Menlo,monospace;font-size:19px}.small{font-size:17px;fill:#526477}</style><rect width="1600" height="1450" fill="#fff"/>
<text x="55" y="60" class="title">01 · vm.ram / manifest 的内部布局</text>
<text x="55" y="100" class="">PVZRAM v2；物理文件长度 = 44 + N + 80k B。左侧为文件 offset，右侧为段长度。</text>
<text x="55" y="153" class="mono">FILE OFFSET</text>
<text x="270" y="153" class="mono">FILE BYTES</text>
<text x="1150" y="153" class="mono">LENGTH</text>
<text x="55" y="208" class="mono">0</text>
<rect x="270" y="178" width="850" height="50" fill="#edf3fc" stroke="#9bafc4"/>
<text x="292" y="210" class="head">magic = PVZRAM\0\0</text>
<text x="1150" y="208" class="mono">8 B</text>
<text x="55" y="258" class="mono">8</text>
<rect x="270" y="228" width="850" height="50" fill="#edf3fc" stroke="#9bafc4"/>
<text x="292" y="260" class="head">N = descriptor byte length · u32 LE</text>
<text x="1150" y="258" class="mono">4 B</text>
<text x="55" y="308" class="mono">12</text>
<rect x="270" y="278" width="850" height="185" fill="#eaf6ef" stroke="#9bafc4"/>
<text x="292" y="310" class="head">Descriptor · UTF-8 JSON</text>
<text x="292" y="340" class="mono">{&quot;version&quot;:2,&quot;directory&quot;:&quot;/data/vm.ram.layers&quot;}</text>
<text x="292" y="368" class="">version: 固定 2；directory: 宿主绝对路径</text>
<text x="292" y="396" class="">紧凑原字节；N ≤ 8192；此处不存 RAM 数据</text>
<text x="1150" y="308" class="mono">N B</text>
<text x="55" y="493" class="mono">12 + N</text>
<rect x="270" y="463" width="850" height="90" fill="#edf3fc" stroke="#9bafc4"/>
<text x="292" y="495" class="head">descriptor_checksum</text>
<text x="292" y="525" class="">SHA-256(descriptor 原始 N 字节)</text>
<text x="1150" y="493" class="mono">32 B</text>
<text x="55" y="583" class="mono">44 + N</text>
<rect x="270" y="553" width="850" height="80" fill="#fff3e5" stroke="#9bafc4"/>
<text x="292" y="585" class="head">head record [0]</text>
<text x="292" y="615" class="">第一个已提交 generation 的 ID</text>
<text x="1150" y="583" class="mono">80 B</text>
<text x="55" y="663" class="mono">124 + N</text>
<rect x="270" y="633" width="850" height="80" fill="#fff3e5" stroke="#9bafc4"/>
<text x="292" y="665" class="head">head record [1]</text>
<text x="292" y="695" class="">后续 generation；不代表历史文件一定仍保留</text>
<text x="1150" y="663" class="mono">80 B</text>
<text x="55" y="743" class="mono">204 + N</text>
<rect x="270" y="713" width="850" height="70" fill="#fff3e5" stroke="#9bafc4"/>
<text x="292" y="745" class="head">head records [2 … k−1]（若 k ≥ 3）</text>
<text x="1150" y="743" class="mono">80 × (k−2) B</text>
<text x="55" y="819" class="mono">EOF = 44 + N + 80k</text>
<text x="650" y="819" class="small">k=0 时到 descriptor checksum 即结束</text>
<text x="55" y="878" class="head">放大一条 head record · 80 B，以下横向宽度按字节数比例绘制</text>
<rect x="160" y="928" width="128.0" height="95" fill="#fff3e5" stroke="#9bafc4"/>
<text x="170" y="964" class="">magic</text>
<text x="170" y="998" class="mono">8 B</text>
<text x="160" y="916" class="mono">0</text>
<rect x="288.0" y="928" width="128.0" height="95" fill="#edf3fc" stroke="#9bafc4"/>
<text x="298.0" y="964" class="">L u64 LE</text>
<text x="298.0" y="998" class="mono">8 B</text>
<text x="288.0" y="916" class="mono">8</text>
<rect x="416.0" y="928" width="512.0" height="95" fill="#eaf6ef" stroke="#9bafc4"/>
<text x="426.0" y="964" class="">head ImageId</text>
<text x="426.0" y="998" class="mono">32 B</text>
<text x="416.0" y="916" class="mono">16</text>
<rect x="928.0" y="928" width="512.0" height="95" fill="#f1edfa" stroke="#9bafc4"/>
<text x="938.0" y="964" class="">SHA-256(record[0:48])</text>
<text x="938.0" y="998" class="mono">32 B</text>
<text x="928.0" y="916" class="mono">48</text>
<text x="1425.0" y="916" class="mono">80</text>
<text x="160" y="1060" class="mono">magic = PVHEAD2\0；L = logical RAM bytes；ID / checksum 均为原始 32 B。</text>
<text x="55" y="1130" class="head">头部前 12 字节 · 每格 1 B，数字为十六进制 byte</text>
<rect x="160" y="1160" width="90" height="68" fill="#eaf6ef" stroke="#9bafc4"/>
<text x="182" y="1202" class="mono">50</text>
<text x="188" y="1150" class="small">0</text>
<rect x="250" y="1160" width="90" height="68" fill="#eaf6ef" stroke="#9bafc4"/>
<text x="272" y="1202" class="mono">56</text>
<text x="278" y="1150" class="small">1</text>
<rect x="340" y="1160" width="90" height="68" fill="#eaf6ef" stroke="#9bafc4"/>
<text x="362" y="1202" class="mono">5a</text>
<text x="368" y="1150" class="small">2</text>
<rect x="430" y="1160" width="90" height="68" fill="#eaf6ef" stroke="#9bafc4"/>
<text x="452" y="1202" class="mono">52</text>
<text x="458" y="1150" class="small">3</text>
<rect x="520" y="1160" width="90" height="68" fill="#eaf6ef" stroke="#9bafc4"/>
<text x="542" y="1202" class="mono">41</text>
<text x="548" y="1150" class="small">4</text>
<rect x="610" y="1160" width="90" height="68" fill="#eaf6ef" stroke="#9bafc4"/>
<text x="632" y="1202" class="mono">4d</text>
<text x="638" y="1150" class="small">5</text>
<rect x="700" y="1160" width="90" height="68" fill="#eaf6ef" stroke="#9bafc4"/>
<text x="722" y="1202" class="mono">00</text>
<text x="728" y="1150" class="small">6</text>
<rect x="790" y="1160" width="90" height="68" fill="#eaf6ef" stroke="#9bafc4"/>
<text x="812" y="1202" class="mono">00</text>
<text x="818" y="1150" class="small">7</text>
<rect x="880" y="1160" width="90" height="68" fill="#edf3fc" stroke="#9bafc4"/>
<text x="902" y="1202" class="mono">N0</text>
<text x="908" y="1150" class="small">8</text>
<rect x="970" y="1160" width="90" height="68" fill="#edf3fc" stroke="#9bafc4"/>
<text x="992" y="1202" class="mono">N1</text>
<text x="998" y="1150" class="small">9</text>
<rect x="1060" y="1160" width="90" height="68" fill="#edf3fc" stroke="#9bafc4"/>
<text x="1082" y="1202" class="mono">N2</text>
<text x="1088" y="1150" class="small">10</text>
<rect x="1150" y="1160" width="90" height="68" fill="#edf3fc" stroke="#9bafc4"/>
<text x="1172" y="1202" class="mono">N3</text>
<text x="1178" y="1150" class="small">11</text>
<text x="160" y="1270" class="mono">N = N0 + 256×N1 + 65536×N2 + 16777216×N3（little-endian）</text>
<text x="55" y="1340" class="">已有样本：N=155、k=10 ⇒ descriptor 结束于 167，head 起点 199，EOF=999 B。</text>
<text x="55" y="1380" class="small">绘图高度不代表可变段实际大小；只有明确标注的固定记录横条按比例绘制。</text>
</svg>