<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180" role="img" aria-labelledby="title desc"><title id="title">pVisor offload 文件布局与引用关系</title><desc id="desc">普通 RAM 文件与压缩 manifest、FUSE 逻辑文件、staging、generation 和 pin 的关系；发布路径是硬链接而非复制。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b" /></marker></defs>
<style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#172d45} .small{font-size:18px} .body{font-size:20px} .head{font-size:24px;font-weight:600} .title{font-size:36px;font-weight:700}</style>
<rect width="1600" height="1180" fill="#f5f7fb" />
<text x="45" y="62" class="title">pVisor · offload 文件布局与关系</text>
<text x="45" y="98" class="body">实线：文件 / 数据依赖   虚线：目录项别名或可选能力   路径名称为示例</text>
<rect x="40" y="125" width="1520" height="235" rx="14" fill="#eaf1ff" stroke="#d7e0eb" />
<text x="62" y="162" class="head">A  普通模式 · 一个物理 inode，多个路径名</text>
<rect x="65" y="185" width="390" height="145" rx="14" fill="#fff" stroke="#d7e0eb" />
<text x="85" y="219" class="head">VM runner / GuestMemoryMmap</text>
<text x="85" y="253" class="body">RAM FD → MAP_SHARED</text>
<text x="85" y="282" class="body">各 RAM region 使用紧凑文件 offset</text>
<rect x="605" y="185" width="380" height="145" rx="14" fill="#fff" stroke="#d7e0eb" />
<text x="625" y="219" class="head">/data/vm.ram  · 0600</text>
<text x="625" y="253" class="body">物理 RAM 字节，inode A；大小 L</text>
<text x="625" y="282" class="body">RamBacking.file = storage</text>
<rect x="1135" y="185" width="390" height="145" rx="14" fill="#fff" stroke="#d7e0eb" />
<text x="1155" y="219" class="head">/exports/idle.ram  · 可选</text>
<text x="1155" y="253" class="body">hard_link → 同一个 inode A</text>
<text x="1155" y="282" class="body">不复制、不重映射，限同文件系统</text>
<polyline points="455,257 605,257" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
<polyline points="1135,257 985,257" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 6" />
<rect x="40" y="385" width="1520" height="670" rx="14" fill="#eef8f5" stroke="#d7e0eb" />
<text x="62" y="423" class="head">B  压缩模式 · VM 访问逻辑 RAM，磁盘持有 manifest 与 generation</text>
<rect x="65" y="450" width="390" height="160" rx="14" fill="#fff" stroke="#d7e0eb" />
<text x="85" y="484" class="head">VM runner / GuestMemoryMmap</text>
<text x="85" y="518" class="body">RAM FD → mount-*/ram</text>
<text x="85" y="547" class="body">逻辑大小 = file-backed RAM</text>
<text x="85" y="576" class="body">内核缓存负责 mmap 与缺页</text>
<rect x="605" y="450" width="420" height="160" rx="14" fill="#fff" stroke="#d7e0eb" />
<text x="625" y="484" class="head">cache/pvisor/ram/mount-*/ram</text>
<text x="625" y="518" class="body">FUSE 虚拟文件 · 0600</text>
<text x="625" y="547" class="body">RamBacking.file：逻辑 FD</text>
<text x="625" y="576" class="body">mount 目录临时、0700</text>
<rect x="1135" y="450" width="390" height="160" rx="14" fill="#fff" stroke="#d7e0eb" />
<text x="1155" y="484" class="head">RamFs → CompressedRam</text>
<text x="1155" y="518" class="body">write：4 KiB staging 页</text>
<text x="1155" y="547" class="body">read：staging 覆盖已提交 chain</text>
<text x="1155" y="576" class="body">fsync：仅 flush，不发布 head</text>
<polyline points="455,530 605,530" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
<polyline points="1025,530 1135,530" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
<rect x="65" y="700" width="430" height="155" rx="14" fill="#fff" stroke="#d7e0eb" />
<text x="85" y="734" class="head">/data/vm.ram  · manifest</text>
<text x="85" y="768" class="body">storage：物理 FD；44 + N + 80k B</text>
<text x="85" y="797" class="body">绝对 layers 路径 + 追加 head 记录</text>
<text x="85" y="826" class="body">发布新路径仍只 hard_link manifest</text>
<rect x="65" y="890" width="430" height="115" rx="14" fill="#fff" stroke="#d7e0eb" />
<text x="85" y="924" class="head">/exports/idle.ram  · 可选别名</text>
<text x="85" y="958" class="body">仍引用原 layers 目录，不搬动 sidecar</text>
<polyline points="280,890 280,855" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 6" />
<rect x="605" y="700" width="450" height="305" rx="14" fill="#fff" stroke="#d7e0eb" />
<text x="625" y="734" class="head">/data/vm.ram.layers/  · 0700</text>
<text x="625" y="768" class="body">.tmp*：staging，0..L B，稀疏文件</text>
<text x="625" y="797" class="body">&lt;base-id&gt;.pvdelta：完整 base</text>
<text x="625" y="826" class="body">&lt;delta-id&gt;.pvdelta：变化块 + parent</text>
<text x="625" y="855" class="body">&lt;head-id&gt;.pvpin：0 B，可选保留根</text>
<text x="625" y="884" class="body">.pvdelta 大小：P + 17 + 8F + J + 64 B</text>
<text x="625" y="913" class="body">目录不等于全部历史都可保留</text>
<rect x="1135" y="700" width="390" height="155" rx="14" fill="#fff" stroke="#d7e0eb" />
<text x="1155" y="734" class="head">generation 依赖链</text>
<text x="1155" y="768" class="body">head D2 → D1 → Base</text>
<text x="1155" y="797" class="body">新块覆盖旧块，其余继承</text>
<text x="1155" y="826" class="body">GC：保留 current + pins 的祖先</text>
<rect x="1135" y="890" width="390" height="115" rx="14" fill="#fff" stroke="#d7e0eb" />
<text x="1155" y="924" class="head">临时 backing 的特殊布局</text>
<text x="1155" y="958" class="body">manifest、layers-* 均在 cache</text>
<text x="1155" y="987" class="body">发布后 layers 原地保留</text>
<polyline points="495,777 605,777" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
<text x="502" y="758" class="small">绝对路径</text>
<polyline points="1135,777 1055,777" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
<polyline points="1330,610 1330,650 830,650 830,700" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
<text x="850" y="640" class="small">读写 / commit</text>
<rect x="40" y="1080" width="1520" height="70" rx="14" fill="#fff2e5" stroke="#d7e0eb" />
<text x="62" y="1110" class="body">退出后：FUSE mount 与 staging 清理；显式 / 已发布文件保留。持久 RAM 文件不包含完整 CPU / 设备状态。</text>
<text x="62" y="1139" class="small">L=逻辑 RAM 长度；N=descriptor 字节数；k=head 数；P=payload 字节数；F=frame 数；J=metadata JSON 字节数。</text>
</svg>