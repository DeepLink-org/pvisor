<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1570" width="1600" height="1570" role="img" aria-labelledby="title desc"><title id="title">pVisor offload 生命周期与文件交互</title><desc id="desc">按启动、运行、暂停、发布、设备静默、回收、generation 提交、恢复、退出展示 CPU、文件与状态变化。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs>
<style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#172d45} .small{font-size:18px} .body{font-size:20px} .head{font-size:24px;font-weight:600} .title{font-size:36px;font-weight:700}</style>
<rect width="1600" height="1570" fill="#f5f7fb"/>
<text x="45" y="62" class="title">pVisor · 生命周期与 offload 文件互动</text>
<text x="45" y="99" class="body">阅读顺序：从上到下。蓝色：控制 / CPU；绿色：文件 / 存储；橙色：时序边界与失败副作用。</text>
<rect x="40" y="125" width="270" height="55" rx="14" fill="#dce8f6" stroke="#d7e0eb"/>
<text x="58" y="160" class="head">时刻 / 对外状态</text>
<rect x="330" y="125" width="565" height="55" rx="14" fill="#dce8f6" stroke="#d7e0eb"/>
<text x="348" y="160" class="head">CPU、设备与控制</text>
<rect x="915" y="125" width="645" height="55" rx="14" fill="#dce8f6" stroke="#d7e0eb"/>
<text x="933" y="160" class="head">文件与磁盘</text>
<rect x="40" y="200" width="270" height="110" rx="14" fill="#fff" stroke="#d7e0eb"/>
<text x="58" y="235" class="head">01 启动</text>
<text x="58" y="272" class="body">Running 前</text>
<rect x="330" y="200" width="565" height="110" rx="14" fill="#eaf1ff" stroke="#d7e0eb"/>
<text x="350" y="237" class="body">创建 backing，复制 RAM FD 给 runner</text>
<text x="350" y="277" class="body">按主机页对齐 set_len / MAP_SHARED</text>
<rect x="915" y="200" width="645" height="110" rx="14" fill="#eef8f5" stroke="#d7e0eb"/>
<text x="935" y="237" class="body">普通：新 RAM 文件 / 临时文件</text>
<text x="935" y="277" class="body">压缩：manifest、layers、staging、FUSE mount</text>
<polyline points="175,310 175,326" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="326" width="270" height="110" rx="14" fill="#fff" stroke="#d7e0eb"/>
<text x="58" y="361" class="head">02 运行</text>
<text x="58" y="398" class="body">Running</text>
<rect x="330" y="326" width="565" height="110" rx="14" fill="#eaf1ff" stroke="#d7e0eb"/>
<text x="350" y="363" class="body">vCPU / virtio 访问 MAP_SHARED RAM</text>
<text x="350" y="403" class="body">压缩写入先经过内核脏页缓存</text>
<rect x="915" y="326" width="645" height="110" rx="14" fill="#eef8f5" stroke="#d7e0eb"/>
<text x="935" y="363" class="body">普通：脏页属于同一 RAM inode</text>
<text x="935" y="403" class="body">压缩：FUSE write 落 staging，dirty mask 记页</text>
<polyline points="175,436 175,452" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="452" width="270" height="110" rx="14" fill="#fff" stroke="#d7e0eb"/>
<text x="58" y="487" class="head">03 普通暂停</text>
<text x="58" y="524" class="body">Paused</text>
<rect x="330" y="452" width="565" height="110" rx="14" fill="#eaf1ff" stroke="#d7e0eb"/>
<text x="350" y="489" class="body">停止 vCPU；设备 gate 不因此关闭</text>
<text x="350" y="529" class="body">resume 可恢复；pause 不提交 generation</text>
<rect x="915" y="452" width="645" height="110" rx="14" fill="#eef8f5" stroke="#d7e0eb"/>
<text x="935" y="489" class="body">backing、staging、head 不因 pause 改变</text>
<text x="935" y="529" class="body">仅 pause 不是一致的 RAM 提交点</text>
<polyline points="175,562 175,578" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="578" width="270" height="110" rx="14" fill="#fff" stroke="#d7e0eb"/>
<text x="58" y="613" class="head">04 offload 选路径</text>
<text x="58" y="650" class="body">仍在转换中</text>
<rect x="330" y="578" width="565" height="110" rx="14" fill="#eaf1ff" stroke="#d7e0eb"/>
<text x="350" y="615" class="body">host 先 select_path，再发送控制请求</text>
<text x="350" y="655" class="body">有 file 参数才尝试发布新路径</text>
<rect x="915" y="578" width="645" height="110" rx="14" fill="#eef8f5" stroke="#d7e0eb"/>
<text x="935" y="615" class="body">hard_link → 仍同 inode；不覆盖 / 不跨 FS</text>
<text x="935" y="655" class="body">临时压缩 layers 立即 keep，原地持久化</text>
<polyline points="175,688 175,704" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="704" width="270" height="110" rx="14" fill="#fff" stroke="#d7e0eb"/>
<text x="58" y="739" class="head">05 静默与回收</text>
<text x="58" y="776" class="body">尚未完成 offload</text>
<rect x="330" y="704" width="565" height="110" rx="14" fill="#eaf1ff" stroke="#d7e0eb"/>
<text x="350" y="741" class="body">runner：pause CPU → close / drain gate</text>
<text x="350" y="781" class="body">macOS：HVF unmap；再 msync / madvise</text>
<rect x="915" y="704" width="645" height="110" rx="14" fill="#eef8f5" stroke="#d7e0eb"/>
<text x="935" y="741" class="body">普通：同步 RAM 文件，请求回收驻留页</text>
<text x="935" y="781" class="body">压缩：逻辑 FUSE RAM 写回到 staging</text>
<polyline points="175,814 175,830" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="830" width="270" height="110" rx="14" fill="#fff" stroke="#d7e0eb"/>
<text x="58" y="865" class="head">06 host 提交</text>
<text x="58" y="902" class="body">ack 后仍有工作</text>
<rect x="330" y="830" width="565" height="110" rx="14" fill="#eaf1ff" stroke="#d7e0eb"/>
<text x="350" y="867" class="body">runner 发 Offloaded reply / residency</text>
<text x="350" y="907" class="body">host 等 blocking finish_offload 完成</text>
<rect x="915" y="830" width="645" height="110" rx="14" fill="#eef8f5" stroke="#d7e0eb"/>
<text x="935" y="867" class="body">逻辑 FD sync_all → store.sync_all</text>
<text x="935" y="907" class="body">发布 generation → fsync head → staging 清空 → GC</text>
<polyline points="175,940 175,956" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="956" width="270" height="110" rx="14" fill="#fff" stroke="#d7e0eb"/>
<text x="58" y="991" class="head">07 返回成功</text>
<text x="58" y="1028" class="body">Offloaded</text>
<rect x="330" y="956" width="565" height="110" rx="14" fill="#eaf1ff" stroke="#d7e0eb"/>
<text x="350" y="993" class="body">校验状态 / memory；覆盖 backing 路径</text>
<text x="350" y="1033" class="body">CPU 暂停、gate 关闭；VMM 仍存活</text>
<rect x="915" y="956" width="645" height="110" rx="14" fill="#eef8f5" stroke="#d7e0eb"/>
<text x="935" y="993" class="body">普通：同一个 backing 继续作为恢复来源</text>
<text x="935" y="1033" class="body">压缩：current head + 必需 ancestors 可读</text>
<polyline points="175,1066 175,1082" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="1082" width="270" height="110" rx="14" fill="#fff" stroke="#d7e0eb"/>
<text x="58" y="1117" class="head">08 恢复与再运行</text>
<text x="58" y="1154" class="body">Running</text>
<rect x="330" y="1082" width="565" height="110" rx="14" fill="#eaf1ff" stroke="#d7e0eb"/>
<text x="350" y="1119" class="body">macOS HVF remap → gate open → CPU resume</text>
<text x="350" y="1159" class="body">缺页由内核 / FUSE 读取，按需加载</text>
<rect x="915" y="1082" width="645" height="110" rx="14" fill="#eef8f5" stroke="#d7e0eb"/>
<text x="935" y="1119" class="body">普通读同 inode；压缩读当前 chain</text>
<text x="935" y="1159" class="body">新写入进入 staging；下一轮形成 delta / base</text>
<polyline points="175,1192 175,1208" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="1208" width="270" height="110" rx="14" fill="#fff" stroke="#d7e0eb"/>
<text x="58" y="1243" class="head">09 退出 / 取消</text>
<text x="58" y="1280" class="body">attempt 结束</text>
<rect x="330" y="1208" width="565" height="110" rx="14" fill="#eaf1ff" stroke="#d7e0eb"/>
<text x="350" y="1245" class="body">wait child / terminate → detach control</text>
<text x="350" y="1285" class="body">释放 FD、unmount、临时 owner drop</text>
<rect x="915" y="1208" width="645" height="110" rx="14" fill="#eef8f5" stroke="#d7e0eb"/>
<text x="935" y="1245" class="body">未发布临时文件删除；显式 / 别名保留</text>
<text x="935" y="1285" class="body">mount / staging 清理；持久 layers 不自动删</text>
<rect x="40" y="1350" width="1520" height="170" rx="14" fill="#fff2e5" stroke="#d7e0eb"/>
<text x="62" y="1388" class="head">必须读懂的三个边界</text>
<text x="62" y="1421" class="body">① 路径发布早于 CPU 静默：后续 offload 失败，新的 RAM 硬链接仍可能留下（VMR-03 已复现）。</text>
<text x="62" y="1454" class="body">② Offloaded 后调用 pause 当前会报告 Paused，但 gate / HVF 仍保持 offload 条件（VMR-02）。</text>
<text x="62" y="1487" class="body">③ 300 秒控制超时不停止 blocking commit；取消与卸载 / 删除之间的完成义务仍需收敛（VMR-05）。</text>
</svg>