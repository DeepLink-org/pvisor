<text x="972.0" y="879" font-size="18" font-weight="500" text-anchor="middle" style="fill:white">C</text>
<text x="32" y="960" font-size="18" font-weight="400" text-anchor="start" style="fill:#526176">两图调度原理相通：直接使用事件模型，应用拆状态；使用协程，运行时保存与恢复上下文。</text>
<text x="32" y="989" font-size="17" font-weight="400" text-anchor="start" style="fill:#526176">单个工作线程仅作示意，可扩展到多个；透明性限于已适配的 I/O，并非任意多线程程序自动迁移。</text>
</svg>
