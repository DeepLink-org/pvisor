<rect x="482" y="709" width="140" height="36" rx="6" fill="#b45309" stroke="#b45309"/>
<text x="552.0" y="734" font-size="18" font-weight="500" text-anchor="middle" style="fill:white">C</text>
<rect x="622" y="709" width="280" height="36" rx="6" fill="#eef2f6" stroke="#dbe3ed"/>
<text x="762.0" y="734" font-size="18" font-weight="500" text-anchor="middle" style="fill:#526176">I/O 等待 · 挂起</text>
