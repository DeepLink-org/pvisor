<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850" role="img" aria-labelledby="title desc" xml:lang="zh" style="max-width:100%;height:auto">
<title id="title">pVisor 如何连接 Linux 执行与宿主服务</title>
<desc id="desc">Agent 与工具在 guest Linux 内执行。大部分系统调用在 guest 内完成，导出文件树通过 virtio-fs 进入宿主文件服务，网络通过 virtio-net 进入受控出口。宿主另外管理有条件启用的内存共享和回收，以及原生 Job 的暂存与结果接纳。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/></marker></defs>
<style>text{font-family:"Noto Sans","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}.line{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="1200" height="850" fill="#fff"/>
<text x="30" y="43" font-size="27" font-weight="700" text-anchor="start" style="fill:#172033">pVisor 如何连接 Linux 执行与宿主服务</text>
<text x="30" y="78" font-size="17" font-weight="400" text-anchor="start" style="fill:#475569">保留 Linux 程序兼容性，在文件、网络和生命周期边界组织控制与资源。</text>
<rect x="30" y="108" width="480" height="408" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="680" y="108" width="490" height="408" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="55" y="147" font-size="22" font-weight="700" text-anchor="start" style="fill:#1d4ed8">Guest 执行环境</text>
<text x="705" y="147" font-size="22" font-weight="700" text-anchor="start" style="fill:#047857">宿主服务</text>
<rect x="65" y="181" width="410" height="90" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
<text x="85" y="213" font-size="18" font-weight="600" text-anchor="start" style="fill:#172033">Agent CLI、shell 与开发工具</text>
<text x="85" y="240" font-size="15" font-weight="400" text-anchor="start" style="fill:#172033">独立用户态进程与各自的地址空间</text>
<rect x="65" y="326" width="410" height="153" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
<text x="85" y="358" font-size="18" font-weight="600" text-anchor="start" style="fill:#172033">裁剪与定制的 Linux guest kernel</text>
<text x="85" y="385" font-size="15" font-weight="400" text-anchor="start" style="fill:#172033">系统调用、进程管理、缓存与 TCP/IP</text>
<text x="85" y="412" font-size="15" font-weight="400" text-anchor="start" style="fill:#172033">内部操作和缓存命中可以留在 guest</text>
<path d="M 270 272 L 270 319" class="line"/>
<text x="290" y="304" font-size="15" font-weight="400" text-anchor="start" style="fill:#172033">系统调用</text>
<rect x="710" y="181" width="430" height="85" rx="12" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
<text x="730" y="213" font-size="18" font-weight="600" text-anchor="start" style="fill:#172033">OCI 用户空间与共享镜像缓存</text>
<text x="730" y="240" font-size="15" font-weight="400" text-anchor="start" style="fill:#172033">固定内容版本，按需提供文件</text>
<path d="M 925 267 L 925 298" class="line"/>
<rect x="710" y="306" width="430" height="90" rx="12" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
<text x="730" y="338" font-size="18" font-weight="600" text-anchor="start" style="fill:#172033">文件服务与 OverlayCore</text>
<text x="730" y="365" font-size="15" font-weight="400" text-anchor="start" style="fill:#172033">权限、分层视图、私有修改与冲突基线</text>
<rect x="710" y="419" width="430" height="76" rx="12" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
<text x="730" y="451" font-size="18" font-weight="600" text-anchor="start" style="fill:#172033">受控网络出口</text>
<text x="730" y="478" font-size="15" font-weight="400" text-anchor="start" style="fill:#172033">宿主 smoltcp、访问策略与上游连接</text>
<path d="M 476 355 L 702 355" class="line"/>
<text x="590" y="341" font-size="16" font-weight="600" text-anchor="middle" style="fill:#172033">virtio-fs</text>
<path d="M 476 446 L 702 457" class="line"/>
<text x="590" y="432" font-size="16" font-weight="600" text-anchor="middle" style="fill:#172033">virtio-net</text>
<rect x="30" y="550" width="1140" height="65" rx="12" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
<text x="55" y="578" font-size="19" font-weight="600" text-anchor="start" style="fill:#172033">虚拟化边界与 VMM</text>
<text x="55" y="603" font-size="16" font-weight="400" text-anchor="start" style="fill:#172033">KVM / HVF、虚拟设备和受保护的 guest RAM 访问</text>
<rect x="30" y="654" width="550" height="119" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/>
<text x="50" y="686" font-size="18" font-weight="600" text-anchor="start" style="fill:#172033">内存生命周期</text>
<text x="50" y="713" font-size="15" font-weight="400" text-anchor="start" style="fill:#172033">共享相同内容，按条件压缩或显式卸载</text>
<text x="50" y="740" font-size="15" font-weight="400" text-anchor="start" style="fill:#172033">保留恢复来源，协调 CPU 与设备访问</text>
<rect x="610" y="654" width="560" height="119" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
<text x="630" y="686" font-size="18" font-weight="600" text-anchor="start" style="fill:#172033">原生 Job 的结果接纳</text>
<text x="630" y="713" font-size="15" font-weight="400" text-anchor="start" style="fill:#172033">暂存文件与执行记录 → 审查</text>
<text x="630" y="740" font-size="15" font-weight="400" text-anchor="start" style="fill:#172033">选择性 apply 或丢弃未接纳修改</text>
<text x="30" y="817" font-size="16" font-weight="400" text-anchor="start" style="fill:#475569">机制依平台与配置启用；模型等待时的自动卸载与唤醒仍在研究中。</text>
</svg>
