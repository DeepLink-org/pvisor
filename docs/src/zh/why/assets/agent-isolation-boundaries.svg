<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" width="1200" height="1000" role="img" aria-labelledby="title desc" xml:lang="zh" style="max-width:100%;height:auto">
  <title id="title">进程、容器与虚拟机：隔离发生在哪里</title>
  <desc id="desc">三栏示意。普通进程有各自的用户地址空间，但进入同一个宿主内核。容器额外使用 namespace 和 cgroup 隔离资源视图并限制资源，仍然共享宿主内核，不隔离内核地址空间。托管式虚拟机中的用户进程分别进入独立的 Guest kernel，再经虚拟 I/O、VMM 或 hypervisor 和宿主内核访问宿主平台。下方展示典型 I/O 边界；不表示线性性能关系或绝对安全保证。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Noto Sans", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #172033; }
    .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
    .user { fill: #eff6ff; stroke: #60a5fa; stroke-width: 1.5; }
    .shared { fill: #ecfdf5; stroke: #34d399; stroke-width: 1.5; }
    .guest { fill: #fff7ed; stroke: #fb923c; stroke-width: 1.5; }
    .platform { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 1.2; }
    .arrow { fill: none; stroke: #475569; stroke-width: 1.8; marker-end: url(#arrow); }
    .muted { fill: #475569; }
  </style>
  <rect width="1200" height="1000" fill="#ffffff"/>
  <text x="24" y="44" font-size="28" text-anchor="start" font-weight="700">进程、容器与虚拟机：隔离发生在哪里</text>
  <text x="24" y="77" font-size="16" text-anchor="start" class="muted">独立的用户地址空间、共享或独立的内核实例，以及不同的数据进出路径。</text>
  <rect x="24" y="100" width="18" height="18" rx="4" class="user"/>
  <text x="52" y="115" font-size="14" text-anchor="start" class="muted">用户地址空间</text>
  <rect x="340" y="100" width="18" height="18" rx="4" class="shared"/>
  <text x="368" y="115" font-size="14" text-anchor="start" class="muted">共享宿主内核</text>
  <rect x="704" y="100" width="18" height="18" rx="4" class="guest"/>
  <text x="732" y="115" font-size="14" text-anchor="start" class="muted">独立 Guest kernel</text>
  <rect x="24" y="134" width="368" height="636" rx="16" class="panel"/>
  <text x="44" y="176" font-size="24" text-anchor="start" font-weight="700" style="fill:#1d4ed8">进程</text>
  <text x="44" y="207" font-size="14" text-anchor="start" class="muted">用户空间分开，内核共享</text>
  <rect x="416" y="134" width="368" height="636" rx="16" class="panel"/>
  <text x="436" y="176" font-size="24" text-anchor="start" font-weight="700" style="fill:#047857">容器</text>
  <text x="436" y="207" font-size="14" text-anchor="start" class="muted">资源视图和配额分开，内核共享</text>
  <rect x="808" y="134" width="368" height="636" rx="16" class="panel"/>
  <text x="828" y="176" font-size="24" text-anchor="start" font-weight="700" style="fill:#b45309">虚拟机</text>
  <text x="828" y="207" font-size="14" text-anchor="start" class="muted">用户空间和 Guest kernel 分别隔离</text>
  <rect x="44" y="263" width="152" height="77" rx="10" class="user"/>
  <text x="120" y="293" font-size="17" text-anchor="middle" font-weight="600" style="fill:#1e3a8a">进程 A</text>
  <text x="120" y="320" font-size="12" text-anchor="middle" style="fill:#1e3a8a">独立用户地址空间</text>
  <rect x="220" y="263" width="152" height="77" rx="10" class="user"/>
  <text x="296" y="293" font-size="17" text-anchor="middle" font-weight="600" style="fill:#1e3a8a">进程 B</text>
  <text x="296" y="320" font-size="12" text-anchor="middle" style="fill:#1e3a8a">独立用户地址空间</text>
  <rect x="434" y="248" width="160" height="122" rx="12" fill="#f0fdf4" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="442" y="263" width="144" height="77" rx="10" class="user"/>
  <text x="514" y="293" font-size="17" text-anchor="middle" font-weight="600" style="fill:#1e3a8a">进程 A</text>
  <text x="514" y="320" font-size="12" text-anchor="middle" style="fill:#1e3a8a">独立用户地址空间</text>
  <text x="514" y="359" font-size="12" text-anchor="middle" style="fill:#065f46">namespace / cgroup</text>
  <rect x="612" y="248" width="160" height="122" rx="12" fill="#f0fdf4" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="620" y="263" width="144" height="77" rx="10" class="user"/>
  <text x="692" y="293" font-size="17" text-anchor="middle" font-weight="600" style="fill:#1e3a8a">进程 B</text>
  <text x="692" y="320" font-size="12" text-anchor="middle" style="fill:#1e3a8a">独立用户地址空间</text>
  <text x="692" y="359" font-size="12" text-anchor="middle" style="fill:#065f46">namespace / cgroup</text>
  <rect x="826" y="248" width="160" height="268" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.7"/>
  <rect x="834" y="263" width="144" height="77" rx="10" class="user"/>
  <text x="906" y="293" font-size="17" text-anchor="middle" font-weight="600" style="fill:#1e3a8a">进程 A</text>
  <text x="906" y="320" font-size="12" text-anchor="middle" style="fill:#1e3a8a">独立用户地址空间</text>
  <text x="906" y="363" font-size="12" text-anchor="middle" class="muted">系统调用</text>
  <path d="M 906 373 L 906 390" class="arrow"/>
  <rect x="834" y="398" width="144" height="70" rx="10" class="guest"/>
  <text x="906" y="427" font-size="17" text-anchor="middle" font-weight="600" style="fill:#9a3412">Guest kernel</text>
  <text x="906" y="452" font-size="11" text-anchor="middle" style="fill:#9a3412">独立内核地址空间</text>
  <text x="906" y="493" font-size="13" text-anchor="middle" font-weight="600" style="fill:#92400e">虚拟机 A</text>
  <rect x="1004" y="248" width="160" height="268" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.7"/>
  <rect x="1012" y="263" width="144" height="77" rx="10" class="user"/>
  <text x="1084" y="293" font-size="17" text-anchor="middle" font-weight="600" style="fill:#1e3a8a">进程 B</text>
  <text x="1084" y="320" font-size="12" text-anchor="middle" style="fill:#1e3a8a">独立用户地址空间</text>
  <text x="1084" y="363" font-size="12" text-anchor="middle" class="muted">系统调用</text>
  <path d="M 1084 373 L 1084 390" class="arrow"/>
  <rect x="1012" y="398" width="144" height="70" rx="10" class="guest"/>
  <text x="1084" y="427" font-size="17" text-anchor="middle" font-weight="600" style="fill:#9a3412">Guest kernel</text>
  <text x="1084" y="452" font-size="11" text-anchor="middle" style="fill:#9a3412">独立内核地址空间</text>
  <text x="1084" y="493" font-size="13" text-anchor="middle" font-weight="600" style="fill:#92400e">虚拟机 B</text>
  <path d="M 120 348 L 120 390" class="arrow"/>
  <path d="M 296 348 L 296 390" class="arrow"/>
  <text x="208" y="370" font-size="13" text-anchor="middle" class="muted">系统调用</text>
  <rect x="44" y="398" width="328" height="118" rx="10" class="shared"/>
  <text x="208" y="438" font-size="22" text-anchor="middle" font-weight="600" style="fill:#065f46">共享宿主内核</text>
  <text x="208" y="470" font-size="14" text-anchor="middle" style="fill:#065f46">同一个内核实例 / 内核地址空间</text>
  <text x="208" y="496" font-size="13" text-anchor="middle" style="fill:#065f46">两个进程都在这里执行内核代码</text>
  <path d="M 208 530 L 208 656" class="arrow"/>
  <rect x="52" y="546" width="312" height="61" rx="0" fill="#f8fafc"/>
  <text x="208" y="568" font-size="15" text-anchor="middle" class="muted">文件 / 网络 / 设备 I/O</text>
  <text x="208" y="592" font-size="12" text-anchor="middle" class="muted">内核执行权限与资源检查</text>
  <path d="M 514 378 L 514 390" class="arrow"/>
  <path d="M 692 378 L 692 390" class="arrow"/>
  <text x="600" y="385" font-size="13" text-anchor="middle" class="muted">系统调用</text>
  <rect x="436" y="398" width="328" height="118" rx="10" class="shared"/>
  <text x="600" y="438" font-size="22" text-anchor="middle" font-weight="600" style="fill:#065f46">共享宿主内核</text>
  <text x="600" y="470" font-size="14" text-anchor="middle" style="fill:#065f46">同一个内核实例 / 内核地址空间</text>
  <text x="600" y="496" font-size="13" text-anchor="middle" style="fill:#065f46">namespace / cgroup 由这个内核实现</text>
  <path d="M 600 530 L 600 656" class="arrow"/>
  <rect x="444" y="546" width="312" height="61" rx="0" fill="#f8fafc"/>
  <text x="600" y="568" font-size="15" text-anchor="middle" class="muted">文件 / 网络 / 设备 I/O</text>
  <text x="600" y="592" font-size="12" text-anchor="middle" class="muted">内核执行权限、视图与配额检查</text>
  <text x="992" y="536" font-size="13" text-anchor="middle" class="muted">虚拟 I/O</text>
  <path d="M 906 518 L 906 540" class="arrow"/>
  <path d="M 1084 518 L 1084 540" class="arrow"/>
  <rect x="828" y="546" width="328" height="44" rx="10" fill="#fff7ed" stroke="#fb923c"/>
  <text x="992" y="574" font-size="16" text-anchor="middle" font-weight="600" style="fill:#9a3412">VMM / hypervisor 边界</text>
  <path d="M 992 593 L 992 603" class="arrow"/>
  <rect x="828" y="607" width="328" height="41" rx="10" class="shared"/>
  <text x="992" y="634" font-size="17" text-anchor="middle" font-weight="600" style="fill:#065f46">宿主内核</text>
  <path d="M 992 651 L 992 662" class="arrow"/>
  <rect x="44" y="666" width="328" height="60" rx="10" class="platform"/>
  <text x="208" y="702" font-size="14" text-anchor="middle" font-weight="600" style="fill:#334155">宿主平台 · CPU / 内存 / 设备</text>
  <text x="208" y="749" font-size="12" text-anchor="middle" class="muted">内核内存没有按进程拆成独立内核</text>
  <rect x="436" y="666" width="328" height="60" rx="10" class="platform"/>
  <text x="600" y="702" font-size="14" text-anchor="middle" font-weight="600" style="fill:#334155">宿主平台 · CPU / 内存 / 设备</text>
  <text x="600" y="749" font-size="12" text-anchor="middle" class="muted">容器没有独立的内核地址空间</text>
  <rect x="828" y="666" width="328" height="60" rx="10" class="platform"/>
  <text x="992" y="702" font-size="14" text-anchor="middle" font-weight="600" style="fill:#334155">宿主平台 · CPU / 内存 / 设备</text>
  <text x="992" y="749" font-size="12" text-anchor="middle" class="muted">托管式 VM 示例；Guest kernel 各自独立</text>
  <text x="24" y="806" font-size="20" text-anchor="start" font-weight="600">典型数据路径：跨越边界，需要权限检查或协议处理</text>
  <rect x="24" y="828" width="368" height="104" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="44" y="865" font-size="14" text-anchor="start" font-weight="600">进程 → 系统调用 → 宿主内核</text>
  <text x="44" y="897" font-size="13" text-anchor="start" class="muted">权限检查、数据复制与内核工作</text>
  <rect x="416" y="828" width="368" height="104" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="436" y="865" font-size="14" text-anchor="start" font-weight="600">容器进程 → 系统调用 → 共享宿主内核</text>
  <text x="436" y="897" font-size="13" text-anchor="start" class="muted">资源视图与资源限制仍由共享内核处理</text>
  <rect x="808" y="828" width="368" height="104" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="828" y="865" font-size="14" text-anchor="start" font-weight="600">Guest → 虚拟 I/O → 宿主服务</text>
  <text x="828" y="897" font-size="13" text-anchor="start" class="muted">设备、文件系统或网络协议处理</text>
  <text x="24" y="962" font-size="14" text-anchor="start" class="muted">图中边界是结构示意，不是性能刻度。具体 I/O 成本取决于通路、批处理、共享内存和实现。</text>
  <text x="24" y="987" font-size="14" text-anchor="start" class="muted">隔离效果还取决于权限、配置和漏洞；虚拟机不等于绝对安全。</text>
</svg>
