<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 704" width="1120" height="704" role="img" aria-labelledby="title desc" xml:lang="zh" style="max-width:100%;height:auto">
<title id="title">从协程上下文到虚拟机执行上下文</title>
<desc id="desc">左侧透明协程通过系统调用挂钩或标准库适配接管程序等待，保留调用栈和局部变量。右侧 pVisor 的目标机制以 VM 承载未改写的 Agent、Linux 工具和内核状态，在虚拟设备与协议适配边界接管支持的 I/O，由宿主执行引擎推进并恢复上下文。Agent 无需调用专用挂起与恢复接口。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",sans-serif;fill:#172033} .muted{fill:#526176}</style>
<rect width="1120" height="704" rx="16" fill="white"/>
<text x="32" y="43" font-size="17" font-weight="700" text-anchor="start" style="fill:#2563eb">04 · 机制对应</text>
<text x="32" y="80" font-size="28" font-weight="700" text-anchor="start" style="fill:#172033">用虚拟机承载 Agent 的执行上下文</text>
<text x="32" y="113" font-size="18" font-weight="400" text-anchor="start" style="fill:#526176">目标机制：Agent 保留原来的代码与调用方式，等待适配集中在 guest / VMM / 宿主。</text>
<rect x="32" y="139" width="512" height="508" rx="10" fill="#f8fafc" stroke="#dbe3ed"/>
<rect x="576" y="139" width="512" height="508" rx="10" fill="#f8fafc" stroke="#dbe3ed"/>
<text x="52" y="175" font-size="22" font-weight="600" text-anchor="start" style="fill:#172033">透明协程 · 托管一段程序</text>
<text x="596" y="175" font-size="22" font-weight="600" text-anchor="start" style="fill:#172033">pVisor · 托管整个执行环境</text>
<rect x="52" y="192" width="472" height="218" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
<rect x="596" y="192" width="472" height="218" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
<text x="70" y="222" font-size="18" font-weight="600" text-anchor="start" style="fill:#2563eb">程序逻辑</text>
<text x="614" y="222" font-size="18" font-weight="600" text-anchor="start" style="fill:#2563eb">VM 内：原有 Agent 与 Linux 工具</text>
<rect x="70" y="237" width="436" height="54" rx="10" fill="white" stroke="#bfdbfe"/>
<rect x="614" y="237" width="436" height="54" rx="10" fill="white" stroke="#bfdbfe"/>
<text x="288" y="272" font-size="23" font-weight="600" text-anchor="middle" style="fill:#2563eb">read() → request() → write()</text>
<text x="832" y="272" font-size="23" font-weight="600" text-anchor="middle" style="fill:#2563eb">read() → request() → write()</text>
<rect x="70" y="308" width="436" height="78" rx="10" fill="white" stroke="#bfdbfe"/>
<rect x="614" y="308" width="436" height="78" rx="10" fill="white" stroke="#bfdbfe"/>
<text x="288" y="339" font-size="21" font-weight="600" text-anchor="middle" style="fill:#2563eb">保留协程上下文</text>
<text x="288" y="370" font-size="18" font-weight="400" text-anchor="middle" style="fill:#526176">调用栈 · 局部变量</text>
<text x="832" y="339" font-size="21" font-weight="600" text-anchor="middle" style="fill:#2563eb">保留 Linux 执行上下文</text>
<text x="832" y="370" font-size="18" font-weight="400" text-anchor="middle" style="fill:#526176">进程 · 内存 · 内核状态</text>
<text x="560" y="354" font-size="30" font-weight="400" text-anchor="middle" style="fill:#526176">≈</text>
<path d="M288 411 L288 438" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M832 411 L832 438" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="52" y="442" width="472" height="66" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
<rect x="596" y="442" width="472" height="66" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
<text x="288" y="469" font-size="20" font-weight="600" text-anchor="middle" style="fill:#059669">系统调用挂钩 / 标准库适配</text>
<text x="288" y="495" font-size="17" font-weight="400" text-anchor="middle" style="fill:#526176">运行时接管受支持的阻塞 I/O</text>
<text x="832" y="469" font-size="20" font-weight="600" text-anchor="middle" style="fill:#059669">Linux I/O → 虚拟设备 / 协议适配</text>
<text x="832" y="495" font-size="17" font-weight="400" text-anchor="middle" style="fill:#526176">pVisor 在此交接请求与数据所有权</text>
<path d="M288 509 L288 540" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M832 509 L832 540" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="52" y="544" width="472" height="80" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
<rect x="596" y="544" width="472" height="80" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
<text x="288" y="576" font-size="22" font-weight="600" text-anchor="middle" style="fill:#059669">共享事件引擎</text>
<text x="288" y="606" font-size="17" font-weight="400" text-anchor="middle" style="fill:#526176">推进 I/O · 事件到达后恢复协程</text>
<text x="832" y="576" font-size="22" font-weight="600" text-anchor="middle" style="fill:#059669">宿主共享执行引擎</text>
<text x="832" y="606" font-size="17" font-weight="400" text-anchor="middle" style="fill:#526176">推进 I/O · 事件到达后恢复 VM</text>
<text x="32" y="678" font-size="19" font-weight="400" text-anchor="start" style="fill:#526176">共同变化：应用按顺序调用；运行时接管等待、保留上下文，并让执行从原处继续。</text>
</svg>
