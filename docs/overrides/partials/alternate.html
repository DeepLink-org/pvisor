{# Each article has a matching path in both languages. #}
{% set current = page.url if page else '' %}
{% set suffix = current[3:] if config.extra.root and current[:3] in ['en/', 'zh/'] else current %}
<div class="md-header__option">
  <div class="md-select">
    <button class="md-header__button md-icon" aria-label="{{ lang.t('select.language') }}">
      {% include ".icons/" ~ (config.theme.icon.alternate or "material/translate") ~ ".svg" %}
    </button>
    <div class="md-select__inner">
      <ul class="md-select__list">
        {% for alt in config.extra.alternate %}
          <li class="md-select__item">
            <a href="{{ (alt.link ~ suffix) | url }}" hreflang="{{ alt.lang }}" lang="{{ alt.lang }}" class="md-select__link"{% if config.theme.language == alt.lang %} aria-current="true"{% endif %}>{{ alt.name }}</a>
          </li>
        {% endfor %}
      </ul>
    </div>
  </div>
</div>
