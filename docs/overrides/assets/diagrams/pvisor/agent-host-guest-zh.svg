<svg xmlns="http://www.w3.org/2000/svg" width="880" height="700" viewBox="0 0 880 700" role="img" aria-labelledby="title desc">
<title id="title">pVisor 在沙箱执行框架中的位置</title>
<desc id="desc">上层 Agent 发起调用。Host 沙箱执行框架中，pVisor 作为管理模块接入运行时与 I/O 路径，提供文件和网络监管、生命周期管理以及镜像与内存优化。下层 guest VM 运行命令和工具。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#6bd6cd" stroke-width="1.8"/></marker>
<style>
text {font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","PingFang SC",sans-serif;text-anchor:middle;fill:#e7edf5}
.label {font-size:20px;font-weight:600} .body {font-size:16px;fill:#b9c9da} .detail {font-size:14px;fill:#b9c9da} .caption {font-size:17px;fill:#8de1d8} .layer {font-size:19px;font-weight:600;fill:#b9c9da} .module-title {font-size:21px;font-weight:700;fill:#9bf0dc}
.panel {fill:#142238;stroke:#425671;stroke-width:1.3} .node {fill:#1c3049;stroke:#52718e;stroke-width:1.3}
.module {fill:#123436;stroke:#6bd6cd;stroke-width:2} .capability {fill:#193d40;stroke:#427e7c;stroke-width:1}
.line {fill:none;stroke:#6bd6cd;stroke-width:2;marker-end:url(#arrow)} .both {marker-start:url(#arrow)} .integration {stroke-dasharray:6 5}
</style>
</defs>
<rect width="880" height="700" rx="16" fill="#0d1727"/>
<rect x="40" y="24" width="800" height="70" rx="12" class="panel"/>
<text x="440" y="66" class="label">Agent / 上层应用</text>
<path d="M440 98 V156" class="line both"/>
<text x="604" y="132" class="caption">工具调用 / 执行结果</text>
<rect x="40" y="160" width="800" height="370" rx="12" class="panel"/>
<text x="440" y="190" class="layer">Host · 沙箱执行框架</text>
<rect x="65" y="208" width="750" height="144" rx="12" class="module"/>
<text x="440" y="239" class="module-title">pVisor · Agent 原生管理模块</text>
<rect x="80" y="254" width="230" height="80" rx="8" class="capability"/>
<rect x="325" y="254" width="230" height="80" rx="8" class="capability"/>
<rect x="570" y="254" width="230" height="80" rx="8" class="capability"/>
<text x="195" y="285" class="caption">文件与网络监管</text><text x="195" y="312" class="body">OverlayCore / OverlayNet</text>
<text x="440" y="285" class="caption">生命周期管理</text><text x="440" y="312" class="body">协调沙箱运行状态</text>
<text x="685" y="285" class="caption">镜像与内存优化</text><text x="685" y="312" class="detail">按需加载、共享与压缩</text>
<path d="M440 356 V438" class="line"/>
<rect x="321" y="382" width="238" height="30" rx="5" fill="#142238"/>
<text x="440" y="403" class="caption">暂停 / 卸载 / 恢复</text>
<path d="M685 356 V478 H559" class="line integration"/>
<rect x="584" y="382" width="202" height="30" rx="5" fill="#142238"/>
<text x="685" y="403" class="caption">资源机制集成</text>
<rect x="325" y="442" width="230" height="70" rx="9" class="node"/>
<text x="440" y="470" class="label">沙箱运行时</text><text x="440" y="495" class="body">VMM</text>
<path d="M195 356 V606" class="line both"/>
<path d="M440 516 V606" class="line both"/>
<rect x="90" y="552" width="210" height="30" rx="5" fill="#0d1727"/>
<text x="195" y="573" class="caption">文件 / 网络 I/O</text>
<text x="563" y="573" class="caption">VM 执行与结果返回</text>
<rect x="40" y="610" width="800" height="65" rx="12" class="panel"/>
<text x="215" y="650" class="label">guest VM</text><text x="550" y="650" class="body">命令与工具执行</text>
</svg>
