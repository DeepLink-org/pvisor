<svg xmlns="http://www.w3.org/2000/svg" width="880" height="700" viewBox="0 0 880 700" role="img" aria-labelledby="title desc">
<title id="title">pVisor within the sandbox execution framework</title>
<desc id="desc">The Agent issues calls from above. Within the Host sandbox execution framework, pVisor integrates with the runtime and I/O paths to provide file and network oversight, lifecycle management, and image and memory optimization. The guest VM below runs commands and tools.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#6bd6cd" stroke-width="1.8"/></marker>
<style>
text {font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","PingFang SC",sans-serif;text-anchor:middle;fill:#e7edf5}
.label {font-size:20px;font-weight:600} .body {font-size:16px;fill:#b9c9da} .detail {font-size:14px;fill:#b9c9da} .caption {font-size:17px;fill:#8de1d8} .layer {font-size:19px;font-weight:600;fill:#b9c9da} .module-title {font-size:21px;font-weight:700;fill:#9bf0dc}
.panel {fill:#142238;stroke:#425671;stroke-width:1.3} .node {fill:#1c3049;stroke:#52718e;stroke-width:1.3}
.module {fill:#123436;stroke:#6bd6cd;stroke-width:2} .capability {fill:#193d40;stroke:#427e7c;stroke-width:1}
.line {fill:none;stroke:#6bd6cd;stroke-width:2;marker-end:url(#arrow)} .both {marker-start:url(#arrow)} .integration {stroke-dasharray:6 5}
</style>
</defs>
