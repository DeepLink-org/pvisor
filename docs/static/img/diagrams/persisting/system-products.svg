<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">PolicyVisor: policy-governed, reviewable execution</title>
  <desc id="desc">Agent CLIs, scripts, and automation commands run through capability admission and a selected executor. The Run Bundle records effective controls and outcomes. With staging enabled, file changes can be reviewed, selectively applied, or discarded. External side effects are not rolled back.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111f"/><stop offset="1" stop-color="#17233a"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5eead4"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .title { font-size: 34px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-size: 20px; fill: #cbd5e1; }
      .label { font-size: 24px; font-weight: 700; fill: #f8fafc; }
      .body { font-size: 18px; fill: #cbd5e1; }
      .small { font-size: 16px; fill: #94a3b8; }
      .step { font-size: 14px; font-weight: 700; letter-spacing: 1px; fill: #5eead4; }
      .card { fill: #101d31; stroke: #40516a; stroke-width: 1.5; }
      .line { stroke: #5eead4; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1400" height="620" rx="28" fill="url(#bg)"/>
  <text x="52" y="62" class="title">PolicyVisor (pVisor)</text>
  <text x="52" y="100" class="subtitle">Policy-governed, reviewable execution.</text>
  <rect x="52" y="134" width="1296" height="60" rx="16" class="card"/>
  <text x="700" y="172" text-anchor="middle" class="body">Your existing tools: Agent CLIs · scripts · automation commands</text>

  <rect x="52" y="230" width="396" height="256" rx="20" class="card"/>
  <text x="80" y="268" class="step">01 · DEFINE</text>
  <text x="80" y="308" class="label">Policy and admission</text>
  <text x="80" y="350" class="body">Workspace and capability requirements</text>
  <text x="80" y="382" class="body">Filesystem · network · process · tools</text>
  <text x="80" y="437" class="small">Check what the selected provider supports.</text>
  <line x1="450" y1="356" x2="497" y2="356" class="line"/>

  <rect x="502" y="230" width="396" height="256" rx="20" fill="#102b31" stroke="#5eead4" stroke-width="2"/>
  <text x="530" y="268" class="step">02 · EXECUTE</text>
  <text x="530" y="308" class="label">Runtime controls</text>
  <text x="530" y="350" class="body">Host · OCI container · libkrun VM</text>
  <text x="530" y="382" class="body">OverlayFS · OverlayNet · Gateway</text>
  <text x="530" y="437" class="small">Explicit staging; optional model capture.</text>
  <line x1="900" y1="356" x2="947" y2="356" class="line"/>

  <rect x="952" y="230" width="396" height="256" rx="20" class="card"/>
  <text x="980" y="268" class="step">03 · REVIEW</text>
  <text x="980" y="308" class="label">Evidence and decisions</text>
  <text x="980" y="350" class="body">Run Bundle · controls · warnings</text>
  <text x="980" y="382" class="body">Review · apply · drop staged files</text>
  <text x="980" y="437" class="small">Keep selected changes and the Run record.</text>

  <text x="52" y="539" class="body">Requested policy and effective enforcement are separate facts. Inspect each Run's evidence.</text>
  <text x="52" y="579" class="small">Apply and drop govern staged files; external API calls and other remote effects cannot be undone by file review.</text>
</svg>
