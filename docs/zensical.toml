[project]
site_name = "PolicyVisor"
site_description = "Scaling autonomous agent execution for Agents, scripts, and automation."
site_url = "https://deeplink-org.github.io/pvisor/"
docs_dir = "src"
site_dir = "site"
repo_name = "DeepLink-org/pvisor"
repo_url = "https://github.com/DeepLink-org/pvisor"
extra_css = ["stylesheets/extra.css"]

nav = [
  { "首页" = "zh/index.md" },
  { "开始使用" = ["zh/start/index.md", "zh/start/what-is-pvisor.md", "zh/start/installation.md", "zh/start/first-run.md"] },
  { "任务指南" = ["zh/guides/index.md", "zh/guides/workflows.md", "zh/guides/review-apply.md", "zh/guides/execution.md", "zh/guides/network.md", "zh/guides/capture.md", "zh/guides/sandbox-replay.md", "zh/guides/troubleshooting.md"] },
  { "概念与边界" = ["zh/concepts/index.md", "zh/concepts/run-model.md", "zh/concepts/capabilities-and-evidence.md"] },
  { "参考" = ["zh/reference/index.md", "zh/reference/cli.md", "zh/reference/shared-image-cache.md"] },
  { "参与开发" = ["zh/development/index.md", "zh/development/engineering.md", "zh/development/examples.md", "zh/development/releasing.md"] },
  { "实现设计" = ["zh/design/index.md", "zh/design/architecture.md", "zh/design/operations-events.md", "zh/design/isolation.md", "zh/design/overlaynet.md", "zh/design/gateway.md", "zh/design/cli.md", "zh/design/principles.md"] },
]

[project.theme]
language = "zh"
custom_dir = "overrides"
logo = "assets/logos/pvisor-icon.png"
favicon = "assets/logos/pvisor-icon.png"
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.expand",
  "navigation.indexes",
  "navigation.path",
  "navigation.tracking",
  "navigation.top",
  "search.highlight",
  "content.code.copy",
  "content.code.select",
  "content.code.annotate",
  "content.tabs.link",
  "content.tooltips",
  "content.footnote.tooltips",
  "toc.follow",
]

[project.theme.palette]
scheme = "slate"
primary = "custom"
accent = "custom"


[project.extra]
homepage = "zh/"
english_pages = ["", "reference/cli/", "start/", "start/first-run/", "start/installation/", "start/what-is-pvisor/"]
alternate = [
  { name = "English", link = "/pvisor/en/", lang = "en" },
  { name = "中文", link = "/pvisor/zh/", lang = "zh" },
]

[project.markdown_extensions]
admonition = {}
"pymdownx.details" = {}
"pymdownx.superfences" = {}
"pymdownx.highlight" = { anchor_linenums = true }
"pymdownx.inlinehilite" = {}
"pymdownx.tabbed" = { alternate_style = true }
attr_list = {}
md_in_html = {}
def_list = {}
tables = {}
toc.permalink = true
