[project]
site_name = "Persisting"
site_description = "Persistent Infrastructure for the Agent Era"
site_url = "https://deeplink-org.github.io/Persisting/"
docs_dir = "src"
site_dir = "site"
exclude_docs = ["installation.md", "stylesheets/reference-home.css"]
repo_name = "DeepLink-org/Persisting"
repo_url = "https://github.com/DeepLink-org/Persisting"
extra_css = ["stylesheets/extra.css"]

nav = [
  { "Home" = "en/index.md" },
  { "Get started" = [
    "en/overview.md",
    { "Installation" = "en/installation.md" },
    { "Running an Agent with pVisor" = "en/pvisor/get-started.md" },
  ] },
  { "pVisor" = ["en/pvisor/index.md", "en/pvisor/get-started.md", { "Concepts" = ["en/pvisor/concepts/index.md", "en/pvisor/concepts/agentvisor.md", "en/pvisor/concepts/run-model.md", "en/pvisor/concepts/capabilities-and-evidence.md"] }, { "Guides" = ["en/pvisor/guides/index.md", "en/pvisor/guides/execution.md", "en/pvisor/guides/review-apply.md", "en/pvisor/guides/network.md", "en/pvisor/guides/capture.md", "en/pvisor/guides/sandbox-replay.md", "en/pvisor/guides/troubleshooting.md"] }, { "Design" = ["en/pvisor/design/index.md", "en/pvisor/design/isolation.md", "en/pvisor/design/overlaynet.md", "en/pvisor/design/gateway.md", "en/pvisor/design/cli.md"] }, { "Reference" = ["en/pvisor/reference/index.md", "en/pvisor/reference/cli.md", "en/pvisor/reference/cases.md"] }] },
  { "Agent Infra Thinkings" = ["en/why-persisting.md", "en/roadmap.md", "en/guides/using-persisting.md", "en/system-design/index.md", "en/system-design/design-principles.md", "en/system-design/architecture.md", "en/system-design/local-to-fleet.md", "en/system-design/security-evidence.md", "en/project/index.md", "en/project/examples.md", "en/project/engineering.md", "en/project/releasing.md"] },
]

[project.theme]
language = "en"
custom_dir = "overrides"
logo = "assets/persisting-icon.png"
favicon = "assets/persisting-icon.png"
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.expand",
  "navigation.indexes",
  "navigation.path",
  "navigation.tracking",
  "navigation.top",
  "search.highlight",
  "content.code.copy",
  "content.code.select",
  "content.code.annotate",
  "content.tabs.link",
  "content.tooltips",
  "content.footnote.tooltips",
  "toc.follow",
]

[project.theme.palette]
scheme = "slate"
primary = "custom"
accent = "custom"


[project.extra]
homepage = "en/"
alternate = [
  { name = "English", link = "/Persisting/en/", lang = "en" },
  { name = "中文", link = "/Persisting/zh/", lang = "zh" },
]

[project.markdown_extensions]
admonition = {}
"pymdownx.details" = {}
"pymdownx.superfences" = {}
"pymdownx.highlight" = { anchor_linenums = true }
"pymdownx.inlinehilite" = {}
"pymdownx.tabbed" = { alternate_style = true }
attr_list = {}
md_in_html = {}
def_list = {}
tables = {}
toc.permalink = true
