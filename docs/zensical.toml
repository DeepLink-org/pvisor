[project.theme]
language = "zh"
custom_dir = "overrides"
logo = "assets/logos/pvisor-icon.png"
favicon = "assets/logos/pvisor-icon.png"
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.expand",
  "navigation.indexes",
  "navigation.path",
  "navigation.tracking",
  "navigation.top",
  "search.highlight",
  "content.code.copy",
  "content.code.select",
  "content.code.annotate",
  "content.tabs.link",
  "content.tooltips",
  "content.footnote.tooltips",
  "toc.follow",
]

[project.theme.palette]
scheme = "slate"
primary = "custom"
accent = "custom"


[project.extra]
homepage = "zh/"
alternate = [
  { name = "English", link = "/pvisor/en/", lang = "en" },
  { name = "中文", link = "/pvisor/zh/", lang = "zh" },
]

[project.markdown_extensions]
admonition = {}
"pymdownx.details" = {}
"pymdownx.superfences" = {}
"pymdownx.highlight" = { anchor_linenums = true }
"pymdownx.inlinehilite" = {}
"pymdownx.tabbed" = { alternate_style = true }
attr_list = {}
md_in_html = {}
def_list = {}
tables = {}
toc.permalink = true
