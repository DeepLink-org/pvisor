[project]
site_name = "PolicyVisor"
site_description = "Policy-governed, reviewable execution for Agents, scripts, and automation."
site_url = "https://deeplink-org.github.io/Persisting/"
docs_dir = "src"
site_dir = "site"
exclude_docs = ["installation.md", "stylesheets/reference-home.css"]
repo_name = "DeepLink-org/Persisting"
repo_url = "https://github.com/DeepLink-org/Persisting"
extra_css = ["stylesheets/extra.css"]

nav = [
  { "Home" = "en/index.md" },
  { "Get started" = ["en/start/index.md", "en/start/what-is-pvisor.md", "en/start/installation.md", "en/start/first-run.md"] },
  { "Guides" = ["en/guides/index.md", "en/guides/workflows.md", "en/guides/review-apply.md", "en/guides/execution.md", "en/guides/network.md", "en/guides/capture.md", "en/guides/sandbox-replay.md", "en/guides/troubleshooting.md"] },
  { "Concepts" = ["en/concepts/index.md", "en/concepts/run-model.md", "en/concepts/capabilities-and-evidence.md", "en/concepts/security-evidence.md", "en/concepts/why-pvisor.md", "en/concepts/policyvisor.md"] },
  { "Reference" = ["en/reference/index.md", "en/reference/cli.md", "en/reference/cases.md"] },
  { "Development" = ["en/development/index.md", "en/development/engineering.md", "en/development/examples.md", "en/development/releasing.md", "en/development/roadmap.md"] },
  { "Design" = ["en/design/index.md", "en/design/architecture.md", "en/design/isolation.md", "en/design/overlaynet.md", "en/design/gateway.md", "en/design/cli.md", "en/design/principles.md", "en/design/local-to-fleet.md"] },
]

[project.theme]
language = "en"
custom_dir = "overrides"
logo = "assets/logos/pvisor-icon.png"
favicon = "assets/logos/pvisor-icon.png"
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.expand",
  "navigation.indexes",
  "navigation.path",
  "navigation.tracking",
  "navigation.top",
  "search.highlight",
  "content.code.copy",
  "content.code.select",
  "content.code.annotate",
  "content.tabs.link",
  "content.tooltips",
  "content.footnote.tooltips",
  "toc.follow",
]

[project.theme.palette]
scheme = "slate"
primary = "custom"
accent = "custom"


[project.extra]
homepage = "en/"
alternate = [
  { name = "English", link = "/Persisting/en/", lang = "en" },
  { name = "中文", link = "/Persisting/zh/", lang = "zh" },
]

[project.markdown_extensions]
admonition = {}
"pymdownx.details" = {}
"pymdownx.superfences" = {}
"pymdownx.highlight" = { anchor_linenums = true }
"pymdownx.inlinehilite" = {}
"pymdownx.tabbed" = { alternate_style = true }
attr_list = {}
md_in_html = {}
def_list = {}
tables = {}
toc.permalink = true
