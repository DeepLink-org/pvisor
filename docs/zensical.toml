# 根首页；中文和英文文档分别由 zensical.zh.toml、zensical.en.toml 构建。
[project]
site_name = "PolicyVisor"
site_description = "Scaling autonomous agent execution for Agents, scripts, and automation."
site_url = "https://deeplink-org.github.io/pvisor/"
docs_dir = "landing"
site_dir = "site"
cache_dir = ".cache/root"
dev_addr = "127.0.0.1:3000"
repo_name = "DeepLink-org/pvisor"
repo_url = "https://github.com/DeepLink-org/pvisor"
extra_css = ["assets/stylesheets/extra.css"]

[[project.nav]]
"首页" = "index.md"

[[project.nav]]
"中文文档" = "/pvisor/zh/"

[[project.nav]]
English = "/pvisor/en/"

[project.theme]
language = "zh"
custom_dir = "overrides"
logo = "assets/logos/pvisor-icon.png"
favicon = "assets/logos/pvisor-icon.png"
features = ["navigation.tabs"]

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"

[project.extra]
homepage = "zh/"
root = true

[[project.extra.alternate]]
name = "English"
link = "/pvisor/en/"
lang = "en"

[[project.extra.alternate]]
name = "中文"
link = "/pvisor/zh/"
lang = "zh"

[project.plugins.search]
lang = ["zh"]

[project.plugins.exclude]
regex = ["(^|/)\\.data(/|$)"]

# 无语言前缀的历史链接默认跳转到中文；zh/、en/ 下的重定向由各语言配置维护。
[project.plugins.redirects.redirect_maps]

