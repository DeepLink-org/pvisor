xt><rect x="10" y="326" width="1080" height="160" rx="12" fill="#edf3f9" stroke="#a7bacb" stroke-width="1.8"/><text x="30" y="358" font-size="26" font-weight="650" fill="#17324d" text-anchor="start">宿主数据与状态服务</text><rect x="30" y="382" width="236" height="82" rx="12" fill="#ffffff" stroke="#a7bacb" stroke-width="1.8"/><text x="148.0" y="420.0" font-size="22" font-weight="650" fill="#17324d" text-anchor="middle">OverlayCore / FS</text><text x="148.0" y="448.0" font-size="19" font-weight="400" fill="#455c70" text-anchor="middle">文件服务 · stage / apply</text><rect x="298" y="382" width="236" height="82" rx="12" fill="#ffffff" stroke="#a7bacb" stroke-width="1.8"/><text x="416.0" y="420.0" font-size="22" font-weight="650" fill="#17324d" text-anchor="middle">OverlayNet</text><text x="416.0" y="448.0" font-size="19" font-weight="400" fill="#455c70" text-anchor="middle">smoltcp · DNS · TCP</text><rect x="566" y="382" width="236" height="82" rx="12" fill="#ffffff" stroke="#a7bacb" stroke-width="1.8"/><text x="684.0" y="420.0" font-size="22" font-weight="650" fill="#17324d" text-anchor="middle">Image Cache</text><text x="684.0" y="448.0" font-size="19" font-weight="400" fill="#455c70" text-anchor="middle">元数据 · 内容块 · 校验</text><rect x="834" y="382" width="236" height="82" rx="12" fill="#ffffff" stroke="#a7bacb" stroke-width="1.8"/><text x="952.0" y="420.0" font-size="22" font-weight="650" fill="#17324d" text-anchor="middle">存储与记录</text><text x="952.0" y="448.0" font-size="19" font-weight="400" fill="#455c70" text-anchor="middle">snapshot · Journal</text><rect x="10" y="508" width="1080" height="80" rx="12" fill="#e9f2fb" stroke="#a7bacb" stroke-width="1.8"/><text x="550.0" y="545.0" font-size="27" font-weight="650" fill="#17324d" text-anchor="middle">执行器选择</text><text x="550.0" y="573.0" font-size="19" font-weight="400" fill="#455c70" text-anchor="middle">Host 进程 / OCI 容器 / VM（下方展开）</text><text x="550" y="632" font-size="22" font-weight="500" fill="#17324d" text-anchor="middle">共享契约 pvisor-core   |   可选 Gateway / Replay</text><text x="550" y="668" font-size="20" font-weight="400" fill="#455c70" text-anchor="middle">Daemon 的公开接口限于 VM sandbox 生命周期</text></g><g transform="translate(0 714)"><rect width="1100" height="1310" fill="white"/><g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif"><rect x="10" y="12" width="1080" height="1040" rx="12" fill="#edf3f9" stroke="#a7bacb" stroke-width="1.8"/><text x="30" y="44" font-size="26" font-weight="650" fill="#17324d" text-anchor="start">pvisor-vm · VMM、RAM、设备与平台实现的唯一所有者</text><rect x="30" y="66" width="1040" height="64" rx="12" fill="#ffffff" stroke="#a7bacb" stroke-width="1.8"/><text x="550.0" y="106.0" font-size="25" font-weight="650" fill="#17324d" text-anchor="middle">pvisor_vm::api · VmBuilder · run(on_ready) · VmmHandle</text><rect x="30" y="148" width="1040" height="100" rx="12" fill="#e5effa" stroke="#a7bacb" stroke-width="1.8"/><text x="50" y="180" font-size="26" font-weight="650" fill="#17324d" text-anchor="start">Guest 地址空间</text><text x="550" y="217" font-size="23" font-weight="600" fill="#17324d" text-anchor="middle">工作负载 / pvisor-guest（PID 1） · Linux VFS / TCP/IP / virtio</text><rect x="30" y="268" width="336" height="374" rx="12" fill="#e5eef6" stroke="#a7bacb" stroke-width="1.8"/><text x="50" y="300" font-size="26" font-weight="650" fill="#17324d" text-anchor="start">vCPU 与执行控制</text><rect x="42" y="318" width="312" height="64" rx="12" fill="#ffffff" stroke="#a7bacb" stroke-width="1.8"/><text x="198.0" y="347.0" font-size="22" font-weight="650" fill="#17324d" text-anchor="middle">vCPU threads</text><text x="198.0" y="375.0" font-size="19" font-weight="400" fill="#455c70" text-anchor="middle">run · VM exit · kick</text><rect x="42" y="394" width="312" height="64" rx="12" fill="#ffffff" stroke="#a7bacb" stroke-width="1.8"/><text x="198.0" y="423.0" font-size="22" font-weight="650" fill="#17324d" text-anchor="middle">寄存器与中断</text><text x="198.0" y="451.0" font-size="19" font-weight="400" fill="#455c70" text-anchor="middle">CPU state · IRQ · MMIO / PIO</text><rect x="42" y="470" width="312" height="64" rx="12" fill="#ffffff" stroke="#a7bacb" stroke-width="1.8"/><text x="198.0" y="499.0" font-size="22" font-weight="650" fill="#17324d" text-anchor="middle">事件循环与控制</text><text x="198.0" y="527.0" font-size="19" font-weight="400" fill="#455c70" text-anchor="middle">EventManager · pause / resume</text><rect x="42" y="546" width="312" height="64" rx="12" fill="#ffffff" stroke="#a7bacb" stroke-width="1.8"/><text x="198.0" y="575.0" font-size="22" font-weight="650" fill="#17324d" text-anchor="middle">内核与启动布局</text><text x="198.0" y="603.0" font-size="19" font-weight="400" fill="#455c70" text-anchor="middle">firmware · boot params</text><rect x="382" y="268" width="336" height="374" rx="12" fill="#e5eef6" stroke="#a7bacb" stroke-width="1.8"/><text x="402" y="300" font-size="26" font-weight="650" fill="#17324d" text-anchor="start">RAM 与映射</text><rect x="394" y="318" width="312" height="64" rx="12" fill="#ffffff" stroke="#a7bacb" stroke-width="1.8"/><text x="550.0" y="347.0" font-size="22" font-weight="650" fill="#17324d" text-anchor="middle">GuestMemoryMmap</text><text x="550.0" y="375.0" font-size="19" font-weight="400" fill="#455c70" text-anchor="middle">GPA regions ↔ HVA</text><rect x="394" y="394" width="312" height="64" rx="12" fill="#ffffff" stroke="#a7bacb" stroke-width="1.8"/><text x="550.0" y="423.0" font-size="22" font-weight="650" fill="#17324d" text-anchor="middle">RAM backing / 恢复</text><text x="550.0" y="451.0" font-size="19" font-weight="400" fill="#455c70" text-anchor="middle">anonymous · file · snapshot COW</text><rect x="394" y="470" width="312" height="64" rx="12" fill="#ffffff" stroke="#a7bacb" stroke-width="1.8"/><text x="550.0" y="499.0" font-size="22" font-weight="650" fill="#17324d" text-anchor="middle">物理页共享（可选）</text><text x="550.0" y="527.0" font-size="19" font-weight="400" fill="#455c70" text-anchor="middle">pool slots · MAP_PRIVATE · COW</text><rect x="394" y="546" width="312" height="64" rx="12" fill="#ffffff" stroke="#a7bacb" stroke-width="1.8"/><text x="550.0" y="575.0" font-size="22" font-weight="650" fill="#17324d" text-anchor="middle">冷页与缺页恢复（可选）</text><text x="550.0" y="603.0" font-size="19" font-weight="400" fill="#455c70" text-anchor="middle">按平台和模式选择 pager</text><rect x="734" y="268" width="336" height="374" rx="12" fill="#e5eef6" stroke="#a7bacb" stroke-width="1.8"/><text x="754" y="300" font-size="26" font-weight="650" fill="#17324d" text-anchor="start">虚拟设备与队列</text><rect x="746" y="318" width="312" height="64" rx="12" fill="#ffffff" stroke="#a7bacb" stroke-width="1.8"/><text x="902.0" y="347.0" font-size="22" font-weight="650" fill="#17324d" text-anchor="middle">virtio-fs → 文件服务</text><text x="902.0" y="375.0" font-size="19" font-weight="400" fill="#455c70" text-anchor="middle">FilesystemService · inode / handle</text><rect x="746" y="394" width="312" height="64" rx="12" fill="#ffffff" stroke="#a7bacb" stroke-width="1.8"/><text x="902.0" y="423.0" font-size="22" font-weight="650" fill="#17324d" text-anchor="middle">virtio-net → OverlayNet</text><text x="902.0" y="451.0" font-size="19" font-weight="400" fill="#455c70" text-anchor="middle">Ethernet frames · UnixStream</text><rect x="746" y="470" width="312" height="64" rx="12" fill="#ffffff" stroke="#a7bacb" stroke-width="1.8"/><text x="902.0" y="499.0" font-size="22" font-weight="650" fill="#17324d" text-anchor="middle">virtio-console / vsock</text><text x="902.0" y="527.0" font-size="19" font-weight="400" fill="#455c70" text-anchor="middle">stdio · host / guest transport</text><rect x="746" y="546" width="312" height="64" rx="12" fill="#ffffff" stroke="#a7bacb" stroke-width="1.8"/><text x="902.0" y="575.0" font-size="22" font-weight="650" fill="#17324d" text-anchor="middle">virtio-rng / balloon</text><text x="902.0" y="603.0" font-size="19" font-weight="400" fill="#455c70" text-anchor="middle">randomness · free-page reporting</text><rect x="30" y="662" width="1040" height="190" rx="12" fill="#e5effa" stroke="#a7bacb" stroke-width="1.8"/><text x="50" y="694" font-size="26" font-weight="650" fill="#17324d" text-anchor="start">一致性冻结 · 快照捕获与恢复</text><rect x="44" y="716" width="232" height="70" rx="12" fill="#ffffff" stroke="#a7bacb" stroke-width="1.8"/><text x="160.0" y="748.0" font-size="22" font-weight="650" fill="#17324d" text-anchor="middle">① vCPU 停驻</text><text x="160.0" y="776.0" font-size="19" font-weight="400" fill="#455c70" text-anchor="middle">等待 CPU 确认</text><rect x="304" y="716" width="232" height="70" rx="12" fill="#ffffff" stroke="#a7bacb" stroke-width="1.8"/><text x="420.0" y="748.0" font-size="22" font-weight="650" fill="#17324d" text-anchor="middle">② 设备排空</text><text x="420.0" y="776.0" font-size="19" font-weight="400" fill="#455c70" text-anchor="middle">worker 归还队列</text><rect x="564" y="716" width="232" height="70" rx="12" fill="#ffffff" stroke="#a7bacb" stroke-width="1.8"/><text x="680.0" y="748.0" font-size="22" font-weight="650" fill="#17324d" text-anchor="middle">③ 关闭 RAM gate</text><text x="680.0" y="776.0" font-size="19" font-weight="400" fill="#455c70" text-anchor="middle">等待 RAM lease 释放</text><rect x="824" y="716" width="232" height="70" rx="12" fill="#ffffff" stroke="#a7bacb" stroke-width="1.8"/><text x="940.0" y="748.0" font-size="22" font-weight="650" fill="#17324d" text-anchor="middle">④ 捕获一致状态</text><text x="940.0" y="776.0" font-size="19" font-weight="400" fill="#455c70" text-anchor="middle">CPU + RAM + devices</text><text x="550" y="827" font-size="22" font-weight="600" fill="#17324d" text-anchor="middle">Restore：兼容性校验 → 暂停状态安装映射与状态 → 显式 resume</text><rect x="30" y="874" width="1040" height="112" rx="12" fill="#e5effa" stroke="#a7bacb" stroke-width="1.8"/><text x="50" y="906" font-size="26" font-weight="650" fill="#17324d" text-anchor="start">私有平台适配</text><rect x="44" y="924" width="498" height="44" rx="12" fill="#ffffff" stroke="#a7bacb" stroke-width="1.8"/><text x="293.0" y="954.0" font-size="22" font-weight="650" fill="#17324d" text-anchor="middle">KVM · vCPU / memory slots / irqchip</text><rect x="558" y="924" width="498" height="44" rx="12" fill="#ffffff" stroke="#a7bacb" stroke-width="1.8"/><text x="807.0" y="954.0" font-size="22" font-weight="650" fill="#17324d" text-anchor="middle">HVF · vCPU / stage-2 mappings / GIC</text><text x="550" y="1025" font-size="22" font-weight="500" fill="#17324d" text-anchor="middle">独立 runner；宿主调用方负责监管、资源绑定和持久化发布</text><rect x="10" y="1074" width="1080" height="64" rx="12" fill="#e9f2fb" stroke="#a7bacb" stroke-width="1.8"/><text x="550.0" y="1114.0" font-size="25" font-weight="650" fill="#17324d" text-anchor="middle">Host OS · Linux / KVM · macOS / Hypervisor.framework</text><rect x="10" y="1156" width="1080" height="60" rx="12" fill="#edf5f3" stroke="#a7bacb" stroke-width="1.8"/><text x="550.0" y="1194.0" font-size="25" font-weight="650" fill="#17324d" text-anchor="middle">Hardware · CPU / RAM / Storage / Network</text><text x="550" y="1255" font-size="20" font-weight="400" fill="#455c70" text-anchor="middle">普通 pause 与完整冻结的停止范围不同；快照持久化事务由宿主存储方负责。</text><text x="550" y="1288" font-size="20" font-weight="400" fill="#455c70" text-anchor="middle">物理共享、冷页与 offload 依平台和 profile；部分模式与完整快照互斥。</text></g></g></svg>