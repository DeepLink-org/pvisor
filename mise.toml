[tasks.setup]
description = "同步锁定的 Python 开发依赖；默认 full 含 guest 编译目标，python 仅准备 Python"
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [[ $# -gt 1 ]]; then echo "usage: setup [full|python]" >&2; exit 2; fi
case "${1:-full}" in
  full|python) ;;
  *) echo "usage: setup [full|python]" >&2; exit 2 ;;
esac
uv sync --locked --only-group dev
if [[ "${1:-full}" == python ]]; then exit 0; fi
case "$(uname -m)" in
  arm64|aarch64) rustup target add aarch64-unknown-linux-musl ;;
  x86_64) rustup target add x86_64-unknown-linux-musl ;;
  *) echo "unsupported guest architecture" >&2; exit 2 ;;
esac
'''
