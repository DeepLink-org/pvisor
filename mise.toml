# One toolchain for local development, CI and wheel builds.
min_version = "2026.10.18"

[tools]
python = "3.12.12"
uv = "0.11.19"
ruff = "0.17.2"
actionlint = "1.7.7"
jq = "1.8.1"
zig = "0.13.0"
"github:nextest-rs/nextest" = { version = "0.9.137", version_prefix = "cargo-nextest-", bin = "cargo-nextest" }
"cargo:cargo-zigbuild" = "0.23.4"
# Keep pinned Cargo plugins ahead of ambient ~/.cargo/bin executables.
# Suppress rustup self-update while installing the project toolchain.
rust = { version = "1.98.0", components = "rustfmt,clippy", profile = "minimal", install_env = { CI = "true" } }

[task_config]
includes = ["tests/tasks.toml"]

[vars]
target_dir = "{{ get_env(name='CARGO_TARGET_DIR', default=config_root ~ '/target') }}"

[env]
# All native tasks and their subprocesses share the selected Rust toolchain.
CARGO_TARGET_DIR = "{{ [config_root, vars.target_dir] | join_path | absolute }}"
# Task inspection must also work before the project tools are installed.
UV_PYTHON = { value = "{% if tools.python is defined %}{{ tools.python.path }}/bin/python3{% else %}python3{% endif %}", tools = true }
UV_PYTHON_DOWNLOADS = "never"
# Keep evidence paths canonical on macOS (/var is a symlink to /private/var).
TMPDIR = "{{ get_env(name='TMPDIR', default='/tmp') | canonicalize }}"

[tasks.benchmark]
description = "不传参数运行 smoke；其他参数指定 benchmark 中的 Markdown 规格或 JSON 表格。"
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [[ $# -eq 0 ]]; then set -- smoke; fi
process_build="$(python3 "$MISE_PROJECT_ROOT/benchmark/run.py" --check "$@")"
if [[ "$process_build" == process ]]; then
  benchmark_repo="${PVISOR_BENCHMARK_REPO:-$MISE_PROJECT_ROOT}"
  benchmark_build="${PVISOR_BENCHMARK_BUILD_DIR:-$CARGO_TARGET_DIR/pvisor-benchmark-build}"
  # Build historical checkouts directly: they need not have mise tasks.
  (
    cd "$benchmark_repo"
    export CARGO_TARGET_DIR="$benchmark_build"
    python3 scripts/packaging/stage_wheel_binaries.py --profile release --target-dir "$benchmark_build" --all
    if [[ "$(uname -s)" == Darwin ]]; then
      for name in pvisor pvisor-tui pvisor-replay pvisor-daemon; do
        codesign --force --sign - --entitlements crates/pvisor/macos-hypervisor.entitlements "$benchmark_build/release/$name"
        codesign --verify --strict "$benchmark_build/release/$name"
      done
    fi
  )
  set -- --binary "$benchmark_build/release/pvisor" "$@"
fi
cargo build --quiet --locked --manifest-path "$MISE_PROJECT_ROOT/tools/semspec/Cargo.toml" --target-dir "$CARGO_TARGET_DIR/semspec"
export SEMSPEC_BIN="$CARGO_TARGET_DIR/semspec/debug/semspec"
python3 "$MISE_PROJECT_ROOT/benchmark/run.py" "$@"
'''

[tasks.benchmark-compare]
description = "benchmark-compare"
hide = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [[ $# -lt 1 ]]; then echo "usage: mise run benchmark-compare candidate baseline output threshold" >&2; exit 2; fi
if [[ $# -gt 4 ]]; then echo "too many arguments for benchmark-compare" >&2; exit 2; fi
if [[ $# -lt 2 ]]; then set -- "$@" ''; fi
if [[ $# -lt 3 ]]; then set -- "$@" benchmark/process/.data/comparison; fi
if [[ $# -lt 4 ]]; then set -- "$@" 15; fi
python3 benchmark/process/compare.py --candidate "$1" --baseline "$2" --output "$3" --threshold "$4"
'''

