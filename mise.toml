[tasks.docs-build]
description = "构建并检查双语文档；支持 --require-recorded"
run = '''
#!/usr/bin/env bash
set -euo pipefail
python3 benchmark/docs.py check
python3 scripts/check-reference.py
python3 scripts/check-docs.py --preflight-build
cargo build --quiet --locked --manifest-path tools/semspec/Cargo.toml --target-dir "$CARGO_TARGET_DIR/semspec"
rm -rf docs/site
PVISOR_DOCS_LIVE=0 PYTHONPATH="$MISE_PROJECT_ROOT${PYTHONPATH:+:$PYTHONPATH}" SEMSPEC_BIN="$CARGO_TARGET_DIR/semspec/debug/semspec" uv run --locked --only-group dev zensical build --clean --strict -f docs/zensical.zh.toml
PVISOR_DOCS_LIVE=0 PYTHONPATH="$MISE_PROJECT_ROOT${PYTHONPATH:+:$PYTHONPATH}" SEMSPEC_BIN="$CARGO_TARGET_DIR/semspec/debug/semspec" uv run --locked --only-group dev zensical build --clean --strict -f docs/zensical.en.toml
cp docs/index.html docs/site/index.html
python3 scripts/check-docs.py "$@"
'''

[tasks.docs-serve]
description = "本地 zh/en 预览；其余参数传给 Zensical"
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [[ $# -lt 1 ]]; then set -- "$@" zh; fi
case "$1" in
  zh|en) config="docs/zensical.$1.toml" ;;
  *) echo "expected zh or en, got: $1" >&2; exit 2 ;;
esac
shift
if ! python3 scripts/check-docs.py --preflight-build; then
  echo "warning: documentation preflight failed; continuing live preview" >&2
fi
if ! cargo build --quiet --locked --manifest-path tools/semspec/Cargo.toml --target-dir "$CARGO_TARGET_DIR/semspec"; then
  echo "warning: semspec build failed; continuing live preview with the existing renderer when available" >&2
fi
export PVISOR_DOCS_LIVE=1
export PYTHONPATH="$MISE_PROJECT_ROOT${PYTHONPATH:+:$PYTHONPATH}"
export SEMSPEC_BIN="$CARGO_TARGET_DIR/semspec/debug/semspec"
exec uv run --locked --only-group dev zensical serve -f "$config" "$@"
'''

[tasks.doctor]
description = "诊断工具与系统能力；suite: dev/build/test/fw/docs/isolation"
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [[ $# -gt 1 ]]; then echo "too many arguments for doctor" >&2; exit 2; fi
if [[ $# -lt 1 ]]; then set -- "$@" dev; fi
case "$1" in
  dev) tools=(mise cargo rustc python3 uv jq actionlint); nextest=1 ;;
  build) tools=(mise cargo rustc python3 uv); nextest=0 ;;
  test) tools=(mise cargo python3 uv jq); nextest=1 ;;
  fw) tools=(python3 uv make cc); nextest=0 ;;
  docs) tools=(python3 uv); nextest=0 ;;
  isolation) tools=(cargo unshare fusermount3); nextest=1 ;;
  *) echo "unknown doctor suite: $1" >&2; exit 2 ;;
esac
missing=0
for tool in "${tools[@]}"; do
  if command -v "$tool" >/dev/null; then
    printf '%s: %s\n' "$tool" "$(command -v "$tool")"
  else
    echo "$tool: missing" >&2
    missing=1
  fi
done
if [[ "$nextest" == 1 ]]; then cargo nextest --version || missing=1; fi
if [[ "$1" == build || "$1" == dev ]]; then
  if [[ "$(uname -s)-$(uname -m)" == Linux-x86_64 ]]; then
    command -v zig >/dev/null || missing=1
    cargo zigbuild --help >/dev/null || missing=1
  fi
fi
if [[ "$1" == isolation ]]; then
  test -c /dev/fuse || missing=1
  unshare --user --map-root-user --mount --net /bin/true || missing=1
fi
exit "$missing"
'''

[tasks.example-01-filesystem-isolation]
description = "example-01-filesystem-isolation"
hide = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [[ $# -gt 0 ]]; then echo "too many arguments for example-01-filesystem-isolation" >&2; exit 2; fi

example_dir="$MISE_PROJECT_ROOT/examples/pvisor/01-filesystem-isolation"
work_root="${WORK_ROOT:-$example_dir/.work}"
work_dir="$work_root/filesystem-isolation"
export WORK_ROOT="$work_root"

bash "$example_dir/run.sh"

base="$work_dir/base"
run_dir="$(find "$work_dir/runs" -mindepth 1 -maxdepth 1 -type d -name 'run-*' -print -quit)"
test -n "$run_dir"
test "$(cat "$base/existing.txt")" = original
test ! -e "$base/new.txt"
test "$(cat "$run_dir/upper/existing.txt")" = changed
test "$(cat "$run_dir/upper/new.txt")" = new
jq -e '
  .run.state == "completed" and
  .filesystem.state == "staged" and
  .filesystem.changed_files == 2 and
  .safety.filesystem_changes_staged == true and
  .safety.filesystem_non_bypassable == true
' "$run_dir/run-bundle.json" >/dev/null

echo 'RESULT example=filesystem-isolation base_unchanged=true staged_changes=2'
'''

