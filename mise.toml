[tasks.vm-probe-build]
description = "vm-probe-build"
hide = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [[ $# -lt 2 ]]; then echo "usage: mise run vm-probe-build package example args" >&2; exit 2; fi
if [[ "$(uname -s)-$(uname -m)" != Darwin-arm64 ]]; then
  echo "VM restore probes require Apple Silicon macOS with Hypervisor entitlement" >&2
  exit 2
fi
package="$1"
example="$2"
shift 2
cargo build --locked -p "$package" --example "$example" --target-dir "$CARGO_TARGET_DIR" "$@"
binary="$CARGO_TARGET_DIR/debug/examples/$example"
test -x "$binary"
codesign --force --sign - --entitlements "$MISE_PROJECT_ROOT/crates/pvisor/macos-hypervisor.entitlements" "$binary"
codesign --verify --strict "$binary"
'''

