[tasks.test-py]
description = "无参数时覆盖 tests/、活动 benchmark 和命令计时测试"
run = '''
#!/usr/bin/env bash
set -euo pipefail
export PYTHONPATH="$MISE_PROJECT_ROOT/benchmark/support${PYTHONPATH:+:$PYTHONPATH}"
selected=0
option_value=0
for arg in "$@"; do
  if [[ "$option_value" == 1 ]]; then option_value=0; continue; fi
  case "$arg" in
    -k|-s|-p|-t|--start-directory|--pattern|--top-level-directory) option_value=1 ;;
    -*) ;;
    *) selected=1 ;;
  esac
done
if [[ "$selected" == 0 ]]; then
  uv run --locked --only-group dev python -m unittest discover -s tests "$@"
  uv run --locked --only-group dev python -m unittest discover -s benchmark/support "$@"
  uv run --locked --only-group dev python -m unittest discover -s tools/semspec "$@"
  for suite in tests filesystem memory; do
    uv run --locked --only-group dev python -m unittest discover -s "benchmark/$suite" "$@"
  done
else
  uv run --locked --only-group dev python -m unittest "$@"
fi
'''

