[project]
name = "pvisor"
version = "0.3.0"
description = "Scaling autonomous agent execution"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    {name = "reiase"}
]

[project.urls]
Homepage = "https://deeplink-org.github.io/pvisor/"
Documentation = "https://deeplink-org.github.io/pvisor/"
Repository = "https://github.com/DeepLink-org/pvisor"
Issues = "https://github.com/DeepLink-org/pvisor/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
include = ["pvisor*"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "build_backend"
backend-path = ["scripts/packaging"]

[tool.cibuildwheel]
build = "cp312-*"
# Nightly/PyPI only publish manylinux + macOS wheels; musllinux is unused
# and its before-all still assumes yum.
skip = "*-musllinux_*"
build-frontend = "build"

[tool.cibuildwheel.linux]
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux_2_28"
before-all = [
    "yum install -y curl",
    "/opt/python/cp312-cp312/bin/python -m pip install ziglang==0.13.0",
    "ln -sf $(/opt/python/cp312-cp312/bin/python -c 'import pathlib, ziglang; print(pathlib.Path(ziglang.__file__).parent / \"zig\")') /usr/local/bin/zig",
    "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable",
    "$HOME/.cargo/bin/rustup target add x86_64-unknown-linux-musl",
    "$HOME/.cargo/bin/cargo install cargo-zigbuild --locked",
]
# Static musl CLI, with its kernel embedded. Keep the manylinux wheel tag
# for glibc Python installers; the CLI has no glibc runtime dependency.
environment = { PATH = "$HOME/.cargo/bin:$PATH" }

[tool.cibuildwheel.macos]
archs = ["arm64"]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }
repair-wheel-command = "cp {wheel} {dest_dir}"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "benchmark/pvisor"]
