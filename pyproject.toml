[project]
name = "pvisor-sandbox"
version = "0.3.1"
description = "Scaling autonomous agent execution"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    {name = "reiase"}
]

# Runtime wheels remain dependency-free; these packages belong only to contributors.
[dependency-groups]
dev = [
    "setuptools>=77",
    "pyelftools==0.33",
    "zensical==0.0.67",
    "cibuildwheel==4.1.0",
    "twine>=6,<7",
]

[project.urls]
Homepage = "https://deeplink-org.github.io/pvisor/"
Documentation = "https://deeplink-org.github.io/pvisor/"
Repository = "https://github.com/DeepLink-org/pvisor"
Issues = "https://github.com/DeepLink-org/pvisor/issues"

[tool.uv.dependency-groups]
dev = { requires-python = ">=3.12" }

[tool.setuptools.packages.find]
include = ["pvisor*"]

[build-system]
requires = ["setuptools>=77", "pyelftools==0.33"]
build-backend = "build_backend"
backend-path = ["scripts/packaging"]

[tool.cibuildwheel]
build = "cp312-*"
# Nightly/PyPI only publish manylinux + macOS wheels; musllinux is unused
# and its before-all still assumes yum.
skip = "*-musllinux_*"
build-frontend = "build"

[tool.cibuildwheel.linux]
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux_2_28"
before-all = [
    "yum install -y gcc gcc-c++ make flex bison elfutils-libelf-devel openssl-devel curl bc perl patch tar gzip xz",
    "curl -fsSL https://mise.run | MISE_VERSION=v2026.10.18 sh",
    "$HOME/.local/bin/mise trust /project/mise.toml",
    "cd /project && $HOME/.local/bin/mise install --locked",
    "$HOME/.local/bin/mise reshim",
    # Keep cibuildwheel's selected Python ahead of mise's Python.
    "for tool in cargo rustc cargo-zigbuild zig uv; do ln -sf \"${MISE_DATA_DIR:-$HOME/.local/share/mise}/shims/$tool\" \"$HOME/.local/bin/$tool\"; done",
    "cd /project && $HOME/.local/bin/mise run setup",
]
# Static musl CLI, with its kernel embedded. Keep the manylinux wheel tag
# for glibc Python installers; the CLI has no glibc runtime dependency.
environment = { PATH = "$HOME/.local/bin:$HOME/.cargo/bin:$PATH", PVISOR_FW_BUILD_DIR = "/project/target/fw" }

[tool.cibuildwheel.macos]
archs = ["arm64"]
before-all = '''
set -eu
brew install llvm lld make gnu-sed gnu-tar
image="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/pvisor-fw.sparseimage"
volume="/Volumes/pvisor-fw-${GITHUB_RUN_ID:-}-${GITHUB_RUN_ATTEMPT:-}"
if ! mount | grep -Fq " on $volume ("; then
    if [ ! -f "$image" ]; then
        hdiutil create -size 32g -type SPARSE -fs APFSX -volname pvisor-fw "$image"
    fi
    hdiutil attach -nobrowse -mountpoint "$volume" "$image"
fi
mkdir -p "$volume/build"
'''
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0", PVISOR_FW_BUILD_DIR = "/Volumes/pvisor-fw-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/build", PATH = "$(brew --prefix)/opt/llvm/bin:$(brew --prefix)/opt/lld/bin:$(brew --prefix)/opt/make/libexec/gnubin:$(brew --prefix)/opt/gnu-sed/libexec/gnubin:$(brew --prefix)/opt/gnu-tar/libexec/gnubin:$PATH" }
repair-wheel-command = "cp {wheel} {dest_dir}"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
