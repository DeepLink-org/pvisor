[project]
name = "pVisor learning path"
spec_dirs = ["docs/src/zh/cases"]
ledger = "tests/semantics/REVIEWED.toml"

[subject]
bin = "target/release/pvisor"
language = "bash"
vocab = ["tests/semantics/vocab/core.sh", "tests/semantics/vocab/journey.sh"]
env = { RUST_LOG = "warn" }
timeout = "60s"

[platforms]
macos = { os = "macos" }
linux = { os = "linux" }
