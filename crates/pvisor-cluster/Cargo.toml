[package]
name = "pvisor-cluster"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Durable distributed scheduling and worker protocol for pVisor"

[dependencies]
anyhow.workspace = true
axum = { workspace = true, features = ["http1", "json", "tokio"] }
blake3.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
fs2.workspace = true
pvisor-core.workspace = true
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }

[dev-dependencies]
tempfile.workspace = true
