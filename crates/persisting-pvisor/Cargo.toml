[package]
name = "persisting-pvisor"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "pVisor foreground Agent Run manager and portable execution runtime"
readme = "README.md"
build = "build.rs"

[features]
default = []
jujutsu-overlay = ["persisting-overlayfs/jujutsu"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
dirs.workspace = true
flate2.workspace = true
fs2.workspace = true
globset.workspace = true
libc.workspace = true
persisting-control.workspace = true
persisting-gateway = { workspace = true, default-features = false }
persisting-overlaynet.workspace = true
persisting-overlayfs = { workspace = true, default-features = false }
persisting-overlay-core.workspace = true
persisting-replay.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
thiserror.workspace = true
toml.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time", "net"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }
zstd.workspace = true
reqwest = { workspace = true, features = ["blocking", "json", "rustls-tls"] }

[target.'cfg(not(all(target_os = "macos", target_arch = "x86_64")))'.dependencies]
libkrun = { workspace = true, features = ["net"] }

[[bin]]
name = "pvisor"
path = "src/bin/pvisor.rs"

[dev-dependencies]
proptest.workspace = true

[build-dependencies]
libloading.workspace = true
