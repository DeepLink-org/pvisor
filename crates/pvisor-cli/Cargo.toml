[package]
name = "pvisor-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "pVisor command-line application frontends"
readme = "README.md"
default-run = "pvisor"

[features]
default = []
gateway = ["pvisor/gateway", "dep:pvisor-gateway"]

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["derive", "env", "string"] }
serde_json.workspace = true
pvisor-guest = { path = "../pvisor-guest" }

[target.'cfg(unix)'.dependencies]
pvisor = { path = "../pvisor", default-features = false }
async-trait.workspace = true
blake3.workspace = true

dirs.workspace = true
fs2.workspace = true
libc.workspace = true
pvisor-core.workspace = true
pvisor-journal.workspace = true
pvisor-replay.workspace = true
pvisor-gateway = { workspace = true, default-features = false, optional = true }

pvisor-overlaynet.workspace = true
pvisor-overlay-core.workspace = true
serde = { workspace = true, features = ["derive"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time", "net"] }
tokio-util = { workspace = true, features = ["rt"] }
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }

[target.'cfg(all(unix, not(all(target_os = "macos", target_arch = "x86_64"))))'.dependencies]
pvisor-vm = { workspace = true, features = ["net"] }

[target.'cfg(windows)'.dependencies]
pvisor-vm.workspace = true

[dev-dependencies]

proptest.workspace = true
serde_yaml.workspace = true

sha2.workspace = true

tokio = { workspace = true, features = ["test-util"] }


[target.'cfg(any(all(target_os = "linux", target_arch = "x86_64"), all(target_os = "macos", target_arch = "aarch64")))'.dev-dependencies]
vm-memory = { version = "=0.17.1", features = ["backend-mmap"] }

[[bin]]
name = "pvisor"
path = "src/bin/pvisor.rs"

[[bin]]
name = "pvisor-replay"
path = "src/bin/pvisor-replay.rs"
