[package]
name = "pvisor-daemon"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Node-local sandbox lifecycle and OpenSandbox API for pVisor"
autobins = false
default-run = "pvisor-daemon"


[[bin]]
name = "pvisor-daemon"
path = "src/main.rs"


[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum = { workspace = true, features = ["http1", "json", "query", "tokio"] }

chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true, features = ["derive", "env"] }
fs2.workspace = true
libc.workspace = true

reqwest = { workspace = true, features = ["json", "rustls-tls", "stream"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "process", "io-util"] }
url.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }

[dev-dependencies]
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
