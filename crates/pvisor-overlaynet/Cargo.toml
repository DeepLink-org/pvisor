[package]
name = "pvisor-overlaynet"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Network interception and egress policy drivers for pVisor"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum = { workspace = true, features = ["http1", "http2", "tokio"] }
bytes.workspace = true
futures-util = { workspace = true, features = ["async-await", "std"] }
fs2.workspace = true
libc.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util = { workspace = true, features = ["tokio"] }
pvisor-core.workspace = true
reqwest = { workspace = true, features = ["rustls-tls", "stream"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
smoltcp = { workspace = true, features = ["std", "log", "medium-ethernet", "proto-ipv4", "proto-dhcpv4", "proto-dns", "socket-tcp", "socket-udp", "socket-tcp-pause-synack"] }
tokio = { workspace = true, features = ["net", "io-util", "rt", "sync", "time"] }
tracing.workspace = true
thiserror.workspace = true
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
