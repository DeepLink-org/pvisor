[package]
name = "pvisor-vm"
version.workspace = true
edition = "2021"
license.workspace = true
description = "Owned Rust microVM runtime, architecture and device backends for pVisor"

[features]
amd-sev = ["tee", "blk", "bitfield", "dep:bitflags2", "iocuddle", "kbs-types", "serde"]
aws-nitro = []
blk = []
default = ["init-blob"]
efi = ["blk", "net"]
gpu = ["rutabaga_gfx", "thiserror", "zerocopy", "krun_display"]
init-blob = []
input = ["zerocopy", "krun_input"]
net = []
serde = []
snd = ["pw", "thiserror"]
tdx = ["tee", "dep:tdx", "blk", "kbs-types", "serde"]
tee = []
test_utils = []
virgl_resource_map2 = []

[dependencies]
anyhow.workspace = true
tracing.workspace = true
tempfile = "3"
bitfield = { version = "0.19.4", optional = true }
bitflags = { version = "1.2.0" }
bitflags2 = { version = "2.10.0", optional = true, package = "bitflags" }
crossbeam-channel = { version = ">=0.5.15" }
env_logger = { version = "0.11" }
flate2 = { version = "1.0.35" }
imago = { version = "0.2.2", features = ["sync-wrappers"] }
iocuddle = { version = "0.1.1", optional = true }
kbs-types = { version = "0.13.0", optional = true }
krun_display = { version = "0.1.0", features = ["bindgen_clang_runtime"], optional = true, package = "krun-display" }
krun_input = { version = "0.1.0", features = ["bindgen_clang_runtime"], optional = true, package = "krun-input" }
libc = { version = ">=0.2.39" }
libloading = { version = "0.8" }
linux-loader = { version = "0.13.2", features = ["bzimage", "elf", "pe"] }
log = { version = "0.4.0" }
nix = { version = "0.30.1", features = ["fs", "ioctl", "net", "poll", "socket", "term"] }
pvisor-overlay-core = { path = "../pvisor-overlay-core" }
pw = { version = "0.9.2", optional = true, package = "pipewire" }
rand = { version = "0.9.2" }
rutabaga_gfx = { version = "=0.1.0-1.19.3", features = ["virgl_renderer", "virgl_renderer_next"], optional = true, package = "krun-rutabaga-gfx" }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1" }
sha2 = { version = "0.11" }
thiserror = { version = "2.0", optional = true }
virtio-bindings = { version = "0.2.0" }
vm-memory = { version = "=0.17.1", features = ["backend-mmap"] }
vmm-sys-util = { version = "0.14", features = ["with-serde"] }
zerocopy = { version = "0.8.26", features = ["derive"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { workspace = true, default-features = false, features = ["abi-7-31"] }
caps = { version = "0.5.5" }
kvm-bindings = { version = "0.12", features = ["fam-wrappers", "serde"] }
kvm-ioctls = { version = "0.22" }
rutabaga_gfx = { version = "=0.1.0-1.19.3", features = ["x"], optional = true, package = "krun-rutabaga-gfx" }
tdx = { version = "0.1.0", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
fuser = { workspace = true, features = ["abi-7-19", "libfuse", "macfuse-5"] }
lru = { version = ">=0.9" }
nix = { version = "0.30.1", features = ["fs"] }

[target.'cfg(any(target_arch = "aarch64", target_arch = "riscv64"))'.dependencies]
vm-fdt = { version = ">= 0.2.0" }

[target.'cfg(target_arch = "x86_64")'.dependencies]
bzip2 = { version = "0.5" }
zstd = { version = "0.13" }

[dev-dependencies]
toml.workspace = true
syn = { version = "2", features = ["full", "visit"] }
pvisor = { path = "../pvisor", default-features = false }

[build-dependencies]
cc = "1"
libloading.workspace = true

[[example]]
name = "hvf_cold_restore_case"
path = "src/probes/hvf_cold_restore_case.rs"

[[example]]
name = "hvf_ram_fault_case"
path = "src/probes/hvf_ram_fault_case.rs"

[[example]]
name = "threaded_cold_restore_case"
path = "src/probes/threaded_cold_restore_case.rs"
