[package]
name = "semspec"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
description = "Human-reviewed black-box semantic preservation specifications"

[workspace]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
shell-words = "1"
similar = "2"
tempfile = "3"
toml = "0.8"
tree-sitter = "0.25"
tree-sitter-bash = "0.25"

[profile.dev]
debug = 0

[profile.test]
debug = 0
