[project]
name = "semspec"
spec_dirs = ["."]
ledger = "REVIEWED.toml"
approved_snapshots = ".approved"
retired = []
[subject]
bin = "../target/debug/semspec"
language = "bash"
vocab = ["vocab/core.sh", "vocab/fixture.sh"]
env = {}
timeout = "30s"
[platforms]
macos = { os = "macos" }
linux = { os = "linux" }
[requirements.python.macos]
command_succeeds = ["python3", "--version"]
[requirements.python.linux]
command_succeeds = ["python3", "--version"]
