[workspace.package]
version = "0.3.0"
edition = "2024"
authors = ["reiase"]
license = "Apache-2.0"
description = "Reviewable Agent execution boundary"

[workspace]
resolver = "3"
members = [
    "crates/persisting-control",
    "crates/persisting-gateway",
    "crates/persisting-pvisor",
    "crates/persisting-replay",
    "crates/persisting-overlayfs",
    "crates/persisting-overlay-core",
    "crates/persisting-overlaynet",
]
exclude = ["vendor/libkrun", "vendor/krun-vmm", "vendor/krun-devices"]

default-members = [
    "crates/persisting-pvisor",
]

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", default-features = false }
base64 = "0.22"
blake3 = "1"
bytes = "1"
chrono = "0.4"
clap = "4"
dashmap = "6"
dirs = "6"
env_logger = "0.11"
fs2 = "0.4"
flate2 = "1"
fuser = { version = "0.15", default-features = false }
futures-util = { version = "0.3", default-features = false }
globset = "0.4"
hostname = "0.4"
http-body-util = "0.1"
hyper = "1"
hyper-util = { version = "0.1", default-features = false }
ipnet = "2"
jj-lib = "0.43.0"
libc = "0.2"
libloading = "0.8"
libkrun = "=1.19.3"
log = "0.4"
persisting-control = { path = "crates/persisting-control" }
persisting-gateway = { path = "crates/persisting-gateway", default-features = false }
persisting-overlayfs = { path = "crates/persisting-overlayfs", default-features = false }
persisting-overlay-core = { path = "crates/persisting-overlay-core" }
persisting-overlaynet = { path = "crates/persisting-overlaynet" }
persisting-replay = { path = "crates/persisting-replay" }
pollster = "0.4"
pulsing-actor = { version = "0.1.2", default-features = false }
proptest = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false }
serde = "1"
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"
smoltcp = { version = "0.13.1", default-features = false }
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", default-features = false }
tokio-stream = "0.1"
tokio-util = { version = "0.7", default-features = false }
toml = "0.8"
tracing = "0.1"
url = "2"
uuid = "1"
zstd = "0.13"

[profile.dev]
# Keep incremental compilation for the normal edit/build/check loop, but omit
# debug information to limit artifact size. The test profile below disables incremental state
# because its many binaries and feature combinations otherwise dominate disk.
# Use `--profile dev-debug` when source-level debugger information is needed.
# `debug = 0` already omits debug info; `strip = "none"` avoids a redundant
# post-link copy that doubles peak disk usage for large test executables.
# Keep split DWARF disabled on macOS, where the active toolchain may not ship a
# runnable `rust-objcopy`/LLVM pair.
debug = 0
incremental = true
codegen-units = 64
strip = "none"
split-debuginfo = "off"

[profile.test]
debug = 0
incremental = false
codegen-units = 64
strip = "none"
split-debuginfo = "off"

[profile.dev-debug]
inherits = "dev"
debug = "line-tables-only"
incremental = true
codegen-units = 256
strip = "none"
split-debuginfo = "off"

[profile.release]
# Release artifacts are distributed binaries, so optimize their installed and
# download size by default. Thin LTO retains most cross-crate size wins without
# imposing the full link-time cost of Fat LTO.
opt-level = "z"
lto = "thin"
strip = "symbols"
codegen-units = 8
panic = "abort"

# Build scripts and proc macros do not need release stripping. Keeping their
# symbols avoids invoking a host rust-objcopy that may be unavailable when
# cross-compiling from macOS, while the final application remains stripped.
[profile.release.build-override]
strip = "none"

[patch.crates-io]
fuser = { path = "vendor/fuser" }
libkrun = { path = "vendor/libkrun" }
krun-init-blob = { path = "vendor/krun-init-blob" }
krun-vmm = { path = "vendor/krun-vmm" }
krun-devices = { path = "vendor/krun-devices" }
